  }catch(e){toast('Copia o endereço na barra do navegador.')}
}
function setPref(k,v){prefs[k]=v;lsSet('estante:prefs',JSON.stringify(prefs));applyPrefs()}
function applyPrefs(){
  var art=document.querySelector('.reading');
  if(art){art.style.fontSize=prefs.size+'px';art.classList.toggle('sans',prefs.font==='sans')}
  if(prefs.theme==='auto')delete document.body.dataset.rt;else document.body.dataset.rt=prefs.theme;

function friendly(err){

}
function readCover(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var W=480,H=720,c=document.createElement('canvas');c.width=W;c.height=H;
        var ctx=c.getContext('2d'),s=Math.max(W/img.width,H/img.height),w=img.width*s,hh=img.height*s;
        ctx.drawImage(img,(W-w)/2,(H-hh)/2,w,hh);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=function(){rej(new Error('Imagem inválida.'))};
      img.src=fr.result;
    };
    fr.onerror=function(){rej(new Error('Não consegui ler a imagem.'))};
    fr.readAsDataURL(file);
  });
}

/* ---------- PDF import ---------- */
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script');s.src=src;s.onload=res;
    s.onerror=function(){rej(new Error('Não foi possível carregar o leitor de PDF.'))};
    document.head.appendChild(s);
  });
}
var pdfReady=null;
function loadPdfJs(){
  if(!pdfReady)pdfReady=(function(){
    var base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    return loadScript(base+'pdf.min.js').then(function(){return loadScript(base+'pdf.worker.min.js')}).then(function(){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
    });
  })();
  return pdfReady;
}
function pageLines(items){
  var lines=[],cur=null;
  items.forEach(function(it){
    if(typeof it.str!=='string')return;
    var s=it.str,x=it.transform[4],y=it.transform[5],sz=Math.abs(it.transform[3])||it.height||10,w=it.width||0;
    if(s.trim()===''&&!cur)return;
    if(!cur||Math.abs(cur.y-y)>Math.max(2,cur.sz*0.4)){
      if(cur)lines.push(cur);
      cur={t:'',x:x,xe:x,y:y,sz:sz,last:null};
    }
    if(cur.t&&!/\s$/.test(cur.t)&&!/^\s/.test(s)&&cur.last!==null&&(x-cur.last)>sz*0.12)cur.t+=' ';
    cur.t+=s;cur.last=x+w;cur.xe=x+w;cur.sz=Math.max(cur.sz,sz);
  });
  if(cur)lines.push(cur);
  return lines.map(function(l){
    l.t=l.t.replace(/[ﬀ-ﬆ]/g,function(c){return {'ﬀ':'ff','ﬁ':'fi','ﬂ':'fl','ﬃ':'ffi','ﬄ':'ffl','ﬅ':'st','ﬆ':'st'}[c]}).replace(/\s+/g,' ').trim();
    delete l.last;return l;
  }).filter(function(l){return l.t});
}
function importPdf(file,onProgress){
  return loadPdfJs().then(function(){return file.arrayBuffer()}).then(function(buf){
    return window.pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableFontFace:true}).promise;
  }).then(function(pdf){
    var pages=[],n=pdf.numPages;
    function step(i){
      if(i>n)return Promise.resolve(pages);
      return pdf.getPage(i).then(function(p){return p.getTextContent()}).then(function(tc){
        pages.push(pageLines(tc.items));onProgress(i,n);
        return new Promise(function(r){setTimeout(r,0)});
      }).then(function(){return step(i+1)});
    }
    return step(1);
  }).then(analyze);
}

var WORDNUM='\\d{1,3}|um|uma|dois|duas|tr[eê]s|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|catorze|quatorze|quinze|dezasseis|dezesseis|dezassete|dezessete|dezoito|dezanove|dezenove|vinte|trinta|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|primeir[oa]|segund[oa]|terceir[oa]|[úu]ltim[oa]|final|[úu]nic[oa]';
var RE_WORD=new RegExp('^(cap[ií]tulo|cap\\.|chapter|parte|part|livro|book|ato|acto|act|cena|scene)\\s*('+WORDNUM+')\\b[\\s.:–—-]*(.*)$','i');
var RE_ROMAN=/^(Cap[ií]tulo|CAP[IÍ]TULO|Parte|PARTE|Livro|LIVRO|Chapter|CHAPTER|Part|PART|Book|BOOK)\s+([IVXLCDM]{1,8})\b[\s.:–—-]*(.*)$/;
var RE_NAMED=/^(pr[oó]logo|ep[ií]logo|pref[aá]cio|introdu[cç][aã]o|agradecimentos|dedicat[oó]ria|nota do autor|nota da autora|interl[uú]dio|posf[aá]cio|prologue|epilogue|preface|introduction|acknowledg(?:e)?ments)\s*[.:]?$/i;
var SMALL=['de','da','do','das','dos','e','a','o','as','os','em','no','na','nos','nas','um','uma','para','por','com','the','of','and','in','to'];

function titleCase(s){
  var ws=s.toLowerCase().split(' ');
  return ws.map(function(w,i){
    if(i===1&&/^(cap[ií]tulo|parte|livro|chapter|part|book)$/.test(ws[0])&&/^[ivxlcdm]{1,8}$/.test(w))return w.toUpperCase();
    return (i===0||SMALL.indexOf(w)<0)?w.charAt(0).toUpperCase()+w.slice(1):w;
  }).join(' ');
}
function tidyTitle(s){
  s=s.replace(/\s+/g,' ').replace(/\s*[–—:-]\s*[–—:-]+\s*/g,' — ').trim().replace(/[\s.:–—-]+$/,'');
  if(s===s.toUpperCase()&&/[A-ZÀ-Ý]{3}/.test(s))s=titleCase(s);
  return s||'Sem título';
}
function headingOf(l,body){
  var t=l.t,m;
  if(t.length>90)return null;
  if((m=RE_WORD.exec(t))||(m=RE_ROMAN.exec(t))){
    var rest=(m[3]||'').trim();
    if(rest.length>60)return null;
    var numeric=/^\d/.test(m[2])||/^[IVXLCDM]+$/.test(m[2]);
    if(!numeric&&rest&&!/[.:–—-]/.test(t.slice(0,24)))return null;
    return{type:'kw',head:(m[1]+' '+m[2]).replace(/\s+/g,' ').trim(),rest:rest};
  }
  if(RE_NAMED.test(t))return{type:'kw',head:t.replace(/[.:]$/,''),rest:''};
  if(l.first&&/^(\d{1,3}|[IVXLCDM]{1,8})\.?$/.test(t)&&l.sz>=body*1.25)return{type:'kw',head:'Capítulo '+t.replace('.',''),rest:''};
  if(l.first&&l.sz>=body*1.3&&t.length>=3&&!/[,;]$/.test(t)&&/[A-Za-zÀ-ÿ]{3}/.test(t))return{type:'big',head:t,rest:''};
  if(l.first&&l.sz>=body*1.08&&t===t.toUpperCase()&&/[A-ZÀ-Ý]{3}/.test(t)&&t.length<=60)return{type:'big',head:t,rest:''};
  return null;
}
function toParagraphs(lines,st){
  var paras=[],cur='',prev=null;
  lines.forEach(function(l){
    var t=l.t;
    if(!prev){cur=t;prev=l;return}
    var samePage=l.pg===prev.pg,gap=prev.y-l.y;
    var vGap=samePage&&gap>st.lh*1.5;
    var indent=samePage&&l.x>st.margin+l.sz*0.9;
    var dialog=/^[—–]/.test(t)||/^-\s/.test(t);
    var prevEnds=/[.!?…:”"»)\]]$/.test(cur.trim());
    var prevShort=prev.t.length<st.longLen*0.72;
    if(vGap||dialog||(indent&&prevEnds)||(prevEnds&&prevShort)){paras.push(cur);cur=t}
    else if(/[A-Za-zÀ-ÿ]-$/.test(cur)&&/^[a-zà-ÿ]/.test(t))cur=cur.slice(0,-1)+t;
    else cur+=' '+t;
    prev=l;
  });
  if(cur)paras.push(cur);
  return paras.join('\n\n');
}
function analyze(rawPages){
  var allRaw=[].concat.apply([],rawPages);
  if(!allRaw.length){var er=new Error('noText');er.code='noText';throw er}
  var szCount={};
  allRaw.forEach(function(l){var k=Math.round(l.sz*2)/2;szCount[k]=(szCount[k]||0)+l.t.length});
  var body=10,best=0;
  Object.keys(szCount).forEach(function(k){if(szCount[k]>best){best=szCount[k];body=parseFloat(k)}});

  var norm=function(t){return t.toLowerCase().replace(/\d+/g,'#').replace(/\s+/g,' ').trim()};
  var isHead=function(t){return RE_WORD.test(t)||RE_ROMAN.test(t)||RE_NAMED.test(t)};
  var counts={};
  rawPages.forEach(function(p){
    var seen={};
    p.slice(0,2).concat(p.slice(-2)).forEach(function(l){var k=norm(l.t);if(!seen[k]){seen[k]=1;counts[k]=(counts[k]||0)+1}});
  });
  var thr=Math.max(3,Math.floor(rawPages.length*0.25));
  var pages=rawPages.map(function(p){
    return p.filter(function(l,i){
      var edge=i<2||i>=p.length-2;
      if(!edge)return true;
      if(isHead(l.t))return true;
      if(counts[norm(l.t)]>=thr&&l.t.length<90)return false;
      if(/^(?:p[áa]gina\s*)?[-–—]?\s*\d{1,4}\s*[-–—]?$/i.test(l.t)&&l.sz<body*1.2)return false;
      return true;
    });
  });
  var all=[];
  pages.forEach(function(p,pi){p.forEach(function(l,i){l.pg=pi;l.first=i===0;all.push(l)})});
  if(!all.length){var er2=new Error('noText');er2.code='noText';throw er2}

  var gaps=[];
  for(var i=1;i<all.length;i++){var d=all[i-1].y-all[i].y;if(all[i].pg===all[i-1].pg&&d>0&&d<body*3)gaps.push(d)}
  gaps.sort(function(a,b){return a-b});
  var lh=gaps.length?gaps[Math.floor(gaps.length/2)]:body*1.3;
  var xs={};
  all.forEach(function(l){if(l.t.length>=40){var k=Math.round(l.x/2)*2;xs[k]=(xs[k]||0)+1}});
  var margin=0,mb=0;Object.keys(xs).forEach(function(k){if(xs[k]>mb){mb=xs[k];margin=parseFloat(k)}});
  var lens=all.map(function(l){return l.t.length}).sort(function(a,b){return a-b});
  var st={lh:lh,margin:margin,longLen:lens[Math.floor(lens.length*0.9)]||60};

  var chapters=[],cur=null,front=[];
  for(var j=0;j<all.length;j++){
    var l=all[j],hd=headingOf(l,body);
    if(hd){
      var title=hd.head+(hd.rest?' — '+hd.rest:''),used=0,n=all[j+1];
      if(hd.type==='kw'&&!hd.rest&&n&&n.pg===l.pg&&n.t.length<=70&&!/[.!?…,;]$/.test(n.t)&&!headingOf(n,body)&&(n.sz>=body*1.1||(n.t===n.t.toUpperCase()&&/[A-ZÀ-Ý]{3}/.test(n.t)))){title+=' — '+n.t;used=1}
      else if(hd.type==='big'&&n&&n.pg===l.pg&&Math.abs(n.sz-l.sz)<0.6&&n.t.length<=60&&!/[.!?…]$/.test(n.t)){title+=' '+n.t;used=1}
      cur={title:tidyTitle(title),lines:[]};chapters.push(cur);j+=used;continue;
    }
    (cur?cur.lines:front).push(l);
  }

  var note='';
  if(chapters.length<2){
    var text=toParagraphs(all,st),paras=text.split('\n\n'),out=[],buf=[],wc=0;
    paras.forEach(function(p){buf.push(p);wc+=wordsOf(p);if(wc>=2500){out.push(buf.join('\n\n'));buf=[];wc=0}});
    if(buf.length){if(out.length&&wc<600)out[out.length-1]+='\n\n'+buf.join('\n\n');else out.push(buf.join('\n\n'))}
    return{chapters:out.map(function(t,k){return{title:'Parte '+(k+1),text:t,open:false}}),
      note:'Não encontrei títulos de capítulo neste PDF, por isso dividi o texto em '+out.length+(out.length===1?' parte':' partes')+' de cerca de 2500 palavras. Podes renomear, juntar ou dividir abaixo.'};
  }
  var res=chapters.map(function(c){return{title:c.title,text:toParagraphs(c.lines,st),open:false}});
  var frontText=front.length?toParagraphs(front,st):'';
  if(wordsOf(frontText)>=120)res.unshift({title:'Início',text:frontText,open:false});
  var merged=[];
  for(var k=0;k<res.length;k++){
    var c=res[k];
    if(wordsOf(c.text)<8&&k<res.length-1){res[k+1].title=c.title+' — '+res[k+1].title;if(c.text.trim())res[k+1].text=c.text+'\n\n'+res[k+1].text;continue}
    merged.push(c);
  }
  note='Encontrei '+merged.length+(merged.length===1?' capítulo':' capítulos')+'. Confirma os títulos abaixo e abre o texto de qualquer um para corrigir.';
  return{chapters:merged,note:note};
}

/* ---------- render + init ---------- */
function render(keep){
  var y=window.scrollY;
  document.body.classList.remove('on-hero');delete document.body.dataset.rt;progEl=null;
  var r=route(),view;
  if(r.v==='read')view=viewRead(r);
  else if(r.v==='book')view=viewBook(r);
  else if(r.v==='admin')view=viewAdmin();
  else view=viewHome();
  $root.replaceChildren(view);
  window.scrollTo(0,keep?y:0);
  if(r.v==='read')applyPrefs();
}
window.addEventListener('hashchange',function(){render()});

function init(){
  try{var p=JSON.parse(lsGet('estante:prefs')||'null');if(p)prefs=Object.assign(prefs,p)}catch(e){}
  if(standalone()){isEditor=lsGet('estante:author')==='1';editorChecked=true;render();return}
  render();
  Promise.resolve().then(function(){
    return window.claude&&window.claude.use?window.claude.use('user'):null;
  }).then(function(u){return u?u.canEdit():false}).catch(function(){return false}).then(function(ok){
    isEditor=!!ok;editorChecked=true;render(true);
  });
}
if(window.__ESTANTE_TEST){window.__ESTANTE_TEST.analyze=analyze;}else{init()}
})();
