ás de uma parede.\n\nA sombra recuou.\n\n— Não o faças — disse.\n\nO mensageiro não insistiu. Limitou-se a observar Kalunga, como se esperasse que o próprio jovem percebesse o que estava a acontecer.\n\nMas Kalunga estava cansado. Cansado dos mortos, dos enigmas, dos nomes que não eram seus e das respostas que pareciam abrir mais perguntas do que aquelas que resolviam.\n\n— Chega — murmurou. — Quero ir para casa.\n\nDesta vez, ninguém tentou impedi-lo.\n\nA sombra apontou para a saída do beco.\n\n— Então vai.\n\nKalunga começou a andar.\n\nCada passo parecia exigir-lhe mais força do que o anterior. Não sabia se o corpo estava ferido ou se a exaustão vinha de um lugar mais profundo. Apenas queria chegar a casa, fechar a porta e descobrir se o mundo ainda conseguia comportar alguma normalidade.\n\nAo chegar à esquina, voltou-se.\n\nO mensageiro permanecia junto dos corpos. A sombra estava ao seu lado, imóvel, com o cajado apoiado no chão.\n\n— Vou voltar a ver-vos? — perguntou Kalunga.\n\nO mensageiro respondeu sem hesitar:\n\n— Sim.\n\n— Quando?\n\n— Quando deixares de poder fingir que és apenas um rapaz. Kalunga não respondeu.\n\nVirou-se e seguiu pela rua.\n\nA lua continuava vermelha, mas a sua luz já não parecia tão intensa. As casas começavam a recuperar os contornos, e, ao longe, um motor voltou a rugir. Depois ouviu-se um cão. Uma porta abriu-se. Alguém tossiu do outro lado de uma parede. Sambizanga retomava os seus sons.\n\nA cidade voltava a viver.\n\nKalunga, porém, já não sabia se ainda pertencia inteiramente a ela. Quando chegou à porta de casa, pousou a mão na maçaneta e ficou imóvel. Do outro lado, havia uma vida que conhecia.\n\nUma vida que talvez tivesse sido construída sobre silêncios. A marca pulsou uma vez.\n\nE, por detrás da porta, uma voz pronunciou um nome que ele nunca ouvira.\n\n— Mbanza…\n\nKalunga deixou de respirar.\n\nA voz veio de dentro de casa.\n\nE parecia estar à sua espera."},{"title":"Capítulo 6 — a Casa dos Silêncios","text":"Kalunga permaneceu diante da porta.\n\nA mão continuava pousada na maçaneta, mas os dedos tinham perdido a força. Durante alguns segundos, não conseguiu decidir se devia entrar ou fugir. O nome que ouvira do outro lado continuava a ecoar-lhe na cabeça, repetido por uma voz que conhecia demasiado bem para a confundir com a de um estranho.\n\n— Mbanza…\n\nEra uma voz familiar.\n\nUma voz que pertencia à sua vida.\n\nE, ainda assim, nunca a ouvira pronunciar aquele nome.\n\nKalunga afastou a mão da maçaneta.\n\nO coração batia-lhe com violência. Olhou para a rua, procurando qualquer sinal de que a noite estivesse a preparar mais uma armadilha. As casas permaneciam quietas, os postes lançavam círculos de luz amarelada sobre o chão e, ao longe, alguém ria, sem saber que o mundo quase se abrira ao meio poucas ruas atrás. Tudo parecia normal.\n\nA normalidade, percebeu Kalunga, podia ser uma mentira muito bem ensaiada. Voltou a olhar para a porta.\n\n— Quem está aí? — perguntou.\n\nNão houve resposta.\n\nAproximou o ouvido da madeira.\n\nOuviu um ruído discreto, talvez uma cadeira a arrastar-se, talvez passos no interior da casa. Depois, silêncio.\n\nKalunga respirou fundo e abriu a porta.\n\nO cheiro familiar do interior envolveu-o imediatamente. O ar tinha o odor das coisas comuns: roupa guardada, comida já fria e madeira envelhecida. Era um cheiro que conhecia desde criança, e a sua simplicidade quase lhe arrancou um suspiro de alívio.\n\nQuase.\n\nA luz da sala estava acesa.\n\nUma figura permanecia sentada, de costas para a entrada. Os ombros estavam curvados, e as mãos repousavam sobre os joelhos. Não se mexeu quando Kalunga entrou.\n\n— Estás acordado? — perguntou o jovem.\n\nA figura ergueu lentamente a cabeça.\n\nEra alguém da sua família.\n\nO rosto, marcado pelo cansaço e pela idade, parecia mais pálido do que Kalunga se lembrava. Os olhos fixaram-se nele, mas não demonstraram surpresa. Havia neles uma espécie de reconhecimento doloroso, como se a pessoa tivesse passado anos a preparar-se para aquele momento e, mesmo assim, não estivesse pronta para o enfrentar.\n\n— Onde estiveste? — perguntou.\n\nKalunga franziu o sobrolho.\n\n— Na rua.\n\n— Eu sei.\n\n— Então por que perguntas?\n\nA figura baixou os olhos para a mão dele.\n\nKalunga fechou imediatamente o punho.\n\nO silêncio instalou-se entre ambos.\n\n— O que tens na mão? — perguntou a voz.\n\n— Nada.\n\nA resposta saiu-lhe depressa demais.\n\nA pessoa levantou-se.\n\n— Mostra-me.\n\n— Não.\n\n— Kalunga…\n\n— Não!\n\nO grito ecoou pela sala.\n\nO jovem ficou surpreendido com a própria violência. Nunca falara daquela maneira dentro de casa. Sentiu vergonha quase de imediato, mas a vergonha foi engolida por uma raiva mais antiga, alimentada por todas as perguntas que fizera ao longo dos anos e que nunca tinham recebido respostas completas.\n\n— Toda a gente parece saber alguma coisa sobre mim — disse. — Toda a gente me olha como se eu estivesse prestes a transformar-me numa coisa horrível. A sombra sabe. O mensageiro sabe. Até os mortos parecem saber o meu nome antes de mim!\n\nA figura empalideceu ainda mais.\n\n— Viste um mensageiro?\n\nKalunga parou.\n\nA pergunta não continha descrença.\n\nContinha medo.\n\n— Conheces aquilo?\n\nA pessoa afastou-se um passo.\n\n— O que te disse?\n\n— Responde-me primeiro!\n\nO jovem ergueu a mão.\n\nA manga da camisa escorregou-lhe pelo pulso, revelando uma parte do símbolo. A pele em redor estava avermelhada, mas a marca permanecia intacta, escura e nítida, como se tivesse sido desenhada por uma mão invisível sob a carne. A figura levou a mão à boca.\n\nNão disse nada.\n\nMas os olhos começaram a encher-se de lágrimas.\n\nKalunga sentiu o chão fugir-lhe debaixo dos pés.\n\n— Tu conheces isto.\n\nNão era uma pergunta.\n\nA pessoa aproximou-se lentamente, como se qualquer movimento brusco pudesse quebrar alguma coisa entre ambos.\n\n— Pensei que nunca chegaria a ver esta noite.\n\nKalunga soltou uma gargalhada incrédula.\n\n— Esta noite? Sabias que isto ia acontecer?\n\n— Não desta maneira.\n\n— Mas sabias!\n\nA voz quebrou-se-lhe no final.\n\nA figura fechou os olhos por um instante.\n\n— Há coisas que tentei impedir.\n\n— E há coisas que me escondeste!\n\nA acusação ficou suspensa na sala.\n\nKalunga sentiu as mãos tremerem. Queria ouvir uma explicação, mas temia que a resposta confirmasse tudo aquilo que começava a suspeitar. A sua vida podia ter sido construída sobre uma história que nunca lhe contaram. Talvez o silêncio da família não fosse apenas uma forma de protecção. Talvez tivesse sido também uma prisão.\n\n— Diz-me o que sabes — pediu.\n\nA pessoa sentou-se novamente, devagar, como se as pernas já não conseguissem sustentar o peso da lembrança.\n\n— Antes de te explicar, preciso que compreendas uma coisa: nem tudo o que foi escondido de ti foi escondido por maldade.\n\nKalunga permaneceu de pé.\n\n— Então porquê?\n\n— Porque havia coisas que não deviam ser chamadas.\n\nA frase trouxe-lhe à memória a sombra, o mensageiro e o nome que a criatura não quisera revelar.\n\n— Chamadas por quem?\n\nA pessoa olhou para a mão marcada.\n\n— Por ti.\n\nKalunga sentiu o peito apertar-se.\n\n— Eu era uma criança.\n\n— Eu sei.\n\n— Então como podia chamar alguma coisa?\n\nA resposta demorou.\n\n— Nem sempre é a boca que chama, Kalunga. Às vezes, basta existir no lugar errado.\n\nO jovem sentiu um arrepio subir-lhe pelos braços.\n\nA marca aqueceu-lhe a palma, como se reconhecesse as palavras. A figura percebeu.\n\n— Está a responder.\n\nKalunga recuou.\n\n— Não lhe toques — disse, embora ninguém tivesse tentado aproximar-se da mão.\n\n— Não vou tocar.\n\n— E não digas mais nada sobre ela até me explicares tudo! A pessoa respirou fundo.\n\n— Quando nasceste, não choraste.\n\nKalunga franziu o sobrolho.\n\n— O quê?\n\n— Durante alguns instantes, não houve som nenhum. Os médicos tentaram fazerte reagir. Chamaram-te, mexeram-te, procuraram sinais de vida. Mas tu permanecias imóvel.\n\nA figura apertou as mãos.\n\n— Depois, uma luz atravessou a sala. As lâmpadas apagaram-se, e o ar ficou tão frio que as pessoas começaram a tremer. Durante alguns segundos, todos os relógios pararam.\n\nKalunga não conseguiu falar.\n\n— Quando a luz regressou, começaste a chorar. Um choro forte, desesperado, como se estivesses a tentar recuperar todo o ar que o mundo te negara. A pessoa olhou para ele.\n\n— E na tua mão havia uma marca.\n\nKalunga baixou os olhos.\n\nA mesma marca.\n\nO mesmo símbolo.\n\nA mesma promessa de uma coisa que nunca compreendera.\n\n— Por que não me contaste?\n\n— Porque a marca desapareceu.\n\n— Desapareceu?\n\n— Depois de alguns dias, já não se via. Pensámos que tudo tinha acabado. Queríamos acreditar que tinhas nascido com alguma anomalia e que o tempo a levara consigo.\n\nA pessoa engoliu em seco.\n\n— Mas, na noite em que fizeste sete anos, acordei com alguém a chamar por ti. Kalunga ficou imóvel.\n\n— Quem?\n\n— Não vi ninguém. Só ouvi a voz. Chamou-te uma vez, do lado de fora da casa. Quando abri a porta, a rua estava vazia.\n\n— E depois?\n\n— A voz chamou-te novamente. Desta vez, veio de dentro do quarto onde dormias. A sala pareceu arrefecer.\n\nKalunga recordou a voz que ouvira no vazio. A forma como pronunciara o seu nome, como se o conhecesse desde antes do nascimento.\n\n— O que fizeste?\n\n— Entrei no quarto. Tu estavas a dormir, mas a tua sombra… A pessoa interrompeu-se.\n\nKalunga sentiu a garganta apertar-se.\n\n— A minha sombra o quê?\n\n— Estava de pé.\n\nO jovem deixou de respirar.\n\n— Como assim?\n\n— Tu estavas deitado na cama, mas a sombra permanecia junto à parede. Era alta, muito mais alta do que devia ser. Tinha alguma coisa na mão. O cajado.\n\nKalunga viu-o na memória, tão nítido como se a criatura estivesse ali, diante dele.\n\n— E o que aconteceu?\n\n— Acendi a luz. A sombra voltou ao normal. Tu acordaste, choraste e perguntaste por que razão eu estava a olhar para a parede.\n\nA pessoa passou as mãos pelo rosto.\n\n— Na manhã seguinte, procurei ajuda. Falei com pessoas que conheciam histórias antigas, com quem sabia interpretar sinais que a maioria preferia ignorar. Alguns disseram-me que a marca era uma maldição. Outros disseram que era uma bênção. Houve quem me aconselhasse a abandonar a casa e a levar-te para longe.\n\n— E tu?\n\n— Fiquei.\n\nA resposta saiu sem hesitação.\n\n— Fiquei porque eras uma criança. Porque não tinhas culpa de nada. Porque, se havia alguma coisa dentro de ti, eu acreditava que o amor podia manter-te ligado ao mundo.\n\nKalunga sentiu os olhos arderem.\n\nA raiva não desapareceu, mas deixou de ser a única coisa que sentia.\n\n— E agora?\n\nA pessoa olhou para a marca.\n\n— Agora, tenho medo de ter acreditado numa coisa que nunca compreendi. O silêncio voltou a preencher a sala.\n\nLá fora, um motor passou pela rua. A luz da sala vacilou uma vez e estabilizou. Kalunga sentiu uma vontade súbita de se sentar, de encostar a cabeça a alguma coisa e permitir que o mundo continuasse sem lhe exigir respostas. Mas a noite ainda não terminara.\n\n— O mensageiro chamou-me Mbanza — disse.\n\nA figura ergueu o rosto de imediato.\n\nDessa vez, o medo foi tão evidente que Kalunga quase deu um passo atrás.\n\n— Disse esse nome?\n\n— Sim. Porquê?\n\nA pessoa começou a tremer.\n\n— Esse nome não devia ter regressado.\n\n— O que significa?\n\nA figura abriu a boca, mas não conseguiu responder.\n\nA marca brilhou.\n\nUma luz negra espalhou-se pela palma e projectou-se na parede. Kalunga virouse, assustado, e viu a sua sombra alongar-se pelo chão da sala. A princípio, parecia normal.\n\nDepois, ergueu o braço.\n\nKalunga não se mexeu.\n\nA sombra, porém, levantou a mão na mesma direcção da figura sentada. O ar tornou-se gelado.\n\nUma voz surgiu do corredor, baixa e profunda, pronunciando as palavras com uma lentidão quase cerimonial.\n\n— O nome foi encontrado.\n\nA pessoa levantou-se num salto.\n\n— Não!\n\nKalunga virou-se para a porta do corredor.\n\nNão havia ninguém.\n\nA voz voltou a falar.\n\n— O sangue foi reconhecido.\n\nA marca queimou-lhe a palma.\n\nA sombra projectada na parede começou a separar-se dos seus pés. Kalunga tentou recuar, mas o corpo não lhe obedeceu.\n\nA pessoa agarrou-lhe o braço.\n\n— Não respondas! — gritou. — Seja o que for que ouças, não respondas!\n\n— Porquê?!\n\n— Porque a primeira resposta abre a porta!\n\nA sombra ergueu a cabeça.\n\nDo corredor veio um som que Kalunga conhecia demasiado bem. Toc.\n\nToc.\n\nToc.\n\nOs passos aproximavam-se.\n\nA pessoa apertou-lhe o braço com força.\n\n— Perdoa-me, Kalunga.\n\nEle olhou para ela, confuso.\n\n— Pelo quê?\n\nA resposta chegou num sussurro.\n\n— Por não te ter contado que o teu pai também tinha essa marca. O mundo parou.\n\nKalunga sentiu a frase atravessar-lhe o peito com uma violência maior do que qualquer poder que a marca pudesse libertar. Por um instante, esqueceu-se da sombra, dos passos e da voz no corredor.\n\nO seu pai.\n\nA marca.\n\nO nome que não era o seu.\n\nTudo parecia fazer parte de uma história que começara antes de ele nascer. E, no entanto, ninguém lhe dissera uma palavra.\n\nOs passos pararam do outro lado da porta.\n\nA maçaneta começou a rodar lentamente.\n\nKalunga recuou.\n\nA pessoa ficou imóvel, com os olhos fixos na porta.\n\nEntão, uma voz masculina falou do outro lado.\n\n— Kalunga Mbanza.\n\nO jovem sentiu as pernas perderem a força.\n\nA voz era familiar.\n\nNão porque a tivesse ouvido muitas vezes, mas porque alguma coisa dentro dele a reconhecia.\n\nA marca pulsou.\n\nA porta abriu-se.\n\nE a noite entrou em casa."},{"title":"CAPÍTULO 7 — A Noite Entrou em Casa","text":"A porta abriu-se.\n\nE a noite entrou em casa.\n\nNão entrou como entra o vento, empurrando as cortinas ou fazendo estremecer a chama de uma vela. Entrou devagar, sem pedir licença, derramando-se pelo chão como água negra, subindo pelas paredes, apagando a pouca luz que ainda resistia no interior da casa.\n\nKalunga ficou imóvel.\n\nA mão marcada apertava-lhe o pulso com uma força involuntária. A pele ardia, mas a dor parecia vir de muito mais longe, de uma região do corpo onde os nervos humanos não chegavam. Por um instante, teve a impressão de que a marca tentava abrir-se, como um olho que reconhecesse alguém do outro lado da porta. A pessoa que estava dentro de casa recuou.\n\nKalunga não conseguiu perceber se fora por medo ou reconhecimento. Na entrada, havia um homem.\n\nTrazia uma camisa escura, amarrotada, e calças cobertas de poeira. O rosto parecia cansado, mas não era o cansaço de quem passara uma noite sem dormir. Era um desgaste antigo, uma fadiga que se alojara nos ossos e aprendera a viver ali. A barba por fazer escondia-lhe parte do maxilar; os olhos, fundos e atentos, percorriam o interior da casa como se procurassem algo que tinha perdido muitos anos antes.\n\nNão olhou imediatamente para Kalunga.\n\nOlhou para a mão dele.\n\nDepois, para a pessoa junto à parede.\n\nPor fim, falou:\n\n— Ainda não lhe contaste tudo.\n\nA voz não era desconhecida. Kalunga sentiu isso antes de conseguir compreender porquê. Havia nela uma familiaridade desconfortável, semelhante à de uma canção ouvida durante a infância e esquecida até ao instante em que alguém volta a entoar as primeiras notas.\n\nA pessoa dentro de casa baixou a cabeça.\n\n— Não tive tempo.\n\n— Tiveste dezoito anos.\n\nO silêncio que se seguiu pareceu envelhecer a sala.\n\nKalunga deu um passo em frente.\n\n— Quem és tu?\n\nO homem voltou-se finalmente para ele.\n\nO olhar que lhe lançou não tinha a frieza do mensageiro nem a crueldade daquela presença que surgira no vazio. Era pior, de certa forma. Tinha a hesitação de alguém que desejava abraçar uma pessoa e, ao mesmo tempo, temia que o simples toque pudesse destruí-la.\n\n— Reconheces-me? — perguntou.\n\nKalunga procurou alguma resposta no rosto dele. Um traço, uma cicatriz, a maneira como inclinava a cabeça. Qualquer coisa que pudesse ligar aquele estranho a uma lembrança concreta.\n\nEncontrou apenas fragmentos.\n\nUm cheiro a terra molhada. Uma mão grande a segurá-lo durante uma travessia. Uma voz que lhe ensinava a não ter medo da escuridão, porque nem tudo o que não se via estava à espera de fazer mal.\n\nAs imagens desfizeram-se antes que pudesse agarrá-las.\n\n— Não — respondeu. — Mas sinto que devia.\n\nO homem fechou os olhos por um instante.\n\n— Então a memória também começou a ceder.\n\n— Que memória? — Kalunga elevou a voz. — O que se passa nesta casa? Porque é que toda a gente parece saber alguma coisa sobre mim, menos eu? A marca aqueceu-lhe a palma. Uma linha escura estendeu-se por baixo da pele e desapareceu antes de alcançar o pulso.\n\nO homem viu-a.\n\nE empalideceu.\n\n— Mostra-me a mão.\n\n— Não.\n\n— Kalunga...\n\n— Não me chames pelo nome como se isso te desse o direito de mandar em mim! A frase saiu mais dura do que pretendia. Durante um instante, sentiu vergonha da própria agressividade, mas a vergonha foi rapidamente engolida pelo medo. Estava cansado de sombras, de mensagens, de nomes que não reconhecia e de criaturas que falavam como se a sua vida lhes pertencesse. O homem não insistiu.\n\nApenas tirou do bolso um pequeno objecto embrulhado num pedaço de pano. Quando o pousou sobre a mesa, a marca de Kalunga arrefeceu. Não lentamente. De uma vez.\n\nComo se alguma coisa dentro dele tivesse reconhecido o objecto e decidido esconder-se.\n\nKalunga aproximou-se, desconfiado.\n\n— O que é isso?\n\nO homem desdobrou o pano.\n\nEra um pedaço de madeira escura, comprido como um dedo, atravessado por uma linha de metal antigo. Na superfície, havia um símbolo gravado: um círculo incompleto, cortado por três traços que convergiam para um centro vazio. Kalunga sentiu o estômago contrair-se.\n\nTinha visto aquele símbolo antes.\n\nNão naquela casa. Não numa parede de Sambizanga. Não em nenhum objecto que pudesse recordar.\n\nVira-o na porta de pedra do vazio, junto à figura velada que permanecia acorrentada.\n\nRecuou.\n\n— Onde arranjaste isso?\n\n— Pertenceu ao teu pai.\n\nA palavra caiu sobre a sala com o peso de uma pedra.\n\nKalunga olhou novamente para o homem.\n\n— Conheceste o meu pai?\n\nO estranho soltou uma respiração curta.\n\n— Conheci-o antes de ele se tornar aquilo que precisava de ser.\n\n— Isso não é uma resposta.\n\n— É a única que ainda posso dar-te.\n\nKalunga sentiu a raiva subir-lhe ao rosto.\n\n— Todos dizem a mesma coisa! Falam como se eu tivesse de aceitar tudo porque existe um segredo qualquer por detrás! O mensageiro chamou-me Mbanza. A sombra fala comigo como se eu fosse propriedade dela. Tu apareces em minha casa com um objecto do meu pai e esperas que eu fique calado? O homem fitou-o demoradamente.\n\n— O teu pai também fazia muitas perguntas.\n\n— E onde está ele?\n\nA resposta não veio.\n\nNão veio porque o homem desviou o olhar.\n\nNão veio porque a pessoa junto à parede levou a mão à boca. Não veio porque, naquele instante, todas as pequenas luzes da casa se apagaram ao mesmo tempo.\n\nA escuridão caiu.\n\nKalunga ouviu um móvel arrastar-se, uma respiração presa, o bater apressado do próprio coração. Depois, no meio da sala, ouviu o som de madeira a tocar no chão.\n\nToc.\n\nToc.\n\nToc.\n\nO som de um cajado.\n\nA marca abriu-se sob a pele.\n\nQuando a luz regressou, a sombra de Kalunga estava projectada na parede. Mas ele não se encontrava diante dela.\n\nA sombra segurava um cajado comprido e torto.\n\nO homem que acabara de entrar empunhava uma pequena lâmina, embora os seus dedos tremessem. A pessoa junto à parede começou a murmurar palavras baixas, tão antigas que Kalunga não conseguiu distingui-las. A sombra levantou a cabeça.\n\nE, pela primeira vez, não olhou para Kalunga.\n\nOlhou para o visitante.\n\n— Tu — disse ela.\n\nO homem apertou a lâmina.\n\n— Eu.\n\n— Pensava que tinhas morrido.\n\n— Era essa a intenção.\n\nA sombra soltou um som que poderia ter sido uma gargalhada, se as gargalhadas não fossem feitas para os vivos.\n\n— Os mortos não são os únicos que sabem desaparecer.\n\nKalunga olhou de um para o outro.\n\n— Conhecem-se?\n\nNinguém respondeu.\n\nA sombra ergueu o cajado. O visitante levantou a mão livre, mostrando a palma. No centro havia uma cicatriz circular, quase apagada, atravessada por três linhas finas.\n\nO mesmo símbolo.\n\nKalunga sentiu as pernas enfraquecerem.\n\n— Também tens a marca.\n\n— Tive — corrigiu o homem. — E paguei por ela.\n\n— Pagaste como?\n\nO visitante olhou para a pessoa junto à parede.\n\n— Pergunta-lhe o que aconteceu na noite em que nasceste. Kalunga virou-se.\n\n— Já me contaste que as luzes se apagaram. Que os relógios pararam. Que a minha marca desapareceu quando eu era criança.\n\n— Não te contei tudo — respondeu a voz, quase inaudível.\n\n— Então conta!\n\nA pessoa respirou fundo, como quem se prepara para mergulhar num rio cuja profundidade desconhece.\n\n— Naquela noite, quando o teu pai te pegou ao colo, ouviu uma voz dentro da casa. Não vinha de nenhuma divisão. Não vinha da rua. Parecia vir de dentro das paredes, da terra, do próprio silêncio. A voz chamou-te por dois nomes. Kalunga sentiu a boca secar.\n\n— Quais?\n\nA resposta demorou.\n\n— Kalunga Mwena.\n\nA pessoa olhou para a marca na sua mão.\n\n— E Kalunga Mbanza.\n\nPor um instante, ninguém se mexeu.\n\nA sombra inclinou a cabeça, como se esperasse pela reacção do jovem. Kalunga sentiu vontade de rir. Não porque achasse graça, mas porque a alternativa era gritar até a garganta se rasgar.\n\nDois nomes. Duas histórias. Um pai desaparecido. Uma criatura que o seguia como um cão antigo, embora não fosse cão nem criatura. E agora um estranho que parecia conhecer as partes da sua vida que ele próprio nunca tivera oportunidade de conhecer.\n\n— Qual deles é o meu nome verdadeiro?\n\nO visitante respondeu antes de qualquer outra pessoa:\n\n— Ambos.\n\nKalunga virou-se para ele.\n\n— Não. Não me venhas com enigmas. Quero saber quem sou.\n\nO homem baixou a lâmina.\n\n— O nome que te deram pertence à tua vida. O nome que te encontraram pertence àquilo que herdaste.\n\n— E o que herdei?\n\nO silêncio voltou.\n\nDesta vez, porém, não foi um silêncio vazio. Foi um silêncio cheio de presenças, como uma sala onde dezenas de pessoas aguardam que alguém pronuncie uma sentença.\n\nA sombra apertou o cajado.\n\n— A porta.\n\nKalunga olhou para ela.\n\n— Que porta?\n\nA sombra aproximou-se da parede. A sua forma alongou-se até tocar o tecto, e o cajado começou a emitir um brilho pálido, quase azulado.\n\n— Aquela que separa o que nasce do que não pode voltar. Aquela que os antigos fecharam quando perceberam que a Morte também podia ser usada como prisão. O visitante fechou os olhos.\n\n— Não devias ter dito isso.\n\n— Já não importa — respondeu a sombra. — Ele viu-a.\n\nKalunga sentiu o vazio abrir-se dentro da memória. A porta de pedra surgiu-lhe diante dos olhos, enorme, coberta de símbolos, com a figura velada acorrentada atrás dela.\n\nE compreendeu que a figura não estava simplesmente presa. Estava à espera.\n\nA marca pulsou uma vez.\n\nDepois outra.\n\nA sombra voltou-se para ele.\n\n— Agora já sabes o suficiente para ter medo.\n\nKalunga olhou para a mão.\n\n— Eu já tinha medo.\n\n— Não — disse a sombra. — Antes tinhas medo daquilo que te podia acontecer. Agora tens de ter medo daquilo que podes fazer.\n\nLá fora, um cão começou a ladrar.\n\nOutro respondeu.\n\nDepois outro.\n\nO bairro recuperava os seus ruídos, mas havia qualquer coisa diferente no som. Os cães não ladravam para a rua. Ladravam para o céu.\n\nO visitante embrulhou novamente o objecto de madeira.\n\n— Temos de sair daqui.\n\n— Não vou a lado nenhum convosco — respondeu Kalunga.\n\n— Então ficarás onde te encontrarão.\n\n— Quem?\n\nO homem olhou para a porta aberta.\n\nDo lado de fora, no fim da rua, uma luz dourada acendeu-se por um breve instante. Não iluminou as paredes nem o chão. Fez algo mais estranho: onde a luz tocava, as sombras desapareciam sem deixar escuridão no seu lugar. A sombra de Kalunga recuou.\n\nPela primeira vez desde que surgira, pareceu verdadeiramente assustada.\n\n— Não pode ser — murmurou.\n\nO visitante guardou o objecto junto ao peito.\n\n— Já começou.\n\nKalunga olhou para a luz distante.\n\nPor detrás dela, uma figura humana atravessava a rua.\n\nNão caminhava depressa. Não precisava.\n\nA cada passo, uma pequena planta brotava de uma fenda no asfalto. E, enquanto o bairro prendia a respiração, a marca de Kalunga ficou fria como um cadáver."},{"title":"CAPÍTULO 8 — O Homem Que Não","text":"Tinha Sombra Kalunga saiu de casa porque a luz dourada continuava a aproximar-se. Não saiu por coragem. A coragem era uma palavra demasiado limpa para aquilo que sentia. Saiu porque a casa, que até então representara o último abrigo contra o absurdo, começara a parecer uma caixa fechada onde todos conheciam o seu destino, menos ele.\n\nO visitante seguiu-o. A pessoa que ficara dentro de casa não tentou impedi-lo. Apenas segurou o pequeno objecto de madeira contra o peito, como se aquele fragmento pudesse manter afastado um passado que já encontrara o caminho de regresso.\n\nA sombra acompanhava Kalunga, estendida no chão, o cajado desenhado contra a parede das casas. Mas agora mantinha-se a uma distância maior. Não parecia querer ser vista pela figura que avançava do outro lado da rua. O homem aproximava-se.\n\nEra jovem, talvez da idade de Kalunga, talvez um pouco mais velho. Trazia uma camisa clara, calças simples e sandálias gastas. Não havia nada de extraordinário na sua aparência. O rosto era sereno, os movimentos tranquilos, os olhos escuros e atentos.\n\nNo entanto, a rua reagia à sua presença.\n\nUma erva fina nasceu entre duas pedras. Uma planta seca, que pendia de um muro havia semanas, ergueu as folhas. Uma árvore que parecia morta, junto a uma casa abandonada, fez estalar um ramo e abriu um pequeno botão verde. Kalunga parou.\n\nO homem também.\n\nFicaram frente a frente, separados por poucos metros e por algo que nenhum dos dois sabia nomear.\n\n— Foste tu? — perguntou Kalunga.\n\nO desconhecido olhou em redor.\n\n— Fiz o quê?\n\n— As plantas. A luz. Tudo isto.\n\nO jovem sorriu de leve.\n\n— As plantas não precisam de mim para crescer.\n\n— Então porque estão a crescer agora?\n\n— Talvez porque tenham encontrado uma razão.\n\nKalunga sentiu irritação. Já ouvira demasiadas frases que pareciam sábias apenas porque escondiam a resposta.\n\n— Se vieste brincar comigo, escolhe outra noite.\n\nO desconhecido não se ofendeu. Olhou para a mão marcada de Kalunga e a expressão mudou-lhe apenas o suficiente para denunciar que reconhecia alguma coisa.\n\n— Dói?\n\nKalunga fechou o punho.\n\n— Não é da tua conta.\n\n— É justo.\n\nO rapaz desviou-se um pouco, deixando a passagem livre.\n\nEsse gesto simples desconcertou Kalunga mais do que qualquer ameaça. O mensageiro obrigara-o a enfrentar o vazio. A sombra dera-lhe ordens. O visitante falara como quem carregava uma dívida antiga. Aquele desconhecido, pelo contrário, parecia aceitar que Kalunga tinha o direito de recusar. E isso fez com que desconfiasse ainda mais dele.\n\n— Quem és tu?\n\nO rapaz demorou a responder.\n\n— Chamam-me Nzambi.\n\nO nome atravessou a rua sem produzir som, mas Kalunga sentiu-o na marca. Um frio agudo percorreu-lhe os dedos.\n\nA sombra ergueu o cajado.\n\nO visitante puxou Kalunga pelo braço.\n\n— Não digas mais nada — murmurou-lhe ao ouvido.\n\nNzambi olhou para a sombra. Não parecia assustado. Também não parecia surpreendido.\n\n— Ainda o acompanhas — disse.\n\nA sombra respondeu com um ruído seco, semelhante ao ranger de uma porta antiga.\n\n— Não devias estar aqui.\n\n— Já me disseram isso antes.\n\n— Então aprende.\n\nNzambi baixou os olhos para a erva que crescia entre as pedras.\n\n— Aprender não é o mesmo que obedecer.\n\nA sombra avançou um passo.\n\nO chão estalou.\n\nPor um instante, Kalunga viu o asfalto cobrir-se de pequenas linhas negras, como raízes queimadas. A luz dourada vacilou. O ar tornou-se pesado, e uma dor breve atravessou-lhe o peito.\n\nNzambi não recuou, mas a planta junto aos seus pés fechou as folhas. Os dois poderes reconheceram-se antes dos seus portadores. Kalunga percebeu isso com uma clareza terrível.\n\n— Parem! — gritou.\n\nA palavra saiu-lhe da boca como um golpe.\n\nA marca brilhou.\n\nA sombra congelou.\n\nNzambi levantou a cabeça.\n\nO visitante soltou o braço de Kalunga, espantado.\n\nDurante um segundo, tudo obedeceu ao grito do jovem. As raízes negras deixaram de avançar. A erva parou de crescer. Até a luz dourada pareceu suspensa no ar. Depois, a rua voltou a respirar.\n\nKalunga cambaleou, apoiando-se no muro.\n\n— O que foi aquilo?\n\nNzambi aproximou-se, mas parou quando viu o medo no rosto dele.\n\n— Não sei exactamente.\n\n— Mentira.\n\n— Sei que a tua voz tocou numa coisa que estava escondida. Mas não sei o que essa coisa é capaz de fazer.\n\nA sombra soltou uma gargalhada baixa.\n\n— A Criação sempre foi boa a fingir inocência.\n\nNzambi voltou-se lentamente.\n\n— E a Morte sempre foi boa a chamar necessidade àquilo que não consegue compreender.\n\nA frase atingiu Kalunga como uma bofetada.\n\n— Não voltem a falar de mim como se eu não estivesse aqui. Os dois ficaram em silêncio.\n\nO jovem sentiu uma vergonha súbita por ter de exigir aquilo. Eram os seus poderes, a sua mão, o seu corpo. Ainda assim, as forças que nele despertavam pareciam pertencer a todos, menos a ele.\n\nNzambi foi o primeiro a baixar a cabeça.\n\n— Tens razão.\n\nA resposta inesperada deixou Kalunga sem palavras.\n\n— Não sei o que és — continuou Nzambi. — Mas sei que estás assustado. E não vou fingir que compreendo o que te está a acontecer.\n\nO visitante agarrou Kalunga pelo ombro.\n\n— Temos de ir.\n\n— Ainda não — respondeu Kalunga.\n\nVirou-se para Nzambi.\n\n— Disseste que te chamam Nzambi. Quem te deu esse nome?\n\nO rapaz ficou sério.\n\n— A minha mãe.\n\n— E sabes o que significa?\n\n— Sei o que significa para as pessoas. Não sei o que significa para mim. Por um instante, Kalunga viu algo nos olhos dele que reconheceu imediatamente: a mesma sensação de habitar um corpo que talvez não lhe pertencesse por inteiro.\n\n— Também tens alguma coisa dentro de ti? — perguntou.\n\nNzambi olhou para as próprias mãos.\n\n— Às vezes, acordo e encontro plantas a nascer junto à cama. Outras vezes, toco em coisas partidas e elas voltam a unir-se. Uma vez, quando era mais novo, um pássaro caiu morto no quintal. Eu chorei tanto que a minha mãe me mandou entrar. Quando voltei, o pássaro estava vivo.\n\n— E depois?\n\n— Morreu outra vez, três dias mais tarde.\n\nO silêncio que se seguiu foi diferente.\n\nKalunga pensou no homem morto que se levantara na rua. Pensou na mulher que implorara sem palavras para ser libertada. Pensou na névoa negra a atravessar-lhe os dedos.\n\n— Porque estás aqui?\n\nNzambi olhou para o céu.\n\nA lua já não era vermelha. Ainda assim, uma linha fina atravessava a sua superfície, como uma cicatriz luminosa.\n\n— Porque ontem sonhei com uma porta de pedra. Atrás dela, havia alguém acorrentado. E uma voz chamou-me por um nome que nunca ouvi. Kalunga sentiu o sangue fugir-lhe do rosto.\n\n— Que nome?\n\nNzambi fitou-o.\n\n— Não consegui perceber. Só me lembro de uma palavra que vinha antes dele.\n\n— Qual?\n\n— Desperta.\n\nA marca na mão de Kalunga contraiu-se.\n\nO visitante puxou-o para trás.\n\n— Chega.\n\nMas Kalunga não se moveu.\n\n— Viste mais alguma coisa?\n\nNzambi hesitou.\n\n— Vi um homem com um cajado. Vi uma cidade onde as pessoas nasciam sem sombra. E vi dois jovens diante de uma porta fechada. Um segurava a chave. O outro segurava a dobradiça.\n\n— Quem eram?\n\n— Não sei.\n\n— E o que aconteceu?\n\nNzambi olhou para ele com uma tristeza que parecia demasiado antiga para o seu rosto.\n\n— A porta abriu-se. E nenhum dos dois conseguiu voltar a fechá-la. Um vento atravessou a rua.\n\nAs plantas que tinham crescido começaram a inclinar-se, não para o chão, mas na direcção de Kalunga. As folhas tremiam como pequenos dedos, e as raízes saíam das fendas do asfalto para se aproximarem da sua sombra. Nzambi recuou.\n\nA sombra ergueu o cajado.\n\nO visitante retirou do bolso o fragmento de madeira e apertou-o com força. Kalunga sentiu a marca arder.\n\nDesta vez, não era uma dor que lhe pedia para libertar alguma coisa. Era uma dor que lhe ordenava que se afastasse.\n\n— Vai-te embora — disse ele a Nzambi.\n\nO jovem não protestou.\n\n— Voltaremos a encontrar-nos.\n\n— Não te convidei a voltar.\n\n— Eu sei.\n\nNzambi virou-se e começou a caminhar. A cada passo, as plantas que surgiam no seu caminho fechavam as folhas, como se a sua passagem lhes retirasse a luz que as fizera nascer.\n\nQuando chegou ao fim da rua, parou por um instante.\n\n— Kalunga.\n\nO jovem levantou a cabeça.\n\n— Não deixes que te convençam de que nasceste para obedecer à morte. A sombra avançou violentamente, e o cajado bateu no chão. Quando Kalunga voltou a olhar, Nzambi já não estava lá.\n\nA rua ficou vazia.\n\nMas uma pequena flor branca permanecia entre as pedras, junto aos seus pés. Kalunga baixou-se e tocou-lhe.\n\nA flor escureceu imediatamente.\n\nAs pétalas murcharam, o caule curvou-se e a planta tornou-se pó entre os seus dedos.\n\nEle retirou a mão como se tivesse tocado numa brasa.\n\nNzambi fazia nascer.\n\nEle fazia morrer.\n\nA conclusão era simples demais para ser suportada.\n\nKalunga fechou os olhos.\n\n— Eu não quero isto — murmurou.\n\nA sombra aproximou-se.\n\n— O mundo nunca perguntou o que querias.\n\nKalunga abriu os olhos, furioso.\n\n— Então o mundo vai ter de aprender a perguntar.\n\nPela primeira vez, a sombra não respondeu.\n\nE, muito longe dali, sob uma terra que não conhecia manhãs, alguma coisa bateu três vezes do outro lado de uma porta de pedra."},{"title":"CAPÍTULO 9 — A Memória Debaixo da","text":"Pele O amanhecer chegou a Sambizanga sem pedir desculpa pela noite. As primeiras vendedoras começaram a montar as bancas. Um homem empurrou um carrinho carregado de pão. O cheiro do café misturou-se com o fumo dos fogareiros, e as primeiras vozes atravessaram as ruas, trazendo de volta a rotina com a teimosia de quem não sabe que o mundo esteve prestes a abrir-se. Kalunga caminhava entre as pessoas como alguém que regressava de um lugar onde ninguém acreditaria que ele estivera.\n\nTinha os olhos pesados e a mão escondida no bolso. A marca não brilhava, mas ele sentia-a a cada passo. Era como uma segunda pulsação, mais lenta do que a do coração, mais antiga do que a própria carne.\n\nO visitante seguia ao seu lado.\n\nNão se apresentara devidamente. Não explicara o seu passado. E, apesar de ter passado a noite inteira a protegê-lo de coisas que Kalunga mal compreendia, continuava a guardar respostas como se cada uma delas pudesse matar alguém.\n\n— Vais continuar a seguir-me? — perguntou Kalunga.\n\n— Até ter a certeza de que não te encontrarão primeiro.\n\n— Quem?\n\n— Aqueles que procuram a porta.\n\nKalunga soltou uma gargalhada sem humor.\n\n— Outra vez a porta. Toda a gente fala dela. Ninguém me diz o que é. O homem parou junto a um muro coberto de cartazes velhos.\n\n— Porque não é uma coisa que se explique apenas com palavras.\n\n— Então explica de outra maneira.\n\nO visitante observou-o. Havia no seu rosto uma espécie de cansaço resignado, como se reconhecesse no jovem a mesma impaciência que um dia o levara a cometer erros.\n\n— O teu corpo é uma casa. A tua memória é uma casa. A tua alma, se quiseres usar essa palavra, é uma casa. Mas há portas que não foram feitas para separar divisões. Foram feitas para separar realidades. A que viste não conduz simplesmente a outro lugar. Permite que aquilo que devia permanecer de um lado atravesse para o outro.\n\nKalunga recordou os cadáveres que se moviam, os olhos vazios, a névoa que saíra da sua mão.\n\n— E eu sou a porta.\n\n— És o que restou da fechadura.\n\nA resposta fez-lhe apertar os dentes.\n\n— Não sou um objecto.\n\n— Eu sei.\n\n— Não, não sabes! — Kalunga aproximou-se. — Tu olhas para mim e vês uma herança, uma marca, um nome antigo. Eu olho para mim e vejo um rapaz que tem medo de dormir porque não sabe se vai acordar no mesmo mundo. Vejo alguém que não consegue rezar sem pensar que talvez esteja a falar com forças que nem sequer compreende. Vejo alguém que tem medo de tocar noutra pessoa. O homem ficou calado.\n\nKalunga respirou fundo, tentando controlar o tremor na voz.\n\n— Se sabes alguma coisa sobre o meu pai, diz-me. Se sabes como tirar isto de mim, diz-me. Mas não voltes a falar como se a minha vida fosse uma dívida que eu tenho de pagar.\n\nO visitante baixou o olhar.\n\n— Tens razão.\n\nDuas palavras simples. Nenhum enigma. Nenhuma ameaça.\n\nKalunga não soube o que fazer com elas.\n\nO homem sentou-se no muro.\n\n— O teu pai chamava-se Mwena antes de aceitar a marca. Não sei se era esse o nome que recebera ao nascer, mas foi o nome pelo qual viveu entre os homens. Era um homem comum em quase tudo: trabalhava, discutia, ria pouco e preocupava-se demasiado com aquilo que não podia controlar. Tinha uma fé que não lhe permitia aceitar facilmente o que lhe acontecera. Kalunga sentou-se a uma distância prudente.\n\n— Então ele também acreditava que matar era errado?\n\n— Acreditava que nenhuma força lhe dava o direito de brincar com a vida de outra pessoa. Não confundia poder com autorização.\n\nA frase ficou suspensa entre os dois.\n\nKalunga olhou para a mão escondida no bolso.\n\n— E o que lhe aconteceu?\n\nO visitante passou os dedos pela cicatriz da palma.\n\n— Descobriu que a marca não lhe concedia apenas poder. Dava-lhe acesso a coisas que deveriam permanecer fechadas. E, quando tentou compreender o que carregava, percebeu que havia entidades interessadas em usá-lo.\n\n— O mensageiro?\n\n— Entre outros.\n\n— O Primeiro?\n\nO homem não respondeu imediatamente.\n\n— O Primeiro não é alguém que se possa compreender à distância. Até as entidades antigas têm medo de interpretar mal a sua vontade. Kalunga pensou na voz que fizera a lua tremer. No peso impossível que o obrigara a cair de joelhos.\n\n— Ele quer que eu faça alguma coisa?\n\n— Quer saber o que farás.\n\n— Isso é a mesma coisa.\n\n— Não. Querer que escolhas é diferente de escolher por ti. Kalunga ficou a olhar para a rua.\n\nUm rapaz atravessou o caminho com uma bola debaixo do braço. Duas mulheres discutiam o preço de uma mercadoria. Um homem, encostado à porta de uma oficina, ria de alguma coisa que ouvira no telemóvel.\n\nEra tudo tão normal que quase doía.\n\n— O meu pai conseguiu viver com a marca?\n\nO visitante demorou a responder.\n\n— Durante algum tempo, conseguiu viver com aquilo que acreditava que a marca significava.\n\n— E depois?\n\n— Depois, descobriu que o significado mudava conforme a pessoa que a observava.\n\nKalunga franziu o sobrolho.\n\n— Não compreendo.\n\n— Para alguns, eras um instrumento. Para outros, uma ameaça. Para outros ainda, uma oportunidade. O teu pai acreditava que podia continuar a ser apenas um homem.\n\n— E podia?\n\nO visitante olhou para ele.\n\n— Essa é a pergunta que ele deixou sem resposta.\n\nKalunga levantou-se.\n\n— Então não me estás a ajudar.\n\n— Estou a tentar impedir que cometas os mesmos erros.\n\n— Sem me dizer quais foram.\n\n— Porque ainda não sei quais vais cometer.\n\nA resposta irritou-o, mas também lhe pareceu honesta.\n\nContinuaram a caminhar.\n\nAo chegarem a uma rua mais estreita, o visitante parou diante de uma parede de blocos sem reboco. No meio dela havia uma porta de madeira que Kalunga nunca reparara, apesar de passar por ali com frequência. Não tinha fechadura visível nem dobradiças do lado de fora. Sobre a madeira, alguém desenhara um círculo incompleto.\n\nO mesmo símbolo.\n\nKalunga sentiu a marca aquecer.\n\n— Que lugar é este?\n\n— Um sítio onde o teu pai procurou respostas.\n\n— E encontrou-as?\n\n— Encontrou uma pergunta que não conseguiu abandonar.\n\nO visitante pousou a palma na porta.\n\nO símbolo escureceu.\n\nUm ruído percorreu a madeira, como o murmúrio de muitas vozes falando ao mesmo tempo. Kalunga distinguiu palavras soltas: nomes, datas, lamentos, promessas.\n\nE, por baixo de tudo, ouviu uma voz familiar.\n\nA sua própria voz.\n\nMas não a voz que usava para falar com as pessoas. Era uma voz mais grave, mais velha, carregada de uma tristeza que ainda não conhecia.\n\n— Não a abras — disse ela.\n\nKalunga recuou.\n\n— Ouviste?\n\nO visitante retirou a mão.\n\n— Ouvi.\n\n— Era a minha voz.\n\n— Sim.\n\n— Como é possível?\n\nO homem olhou para a marca.\n\n— Há memórias que não pertencem ao passado. Pertencem ao que ainda pode acontecer.\n\nKalunga sentiu o coração acelerar.\n\n— Isso não faz sentido.\n\n— Nem tudo o que existe precisa de fazer sentido para existir. O jovem abanou a cabeça.\n\n— Não. Eu não vou aceitar respostas assim. Se essa porta tem alguma coisa a ver comigo, vou abri-la.\n\nO visitante segurou-lhe o braço.\n\n— Não.\n\nKalunga tentou libertar-se.\n\n— Larga-me!\n\n— O teu pai abriu uma porta parecida. Perdeu algo que nunca conseguiu recuperar.\n\n— O quê?\n\nO homem soltou-o lentamente.\n\n— A certeza de que continuava a ser apenas ele.\n\nKalunga ficou imóvel.\n\nDurante um instante, a sua raiva perdeu força. Não desapareceu; apenas cedeu espaço a um medo mais profundo. Se o pai passara pelo mesmo caminho, talvez houvesse uma parte dele que Kalunga pudesse compreender. Talvez a marca não fosse uma condenação inevitável. Talvez fosse uma escolha que ainda não tinha sido feita.\n\nO pensamento trouxe-lhe algum alívio.\n\nDepois, a marca pulsou.\n\nA porta abriu-se sozinha.\n\nNão havia uma sala atrás dela. Havia uma escuridão funda, atravessada por fios de luz branca. Kalunga sentiu um vento sair daquele espaço, trazendo o cheiro de terra molhada e cinza.\n\nNo centro da escuridão, uma figura estava ajoelhada.\n\nTinha a cabeça baixa e as mãos presas por correntes.\n\nKalunga reconheceu-a.\n\nEra a figura velada do vazio.\n\nA figura levantou o rosto.\n\nPor trás do véu, não havia olhos. Havia duas pequenas chamas, uma negra e outra dourada.\n\nA voz que saiu da porta não pertencia à figura.\n\nPertencia ao pai de Kalunga.\n\n— Não deixes que escolham por ti.\n\nA porta fechou-se.\n\nO visitante caiu de joelhos, como se tivesse levado um golpe no peito. Kalunga permaneceu de pé, incapaz de falar.\n\nA marca arrefeceu.\n\nE, pela primeira vez desde o seu despertar, o jovem sentiu algo diferente do medo. Sentiu esperança.\n\nPequena, frágil e perigosa.\n\nA esperança de que ainda pudesse escolher."},{"title":"CAPÍTULO 10 — A Primeira Semente","text":"A notícia espalhou-se antes de o sol chegar ao ponto mais alto. Numa rua de Sambizanga, uma árvore seca florescera durante a madrugada. Noutra, um homem que não conseguia mover as pernas havia anos levantara-se da cama para beber água. Num quintal, uma galinha morta fora encontrada viva, embora ninguém soubesse explicar como regressara ao mundo. Os relatos eram diferentes, mas todos tinham o mesmo detalhe: um jovem passara por perto.\n\nUm jovem chamado Nzambi.\n\nKalunga ouviu a história de três pessoas antes do meio-dia. A primeira contou-a como um milagre. A segunda, como um sinal de sorte. A terceira baixou a voz e disse que, naquela noite, vira o rapaz tocar na testa de uma criança febril e que a febre desaparecera como se nunca tivesse existido.\n\nKalunga não sabia o que pensar.\n\nDesde o encontro na rua, o nome de Nzambi permanecia dentro dele como uma pedra no sapato. Não era apenas o facto de o rapaz conseguir fazer nascer plantas ou restaurar coisas partidas. Era a maneira como a sua presença alterava a marca, como se as duas forças se reconhecessem e, ao mesmo tempo, se rejeitassem. O visitante não o deixara aproximar-se do jovem novamente.\n\n— Há coisas que precisam de tempo — dizia.\n\nKalunga começava a odiar aquela frase.\n\nO tempo, para ele, era apenas outra forma de esconder informação. Ao início da tarde, deixou o homem para trás e seguiu os rumores. Encontrou Nzambi num pequeno terreno entre duas casas, onde algumas pessoas se tinham reunido em torno de uma árvore que, na véspera, não passava de um tronco seco. As folhas eram novas, de um verde quase transparente. Os ramos, finos e frágeis, erguiam-se em direcção ao céu. Ao redor do tronco, pequenas flores brancas abriam-se como mãos.\n\nUma mulher segurava uma criança ao colo. Um velho tocava no tronco com reverência. Outros observavam em silêncio, sem saber se deviam aproximar-se ou afastar-se.\n\nNzambi estava ajoelhado junto às raízes.\n\nParecia exausto.\n\nO rosto tinha perdido a serenidade da noite anterior. O suor escorria-lhe pelas têmporas, e as mãos tremiam ligeiramente. Quando tentou levantar-se, apoiou-se no tronco para não cair.\n\nKalunga aproximou-se.\n\n— Então os milagres também cansam.\n\nNzambi ergueu os olhos.\n\n— E as maldições também fazem perguntas.\n\nAlgumas pessoas olharam para Kalunga. Ele sentiu o peso dos olhares e baixou a voz.\n\n— Precisamos de falar.\n\nNzambi observou a marca escondida no bolso do jovem.\n\n— Eu sei.\n\nAfastaram-se para o outro lado do terreno, onde as vozes da multidão chegavam abafadas. O ar cheirava a folhas novas e terra húmida.\n\nKalunga cruzou os braços.\n\n— O que estás a fazer?\n\n— A tentar ajudar.\n\n— Ajudar quem?\n\nNzambi olhou para a árvore.\n\n— Quem precisa.\n\n— E sabes o que acontece depois?\n\nO jovem criador franziu o sobrolho.\n\n— Depois de quê?\n\n— Depois de devolveres alguma coisa ao mundo. Depois de fazeres crescer o que estava morto. Depois de tocares numa vida que já devia ter terminado. Nzambi não respondeu de imediato.\n\nKalunga sentiu que tinha encontrado uma fissura na sua confiança.\n\n— Aconteceu alguma coisa — insistiu. — Vi a tua cara ontem. Não estavas a controlar aquilo. Estavas a reagir.\n\nNzambi baixou os olhos para as mãos.\n\n— Quando era criança, pensava que a vida era uma coisa simples. Uma chama que se acendia e que, se alguém tivesse cuidado suficiente, podia continuar acesa. Depois comecei a perceber que a vida não obedece sempre ao cuidado. Há coisas que morrem apesar de todos os esforços. Há pessoas que sofrem mesmo quando ninguém lhes deseja mal.\n\n— Isso não responde à pergunta.\n\n— Ainda não terminei.\n\nO tom não era agressivo, mas havia nele uma firmeza que Kalunga não esperava.\n\n— Quando toco numa coisa partida, sinto aquilo que ela era antes de se partir. Não vejo apenas a forma. Sinto o que lhe falta. Às vezes consigo devolver-lhe esse estado. Outras vezes, não consigo. E, quando tento demasiado, algo dentro de mim fica vazio.\n\n— Vazio como?\n\nNzambi olhou para a árvore.\n\nUma das flores começara a murchar.\n\n— Como se a criação não fosse gratuita. Como se cada coisa que faço surgir precisasse de alguma coisa que eu não sei nomear.\n\nKalunga sentiu um arrepio.\n\n— E a criança?\n\n— A febre voltou.\n\n— O quê?\n\n— Horas depois. Não tão forte, mas voltou. A mãe pensa que foi um milagre. Eu não lhe disse que não sei se a ajudei ou se apenas lhe dei algumas horas de alívio. Kalunga ficou calado.\n\nNão era o que esperava ouvir.\n\nTinha imaginado Nzambi como alguém embriagado pelo próprio poder, disposto a corrigir o mundo à força, incapaz de aceitar limites. Mas o rapaz diante dele parecia assustado com aquilo que podia fazer, embora o seu medo fosse diferente.\n\nKalunga temia ferir alguém.\n\nNzambi temia não conseguir salvar ninguém.\n\n— Porque não paras? — perguntou.\n\nNzambi soltou uma respiração cansada.\n\n— Porque, se consigo ajudar uma pessoa e me recuso a tentar, como posso justificar essa recusa?\n\nA pergunta atingiu Kalunga num lugar sensível.\n\nPensou na mulher morta que libertara. Pensou no homem que se desfizera sob a névoa negra. Pensou no que a sombra lhe dissera: tu não matas, tu libertas. E se aquilo também fosse uma desculpa?\n\nE se as palavras fossem apenas uma maneira de tornar suportável aquilo que ele não queria admitir?\n\n— E se, para salvar alguém, destruíres outra coisa? — perguntou. Nzambi fitou-o.\n\n— Então terei de responder pelo que fiz.\n\n— Mesmo que tenhas tentado ajudar?\n\n— Principalmente se tiver tentado ajudar. A intenção não apaga as consequências.\n\nKalunga ficou surpreendido.\n\nPela primeira vez, não viu apenas um rival. Viu alguém que talvez estivesse a enfrentar uma versão diferente do mesmo abismo.\n\nUm grito interrompeu-os.\n\nA mulher da criança chamava por Nzambi. O pequeno corpo tremia nos seus braços, e o rosto da mãe estava tomado por um terror que dispensava explicações.\n\nNzambi correu até ela.\n\nAjoelhou-se, pousou as mãos na testa da criança e fechou os olhos. As folhas da árvore começaram a agitar-se, embora não houvesse vento. As raízes emergiram da terra, contorcendo-se como dedos. Uma luz dourada espalhou-se pelo terreno, iluminando as paredes e os rostos.\n\nKalunga sentiu a marca arder.\n\nNão era a mesma dor que surgia quando os mortos se aproximavam. Era uma pressão contrária, como se alguma força tentasse empurrar a marca para fora da sua pele.\n\nA criança deixou de tremer.\n\nA mãe chorou de alívio.\n\nMas Nzambi não retirou as mãos.\n\nA luz tornou-se mais intensa. As flores começaram a fechar-se, e as folhas da árvore escureceram pelas extremidades.\n\n— Nzambi! — gritou Kalunga.\n\nO rapaz não ouviu.\n\nOu não conseguiu responder.\n\nKalunga correu até ele e agarrou-lhe o pulso.\n\nA marca abriu-se.\n\nUma névoa negra saiu da mão de Kalunga, enquanto a luz dourada se derramava pelos dedos de Nzambi. As duas forças encontraram-se sobre o corpo da criança. O mundo pareceu parar.\n\nDurante um instante, Kalunga ouviu dois sons: um choro de recém-nascido e o último suspiro de um velho. Ambos vinham do mesmo lugar. Ambos eram verdadeiros.\n\nDepois, a luz desapareceu.\n\nNzambi caiu para trás, respirando com dificuldade. A criança abriu os olhos e começou a chorar de maneira normal, viva, assustada, humana. A mãe apertou-a contra o peito.\n\nKalunga recuou, olhando para a própria mão.\n\nA marca estava diferente.\n\nO círculo que antes parecia fechado tinha agora uma pequena abertura, atravessada por um traço dourado.\n\nNzambi também olhava para ela.\n\n— O que fizeste? — perguntou.\n\n— Eu ia perguntar-te o mesmo.\n\nA árvore estremeceu.\n\nUma a uma, as flores caíram. As folhas perderam a cor, e o tronco voltou a parecer seco. Mas, no centro de uma das raízes, uma única semente permanecia intacta, brilhando com uma luz dourada muito ténue.\n\nNzambi tentou levantar-se. Kalunga segurou-o antes que caísse. Durante um instante, ficaram frente a frente, unidos pela necessidade e separados por tudo o que ainda não compreendiam.\n\n— Não voltes a tocar em mim sem me avisar — disse Kalunga. Nzambi soltou uma pequena gargalhada, apesar da exaustão.\n\n— Foste tu que me agarraste.\n\n— Não mudes de assunto.\n\nO sorriso desapareceu.\n\nNzambi olhou para a marca.\n\n— Aquilo que existe dentro de ti não é apenas morte.\n\nKalunga sentiu o coração acelerar.\n\n— O que queres dizer?\n\n— Quando as nossas forças se tocaram, senti alguma coisa. Não era apenas a tua presença. Era como se houvesse uma terceira coisa entre nós. Uma coisa que não pertencia à criação nem à morte.\n\nA sombra apareceu junto ao muro.\n\nO cajado bateu uma vez no chão.\n\n— Já chega.\n\nNzambi levantou-se com dificuldade.\n\n— Tu sabes o que é.\n\nA sombra não respondeu.\n\n— Sabes — insistiu Nzambi. — E tens medo.\n\nA sombra inclinou a cabeça.\n\n— O medo é uma forma de memória.\n\nKalunga olhou de um para o outro.\n\n— Chega de falar como se eu não estivesse aqui!\n\nA marca pulsou.\n\nA semente dourada rolou pela terra e parou junto ao seu pé. Kalunga baixou-se para a apanhar.\n\nAssim que os dedos lhe tocaram, ouviu uma voz dentro da cabeça. Não era a voz do Primeiro. Não era a do mensageiro. Não era a sua. Era uma voz serena, quase maternal, que parecia vir de um lugar anterior ao próprio tempo.\n\nQuando a última porta se abrir, a Criação pedirá que preserves tudo. A Morte exigirá que deixes partir. E tu descobrirás que não podes obedecer às duas. Kalunga deixou cair a semente.\n\nQuando olhou novamente para o chão, ela já não estava lá. Nzambi tinha ouvido alguma coisa. A sua expressão confirmava-o.\n\n— O que te disseram? — perguntou.\n\nKalunga abanou a cabeça.\n\n— Nada.\n\nMas, pela primeira vez, mentiu não para esconder a verdade dos outros, mas porque ainda não estava preparado para a ouvir em voz alta."},{"title":"CAPÍTULO 11 — O Nome Antes do","text":"Nome Naquela noite, Kalunga não conseguiu dormir.\n\nA casa parecia mais pequena do que antes. As paredes guardavam sons que não deveriam existir: passos no corredor quando ninguém caminhava, o ranger de uma cadeira vazia, o murmúrio de vozes que cessavam sempre que ele tentava distinguir as palavras.\n\nO visitante desaparecera sem se despedir.\n\nA pessoa que o criara permanecia acordada na divisão ao lado, embora fingisse dormir sempre que Kalunga passava à porta. A sombra, por sua vez, estava sentada no chão, encostada à parede, com o cajado pousado sobre os joelhos. Kalunga olhou para ela durante muito tempo.\n\n— Vais continuar a esconder-te atrás desse silêncio?\n\nA sombra levantou a cabeça.\n\n— Não me escondo.\n\n— Então responde-me. Quem és tu?\n\n— Já te disse o que precisavas de saber.\n\n— Não. Disseste-me aquilo que te convinha.\n\nA sombra pareceu divertir-se.\n\n— Começas a aprender.\n\nKalunga sentou-se no chão, diante dela.\n\n— O homem que apareceu em minha casa conhecia o meu pai. Nzambi consegue fazer crescer coisas que estavam mortas. O mensageiro chamou-me Mbanza. A porta de pedra tem um símbolo igual ao da marca do meu pai. E tu continuas a falar como se tudo estivesse ligado.\n\nA sombra ficou imóvel.\n\n— Está ligado.\n\n— Então explica.\n\n— Ainda não.\n\nKalunga apertou os punhos.\n\n— Se não me disseres a verdade, vou procurar respostas sozinho. A sombra inclinou-se para a frente.\n\n— É isso que me preocupa.\n\n— Porquê?\n\n— Porque a tua vontade começa a despertar antes da tua compreensão. E uma vontade sem compreensão pode abrir portas que nem os deuses conseguem fechar.\n\nKalunga sentiu a marca arder.\n\n— Eu não sou um deus.\n\n— Ainda não sabes o que és.\n\n— Sou Kalunga Mwena.\n\nA sombra baixou a cabeça.\n\n— Sim. És.\n\n— Então porque me chamam Mbanza?\n\nDurante alguns segundos, o silêncio permaneceu entre ambos. Depois, a sombra pousou o cajado no chão.\n\n— Antes de um nome ser pronunciado, existe uma intenção. Antes de uma intenção, existe uma escolha. E, antes de uma escolha, existe a possibilidade de fazer algo diferente.\n\nKalunga franziu o sobrolho.\n\n— Isso não responde à pergunta.\n\n— Mbanza não é apenas um nome. É uma posição. Uma função. Um lugar que alguém ocupa quando as fronteiras deixam de conseguir manter-se fechadas.\n\n— A porta.\n\n— A porta.\n\nKalunga olhou para a própria mão.\n\n— Então o meu pai era Mbanza?\n\n— O teu pai carregou a marca. Mas não ocupou o mesmo lugar que tu.\n\n— Porquê?\n\nA sombra levantou os olhos vermelhos.\n\n— Porque ele nasceu quando a porta estava fechada. Tu nasceste quando ela começou a abrir-se.\n\nKalunga sentiu um arrepio.\n\n— Isso quer dizer que eu estava destinado a isto desde o nascimento?\n\n— Destino é uma palavra que os vivos usam quando têm medo de reconhecer as escolhas que os trouxeram até aqui.\n\nA resposta fez Kalunga ficar imóvel.\n\nEra a primeira vez que a sombra dizia algo que não soava a uma ordem ou a uma ameaça. Havia nela uma espécie de tristeza, uma recordação que não queria mostrar.\n\n— Então eu posso escolher?\n\nA sombra demorou a responder.\n\n— Podes escolher muitas coisas.\n\n— Isso não é suficiente.\n\n— Não. Não é.\n\nKalunga esperou.\n\nA sombra olhou para o cajado, passando os dedos pela madeira antiga.\n\n— Houve um tempo em que a Morte não precisava de ser representada por uma figura. Não precisava de um rosto, de uma voz ou de um nome. As coisas nasciam, viviam e partiam. O mundo conhecia os seus limites. Depois, alguém decidiu que perder era uma injustiça que podia ser corrigida.\n\nKalunga pensou em Nzambi.\n\n— A Criação?\n\n— Não simplifiques aquilo que ainda não compreendes. A Criação não é inimiga da Morte. O nascimento não é uma afronta ao fim. Mas houve quem desejasse criar sem limite, conservar sem perda, restaurar sem aceitar as consequências. E houve quem desejasse pôr fim a tudo aquilo que não conseguia controlar.\n\n— A Morte.\n\n— Não a Morte que tu imaginas. Não apenas o fim de uma respiração. Falo de uma vontade que confundiu equilíbrio com domínio.\n\nKalunga sentiu o peito apertar-se.\n\n— E eu herdei essa vontade?\n\nA sombra não respondeu.\n\nA ausência de resposta foi pior do que uma confirmação.\n\nKalunga levantou-se e começou a caminhar pela sala.\n\n— Não quero matar ninguém. Não quero decidir quem vive ou morre. Na minha fé, tirar uma vida é pecado. Eu acredito nisso. Sempre acreditei. E não vou deixar que uma marca, um deus ou uma criatura me convença de que aquilo que é errado se torna certo só porque me deram poder para o fazer.\n\nA sombra acompanhou-o com o olhar.\n\n— E se alguém te pedir que salves uma vida?\n\nKalunga parou.\n\n— Vou tentar.\n\n— Mesmo que, para isso, tenhas de tirar outra?\n\nO jovem não respondeu.\n\nA sombra levantou-se lentamente.\n\n— E se alguém que amas estiver a morrer? E se a tua mão puder prolongar-lhe a vida, mas cada dia roubado ao fim tiver de ser retirado a outra pessoa? E se o destino exigir que julgues alguém que amas por aquilo que fez a alguém inocente? Kalunga sentiu o sangue gelar.\n\nAs palavras pareciam ter sido escolhidas para feri-lo num lugar que ainda não conhecia.\n\n— Como sabes isso?\n\nA sombra aproximou-se.\n\n— Porque a porta não mostra apenas o que aconteceu. Também mostra aquilo que pode acontecer.\n\nKalunga recuou.\n\n— Viste a minha família?\n\nA sombra ficou em silêncio.\n\n— Viste?\n\n— Vi possibilidades.\n\n— Quais?\n\n— Não te posso dizer.\n\nKalunga agarrou o cajado.\n\nA madeira estava fria. No instante em que os dedos se fecharam em torno dela, uma onda de imagens atravessou-lhe a mente.\n\nViu uma menina deitada numa cama, tão pequena sob o lençol que parecia ter sido esquecida pelo próprio mundo. O rosto estava pálido, os lábios entreabertos, a respiração fraca. Ao lado da cama, uma mão segurava a sua. Viu um jovem com o rosto marcado pela violência, os olhos vermelhos de cansaço e culpa. Havia sangue nas suas mãos. Não sabia se era dele ou de outra pessoa. Atrás dele, uma figura jazia no chão, imóvel.\n\nDepois, viu-se a si mesmo.\n\nEstava de pé entre os dois.\n\nNuma mão, a marca negra.\n\nNa outra, uma luz dourada.\n\nÀ sua volta, pessoas gritavam nomes que ele não conseguia compreender. O chão estava coberto de flores murchas e cinzas. Ao longe, uma porta de pedra abria-se lentamente.\n\nKalunga largou o cajado com um grito.\n\nCaiu de joelhos, respirando como se tivesse corrido durante horas. A sombra não tentou ajudá-lo.\n\n— O que viste? — perguntou apenas.\n\nKalunga levantou o rosto, tomado por uma raiva que mal conseguia conter.\n\n— Não voltes a entrar na minha cabeça.\n\n— Não fui eu.\n\n— Então quem foi?\n\nA sombra olhou para a porta da casa.\n\nDo outro lado, alguém bateu três vezes.\n\nKalunga levantou-se devagar.\n\nA pessoa na divisão ao lado abriu a porta, mas não entrou. Ficou parada no corredor, com o rosto pálido e os olhos fixos no jovem.\n\n— Kalunga — chamou.\n\nEle virou-se.\n\n— O que foi?\n\nA voz hesitou.\n\n— Há alguém à tua procura.\n\n— Quem?\n\nA resposta veio do lado de fora.\n\n— Um mensageiro.\n\nA marca aqueceu-lhe a mão.\n\nKalunga fechou os olhos por um instante, reunindo a pouca paciência que ainda lhe restava.\n\n— Diz-lhe que não quero falar com ele.\n\n— Já lhe disse.\n\n— E o que respondeu?\n\nA pessoa baixou a cabeça.\n\n— Que não veio falar contigo.\n\nO silêncio tornou-se absoluto.\n\n— Então veio fazer o quê?\n\nA porta abriu-se lentamente.\n\nDo lado de fora, o mensageiro estava acompanhado por duas figuras encapuzadas. Uma delas segurava um recipiente de barro. A outra trazia um pequeno ramo de folhas verdes, ainda cobertas de orvalho. O mensageiro olhou para Kalunga.\n\n— A Criação despertou.\n\nKalunga sentiu a marca pulsar.\n\n— Eu sei.\n\n— Não sabes. Viste apenas o primeiro sinal.\n\nA figura que segurava o recipiente avançou um passo.\n\nO barro estava rachado. Pelas fendas, escapava uma luz dourada, fraca mas persistente. A segunda figura pousou o ramo no chão.\n\nAs folhas começaram a murchar.\n\nKalunga recuou.\n\n— O que é isso?\n\n— Uma prova — respondeu o mensageiro.\n\n— De quê?\n\nO mensageiro ergueu a mão, e a marca de Kalunga respondeu com uma pulsação violenta.\n\n— De que duas forças podem tocar-se sem se compreenderem. De que a Criação pode devolver aquilo que a Morte libertou. E de que a porta já não reconhece apenas um guardião.\n\nKalunga olhou para o ramo.\n\nAs folhas estavam agora completamente secas.\n\nDepois, uma delas voltou a ficar verde.\n\nA mudança foi pequena, quase imperceptível, mas todos a viram. A sombra apareceu atrás de Kalunga, o cajado erguido.\n\n— Não o deixes continuar.\n\nO mensageiro ignorou-a.\n\n— O Primeiro exige que venhas.\n\nKalunga sentiu o medo apertar-lhe a garganta.\n\n— Para quê?\n\n— Para responderes a uma pergunta.\n\n— Qual?\n\nO mensageiro aproximou-se o suficiente para que Kalunga visse o reflexo da sua própria mão nos olhos dele.\n\n— Quando a Morte e a Criação se encontrarem diante da mesma vida, qual delas terá o direito de decidir?\n\nKalunga ficou imóvel.\n\nNão era uma pergunta sobre deuses. Não era uma pergunta sobre forças antigas, portas ou nomes esquecidos.\n\nEra uma pergunta sobre o que faria quando alguém lhe pedisse que escolhesse. E, pela primeira vez, compreendeu que o destino não estava apenas a tentar descobrir o que ele era.\n\nEstava a preparar-se para descobrir aquilo que ele seria capaz de fazer. O mensageiro voltou-se para a noite.\n\n— Tens até à próxima lua para responder.\n\nAs duas figuras desapareceram com ele, deixando o recipiente de barro à porta. Kalunga aproximou-se.\n\nA luz dourada dentro do recipiente apagou-se.\n\nNo fundo, havia apenas terra escura e uma pequena semente. A sombra olhou para ela e baixou o cajado.\n\n— A primeira semente — murmurou.\n\nKalunga levantou a cabeça.\n\n— O que significa?\n\nA sombra não respondeu.\n\nMas, muito longe dali, Nzambi acordou com a mão fechada em torno de uma semente idêntica.\n\nE, no lugar onde não existia manhã nem noite, a figura velada atrás da porta de pedra abriu os olhos.\n\nPela primeira vez em muitas eras, sorriu."},{"title":"CAPÍTULO 12 — A Semente Que Não","text":"Devia Existir Há coisas que morrem duas vezes.\n\nA primeira morte acontece quando o corpo deixa de responder ao mundo, quando o peito abandona o ritmo que o sustentava e os olhos se fecham para tudo aquilo que ainda não foi dito. A segunda ocorre quando já ninguém se lembra do nome, quando as histórias perdem a voz e a existência de alguém se reduz a uma fotografia esquecida numa gaveta.\n\nMas havia uma terceira morte, sobre a qual ninguém falava. Acontecia quando algo regressava sem pertencer verdadeiramente àquilo que fora.\n\nKalunga começou a compreender essa possibilidade na manhã seguinte, quando encontrou a semente dourada sobre a mesa da cozinha.\n\nNão se lembrava de a ter retirado do recipiente de barro. Na verdade, recordava-se de ter deixado o recipiente à porta, de ter fechado a casa e de ter permanecido acordado até o céu começar a clarear. Contudo, ali estava ela: pequena, escura nas extremidades, atravessada por uma linha de luz que pulsava com a regularidade de um coração.\n\nNão havia terra espalhada sobre a mesa. Nenhuma pegada no chão. Nenhuma janela aberta.\n\nA semente simplesmente estava ali.\n\nKalunga aproximou o rosto.\n\nA luz tornou-se mais intensa.\n\nEle afastou-se.\n\n— Não vou tocar em ti — murmurou.\n\nA semente continuou a pulsar.\n\n— E também não vou conversar contigo.\n\nUma pausa.\n\n— Não importa o que estejas a tentar fazer.\n\nDo outro lado da cozinha, a pessoa que o criara observava-o em silêncio. Tinha os braços cruzados sobre o peito e uma expressão que misturava preocupação e resignação. Nos últimos dias, aprendera que perguntar o que estava a acontecer raramente produzia uma resposta satisfatória. Ainda assim, continuava a observar o jovem como se a insistência pudesse mantê-lo preso ao mundo que conhecia.\n\n— Vais sair? — perguntou.\n\nKalunga olhou para a porta.\n\n— Preciso de encontrar alguém.\n\n— Aquele rapaz?\n\nEle não respondeu.\n\n— O que faz crescer as plantas?\n\nKalunga levantou os olhos.\n\n— Quem te falou dele?\n\n— As pessoas falam. Dizem que apareceu uma árvore onde antes havia apenas um tronco morto. Dizem que tocou numa criança doente. Há quem diga que é um santo. Outros dizem que é uma maldição.\n\nKalunga soltou uma respiração cansada.\n\n— As pessoas dão nomes às coisas quando não sabem explicá-las.\n\n— E tu? Já sabes explicar o que és?\n\nA pergunta atingiu-o com uma precisão que nenhuma criatura sobrenatural conseguira alcançar.\n\nKalunga olhou para a mão.\n\n— Não.\n\nA resposta pareceu surpreender quem a ouvira.\n\nTalvez esperasse uma mentira. Talvez esperasse uma promessa de que tudo ficaria bem. Mas Kalunga já estava cansado de oferecer certezas que não possuía. A pessoa aproximou-se da mesa.\n\n— Então não te esqueças de quem eras antes de começares a procurar respostas. Kalunga quase sorriu.\n\n— E quem era eu?\n\nDesta vez, o silêncio foi longo.\n\n— Um rapaz que se preocupava demasiado com os outros. Que discutia quando achava que alguém estava a ser injustiçado. Que dizia não ter medo, mesmo quando tremia. Um rapaz que ainda acreditava que, se fizesse a coisa certa, o mundo acabaria por reconhecer isso.\n\nKalunga baixou a cabeça.\n\n— Talvez eu estivesse enganado.\n\n— Talvez. Mas não deixes que o medo te convença de que a tua bondade era estupidez.\n\nEle guardou a semente no bolso, embrulhada num pedaço de tecido, e saiu.\n\nEncontrou Nzambi junto a um terreno abandonado, nos arredores de uma rua movimentada. O jovem estava sentado sobre uma pedra, a olhar para um pequeno monte de terra. À sua frente, um rebento verde rompia a superfície, apesar de o solo estar seco.\n\nNzambi parecia ter passado a noite sem dormir.\n\nQuando viu Kalunga, não se levantou imediatamente.\n\n— Pensei que demorasses mais tempo a aparecer.\n\n— Não vim porque queria ver-te.\n\n— Naturalmente.\n\n— Vim por causa disto.\n\nKalunga retirou a semente do bolso.\n\nNzambi ficou de pé tão depressa que quase perdeu o equilíbrio. A expressão do seu rosto mudou.\n\nNão era espanto. Era reconhecimento, seguido de um medo que tentou esconder tarde demais.\n\n— Onde a encontraste?\n\n— O mensageiro deixou-a em minha casa.\n\n— Mostra-me.\n\nKalunga manteve a mão fechada.\n\n— Primeiro, explica-me o que é.\n\nNzambi passou a língua pelos lábios, procurando as palavras.\n\n— Não sei exactamente.\n\n— Começamos bem.\n\n— Kalunga, estou a falar a sério. Nunca vi uma semente como essa. Mas sinto que não devia existir.\n\n— Porquê?\n\nNzambi aproximou-se, sem tocar na mão fechada.\n\n— Porque está viva e morta ao mesmo tempo.\n\nKalunga sentiu um arrepio.\n\n— Isso não faz sentido.\n\n— Acreditas que alguma coisa precisa de fazer sentido para ser real? O jovem lançou-lhe um olhar irritado.\n\nNzambi ergueu as mãos, rendido.\n\n— Tens razão. Desculpa.\n\nKalunga abriu a mão.\n\nA semente repousava na palma, e a luz que a atravessava reflectia-se nos olhos dos dois. Nzambi inclinou-se ligeiramente, como alguém que observa um animal ferido sem saber se a aproximação o ajudará ou assustará.\n\n— Posso tocar-lhe?\n\nKalunga hesitou.\n\nDepois estendeu a mão, mantendo os dedos preparados para a retirar. Nzambi tocou na semente.\n\nA luz dourada desapareceu.\n\nPor um instante, o objecto tornou-se completamente negro. Uma linha escura percorreu-lhe a superfície e estendeu-se até ao pulso de Nzambi. O jovem tentou afastar a mão, mas os dedos permaneceram presos.\n\nKalunga agarrou-lhe o braço.\n\n— Larga!\n\n— Estou a tentar!\n\nA marca de Kalunga abriu-se sob a pele.\n\nO ar ficou pesado.\n\nAs pedras do terreno começaram a vibrar, e o rebento diante de Nzambi dobrou-se até tocar na terra. Uma onda de frio espalhou-se pelo chão, avançando em direcção às casas. As pessoas que passavam na rua pararam, confusas, ao sentirem o vento mudar.\n\nKalunga sentiu uma voz dentro da cabeça.\n\nDevolve.\n\nA palavra não vinha de Nzambi. Não vinha da sombra. Parecia surgir de um lugar situado entre os dois, onde a existência ainda não escolhera a forma que teria. Kalunga apertou o braço de Nzambi.\n\n— Não vou devolver nada!\n\nA voz repetiu-se.\n\nDevolve o que foi retirado.\n\nA marca começou a queimar.\n\nKalunga percebeu, sem compreender como, que a semente não estava a tentar destruir Nzambi. Estava a procurar alguma coisa dentro dele. Algo que a criação reconhecia como seu, mas que não conseguia alcançar sem atravessar a fronteira que separava os dois poderes.\n\nE essa fronteira passava pela mão de Kalunga.\n\nEle podia deixar que continuasse.\n\nPodia tentar interromper o processo.\n\nMas não sabia o que aconteceria se escolhesse qualquer uma das duas opções.\n\n— Nzambi, olha para mim!\n\nO jovem ergueu o rosto. A dor tornara-lhe os olhos húmidos.\n\n— Não consigo largar!\n\nKalunga olhou para a marca.\n\nA sombra apareceu junto ao muro, o cajado na mão.\n\n— Afasta-te dele.\n\n— Não!\n\n— Kalunga, se a ligação continuar, alguma coisa será arrancada.\n\n— Então ajuda-me a pará-la!\n\nA sombra não se mexeu.\n\nA sua imobilidade enfureceu-o.\n\n— Tu sabes como funciona! Estiveste comigo desde o princípio! Não podes continuar a exigir que eu escolha enquanto te recusas a explicar o que está em jogo!\n\nA sombra baixou o cajado.\n\n— Se te ensinar a controlar a morte, um dia terás de decidir o que fazer com ela.\n\n— E se não me ensinares, alguém poderá morrer porque eu não soube agir! A sombra ficou em silêncio.\n\nFoi o suficiente para Kalunga compreender que, pela primeira vez, a criatura não tinha uma resposta que pudesse oferecer sem se contradizer. O jovem voltou-se para Nzambi.\n\n— Vou tentar uma coisa. Não sei se vai resultar.\n\nNzambi respirou com dificuldade.\n\n— Faz o que tiveres de fazer.\n\nKalunga fechou os olhos.\n\nNão pediu poder. Não pronunciou palavras antigas. Não chamou o nome de nenhum deus.\n\nPensou apenas no que estava a tentar impedir.\n\nNão queria que a semente desaparecesse. Não queria que Nzambi sofresse. Não queria destruir aquilo que não compreendia apenas porque tinha medo do resultado.\n\nA sua fé ensinara-lhe que a intenção não tornava todos os actos correctos. Mas também lhe ensinara que a omissão podia ser uma escolha. Por isso, tentou fazer a única coisa que ainda lhe parecia possível. Não comandou a morte.\n\nPediu-lhe que esperasse.\n\nA marca arrefeceu.\n\nA linha negra soltou-se do pulso de Nzambi e regressou à semente. O objecto caiu na palma de Kalunga, imóvel. A luz dourada reapareceu, fraca, mas constante. Nzambi caiu de joelhos.\n\nKalunga segurou-o antes que atingisse o chão.\n\nDurante alguns segundos, nenhum dos dois falou.\n\nO rebento à frente deles permanecia curvado. As folhas estavam pálidas, mas não tinham morrido.\n\nA sombra observava-os.\n\n— O que fizeste? — perguntou Nzambi, quando conseguiu recuperar o fôlego. Kalunga olhou para a semente.\n\n— Não sei.\n\n— A tua marca mudou.\n\nKalunga abriu a mão.\n\nO círculo negro tinha agora duas pequenas linhas douradas, uma de cada lado da abertura. Pareciam cicatrizes recentes numa ferida antiga.\n\n— E a tua? — perguntou.\n\nNzambi examinou o pulso. Uma linha escura atravessava-lhe a pele, mas desaparecia antes de chegar à palma.\n\n— Parece que alguma coisa passou por mim.\n\nA sombra bateu com o cajado no chão.\n\n— Não passou. Reconheceu-vos.\n\nOs dois jovens olharam para ela.\n\n— Reconheceu o quê? — perguntou Kalunga.\n\nA sombra fitou a semente.\n\n— Uma possibilidade que devia ter sido enterrada antes de vocês nascerem. O vento soprou sobre o terreno.\n\nA semente abriu-se.\n\nDe dentro dela surgiu uma raiz branca, fina como um fio de cabelo. Não procurou a terra. Ergueu-se no ar, contorceu-se lentamente e formou um pequeno círculo incompleto.\n\nO símbolo da porta.\n\nNzambi recuou.\n\nKalunga sentiu a marca pulsar.\n\nA raiz desfez-se em pó.\n\nE, no lugar onde desaparecera, ficou uma única palavra gravada na pedra. ORIGEM.\n\nNaquela noite, cada um regressou a casa levando uma pergunta diferente. Nzambi perguntou-se se a Criação podia gerar algo que nem ela própria compreendesse.\n\nKalunga perguntou-se se a Morte podia recusar uma ordem. A sombra, pela primeira vez em muitas eras, perguntou-se se o seu silêncio ainda protegia alguém.\n\nE, muito longe dali, no espaço onde os nomes eram registados antes de serem pronunciados, uma página antiga começou a arder.\n\nNela estavam escritos dois nomes.\n\nKalunga Mwena.\n\nNzambi.\n\nEntre ambos, alguém gravara uma frase que nenhuma das entidades se atrevera a apagar:\n\nQuando os opostos se reconhecerem, a porta procurará um terceiro caminho."},{"title":"CAPÍTULO 13 — O Julgamento dos","text":"Sem-Nome O mensageiro regressou antes do amanhecer.\n\nKalunga ouviu três batidas à porta e soube, antes de se levantar, quem estava do outro lado. A marca não ardia, mas mantinha-se desperta, como um animal que reconhece os passos do dono de uma casa distante.\n\nDesta vez, não foi sozinho.\n\nNzambi chegou pouco depois, acompanhado pelo silêncio de quem também não tivera escolha. O rosto mostrava sinais de cansaço, e a linha escura no pulso permanecia visível, mesmo quando tentava escondê-la sob a manga. O mensageiro esperava-os na rua.\n\n— O Primeiro convocou-vos.\n\nKalunga cruzou os braços.\n\n— Já ouvi isso.\n\n— Então não precisarei de repetir.\n\n— Não vais levar-nos a lado nenhum sem explicar porquê.\n\nO mensageiro observou-o com a mesma expressão vazia de sempre.\n\n— A explicação será dada onde as palavras não podem mentir. Nzambi olhou para Kalunga.\n\n— Isso parece uma armadilha.\n\n— É porque provavelmente é.\n\nO mensageiro não demonstrou qualquer reacção.\n\nErgueu a mão e desenhou no ar o círculo incompleto. A linha abriu-se como uma fenda, revelando um corredor de pedra que não existia na rua segundos antes. Do outro lado, soprava um vento frio.\n\n— Entrem.\n\nKalunga olhou para a abertura.\n\nNão queria obedecer. Não queria voltar ao vazio, nem enfrentar a presença que lhe dobrara os joelhos. Mas a semente, guardada no bolso, pulsou uma vez. A palavra gravada na pedra regressou-lhe à memória.\n\nOrigem.\n\nDeu o primeiro passo.\n\nNzambi seguiu-o.\n\nO corredor fechou-se atrás deles.\n\nO lugar para onde foram levados não era o vazio que Kalunga conhecia. Era uma planície coberta de pedras negras, atravessada por rios sem água. No horizonte, enormes árvores erguiam-se com as raízes expostas, suspensas no ar como dedos de gigantes enterrados de cabeça para baixo. Não havia sol, mas tudo era visível. Não havia vento, mas as folhas moviam-se. E não havia sombras.\n\nKalunga reparou nisso imediatamente.\n\nO seu corpo estava diante de si, iluminado por uma claridade sem origem. Nzambi também não projectava qualquer sombra. Nem o mensageiro. A ausência inquietou-o mais do que a escuridão.\n\n— Onde estamos? — perguntou.\n\n— Num lugar que existe entre o que termina e o que ainda não começou — respondeu o mensageiro.\n\n— Isso não é um lugar.\n\n— Estás nele.\n\nO corredor desapareceu.\n\nÀ frente deles surgiu um edifício antigo, construído com pedras de diferentes cores. Algumas eram claras, outras tão escuras que pareciam absorver a própria forma. Não havia portas visíveis, apenas uma abertura estreita no centro da parede.\n\nAcima dela, estava gravado o símbolo da marca.\n\nNzambi aproximou-se da inscrição.\n\n— Já vi isto.\n\n— No sonho? — perguntou Kalunga.\n\n— Sim.\n\nO mensageiro fez um gesto.\n\nA abertura alargou-se.\n\nNo interior havia uma sala circular. O chão estava coberto de nomes escritos em linhas que se cruzavam, separavam e voltavam a unir-se. Alguns eram recentes, outros pareciam ter sido gravados quando ainda não existiam palavras para os pronunciar.\n\nNo centro, encontrava-se uma balança.\n\nUm dos pratos estava vazio.\n\nNo outro repousava uma pedra pequena, branca, sem qualquer inscrição. Kalunga aproximou-se.\n\n— O que significa?\n\n— Um julgamento — respondeu o mensageiro.\n\n— De quem?\n\nAs paredes estremeceram.\n\nOs nomes começaram a mover-se.\n\nPrimeiro lentamente, como folhas arrastadas por uma corrente de água. Depois com maior velocidade, formando espirais que percorriam o chão e subiam pelas paredes. Algumas letras soltaram-se da pedra e transformaram-se em pequenas luzes.\n\nKalunga ouviu vozes.\n\nNão eram vozes de pessoas vivas. Eram fragmentos de últimas palavras, pedidos interrompidos, nomes gritados por bocas que já não existiam. Uma criança chamava pela mãe.\n\nUm homem pedia perdão.\n\nUma mulher repetia o nome de alguém que nunca regressara. As vozes sobrepunham-se até se tornarem quase insuportáveis. Nzambi tapou os ouvidos.\n\n— Faz isso parar!\n\nO mensageiro permaneceu imóvel.\n\n— Não posso.\n\n— Então quem pode? — gritou Kalunga.\n\nO chão abriu-se.\n\nDiante deles surgiu uma figura humana, coberta de cinza. Não tinha rosto, apenas uma superfície lisa onde deveriam estar os olhos e a boca. O corpo parecia incompleto, como se tivesse sido desenhado por alguém que se esquecera de terminar o trabalho.\n\nA figura ajoelhou-se diante da balança.\n\nO mensageiro falou:\n\n— Este é um dos sem-nome.\n\nKalunga olhou para a criatura.\n\n— O que lhe aconteceu?\n\n— Foi esquecido.\n\n— Isso não é uma resposta.\n\n— Para algumas coisas, é a única sentença que resta.\n\nA figura ergueu a cabeça.\n\nUma voz saiu do seu corpo, mas não parecia vir de uma garganta.\n\n— Eu tinha um nome.\n\nAs palavras ecoaram na sala.\n\nKalunga deu um passo em frente.\n\n— Qual era?\n\n— Já não sei.\n\nA figura tocou no próprio peito.\n\n— Lembro-me da casa onde nasci. Lembro-me do cheiro do pão que a minha mãe fazia. Lembro-me de uma árvore junto à estrada e de um homem que me ensinou a caminhar. Mas não me lembro do meu nome.\n\nNzambi aproximou-se.\n\n— Não pode ser.\n\nA figura virou-se para ele.\n\n— Também me lembro de ter amado a vida. Lembro-me de ter medo de morrer. Lembro-me de ter acreditado que alguém guardaria a minha memória. A voz tornou-se mais fraca.\n\n— Ninguém guardou.\n\nKalunga sentiu um aperto no peito.\n\nPensou na segunda morte, aquela que acontece quando o último vestígio de alguém desaparece do mundo.\n\n— Porque está aqui? — perguntou.\n\nO mensageiro apontou para a balança.\n\n— Porque o seu destino não foi concluído.\n\n— Foi morto?\n\n— A morte do corpo foi apenas o início. O seu nome foi retirado do registo. Sem ele, não consegue avançar nem regressar.\n\nNzambi olhou para a figura com indignação.\n\n— Então devolvam-lhe o nome.\n\nO mensageiro virou-se para ele.\n\n— Qual?\n\nNzambi abriu a boca, mas não conseguiu responder.\n\n— Não o conheces — continuou o mensageiro. — Não sabes quem foi, o que fez ou o que escolheu. Queres devolver-lhe algo sem saber se aquilo que devolves lhe pertence.\n\n— Pelo menos quero tentar!\n\n— A Criação tenta antes de compreender. A Morte compreende antes de agir. E ambas podem destruir aquilo que pretendem preservar.\n\nKalunga sentiu o olhar do mensageiro pousar sobre si.\n\n— Por que nos trouxeste aqui? — perguntou.\n\n— Porque a porta reconheceu os vossos poderes, mas ainda não reconhece a vossa vontade. O Primeiro quer saber se sois capazes de distinguir aquilo que desejais fazer daquilo que tendes o direito de fazer.\n\nO mensageiro apontou para a balança.\n\n— Um de vós deverá restaurar o nome. O outro deverá decidir se o nome pode ser restaurado.\n\nNzambi ficou imóvel.\n\nKalunga sentiu a raiva crescer.\n\n— Isso é absu
