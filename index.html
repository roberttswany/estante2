<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Estante</title><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap"><link id="icon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232B2BFF'/%3E%3Cpath fill='%23fff' d='M18 14h28v8H26v6h14v8H26v6h20v8H18z'/%3E%3C/svg%3E"><style id="reset">:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><style id="css">/* Layout: one oversized ultramarine hero band over a quiet field of hard-shadowed covers; the reading room drops to paper, sepia or night. */
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --fg:#0E1030; --muted:#585B80; --line:#D3D6EC;
  --accent:#2B2BFF; --on-accent:#FFFFFF; --link:#2B2BFF; --hl:#FFD23F; --danger:#C22A2A;
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-read:'Literata',Georgia,'Times New Roman',serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --font-ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C1E; --surface:#14162E; --fg:#ECEDFF; --muted:#9A9DC8; --line:#2B2E57;
    --accent:#3535F2; --on-accent:#FFFFFF; --link:#A5AAFF; --hl:#FFD23F; --danger:#FF7A7A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C1E; --surface:#14162E; --fg:#ECEDFF; --muted:#9A9DC8; --line:#2B2E57;
  --accent:#3535F2; --on-accent:#FFFFFF; --link:#A5AAFF; --hl:#FFD23F; --danger:#FF7A7A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-ui);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
body.on-hero::before{background:var(--accent)}
body[data-rt="paper"]{--bg:#FFFFFF;--surface:#F5F5FA;--fg:#17171F;--muted:#6A6A7C;--line:#E3E3EC;--link:#2B2BFF;color-scheme:light}
body[data-rt="sepia"]{--bg:#F0E6D2;--surface:#E8DDC5;--fg:#352C20;--muted:#76674F;--line:#D9CCB0;--link:#7A3E12;color-scheme:light}
body[data-rt="night"]{--bg:#07070D;--surface:#10111C;--fg:#C9CAD9;--muted:#7E809B;--line:#1D1E33;--link:#9AA0FF;color-scheme:dark}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--link);outline-offset:3px}
h1,h2,h3,p{margin:0}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.muted{color:var(--muted)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:22px}
.brand{font:800 1.05rem var(--font-display);letter-spacing:-.01em;text-decoration:none}
.top nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.top nav a{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-bottom:2px solid currentColor;padding-bottom:2px}

/* hero */
.hero{background:var(--accent);color:var(--on-accent)}
.hero .wrap{padding-bottom:64px}
.hero h1{font:800 clamp(1.9rem,6vw,4.4rem)/1.04 var(--font-display);letter-spacing:-.03em;max-width:17ch;text-wrap:balance;margin-top:clamp(36px,8vw,84px)}
.hero .by{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px 26px}
.hero .by span{opacity:.92}

/* shelf */
.shelf{padding-block:44px 72px}
.shelf-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:32px}
.shelf-head h2{font:800 1.25rem var(--font-display);letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--fg);background:transparent;padding:6px 12px;border-radius:2px;cursor:pointer;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:40px 26px}
.card{display:flex;flex-direction:column;gap:14px;text-decoration:none;min-width:0}
.card .cover{box-shadow:6px 6px 0 var(--fg);transition:transform .15s ease,box-shadow .15s ease}
.card:hover .cover,.card:focus-visible .cover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--fg)}
.card-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.card h3{font:600 1rem/1.25 var(--font-read);overflow-wrap:anywhere}
.card .sub{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;width:max-content;background:var(--hl);color:#14152E;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
.empty{border:2px dashed var(--line);padding:48px 24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.empty h3{font:800 1.3rem var(--font-display);letter-spacing:-.02em}
.empty p{max-width:52ch;color:var(--muted)}

/* covers */
.cover{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--c-bg,#222);container-type:inline-size;max-width:100%}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.cover.gen .c-genre{position:absolute;left:10%;top:7%;right:10%;font:500 4.6cqw var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-fg);opacity:.9}
.cover.gen .c-title{position:absolute;left:10%;right:10%;bottom:8%;font:800 10.5cqw/1.08 var(--font-display);letter-spacing:-.02em;text-transform:uppercase;color:var(--c-fg);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.c-shape{position:absolute}
.c-shape.s0{width:64%;aspect-ratio:1;border-radius:50%;background:var(--c-ac);right:-14%;top:16%}
.c-shape.s1{width:72%;height:34%;border-radius:999px 999px 0 0;background:var(--c-ac);left:14%;top:24%}
.c-shape.s2{left:0;right:0;top:20%;height:34%;background:repeating-linear-gradient(90deg,var(--c-ac) 0 9%,transparent 9% 18%)}

/* book page */
.bookpage{padding-block:12px 80px;display:grid;grid-template-columns:minmax(200px,300px) minmax(0,1fr);gap:44px;align-items:start}
.bookpage .cover{box-shadow:9px 9px 0 var(--fg)}
.bookinfo{display:flex;flex-direction:column;gap:18px;min-width:0}
.bookinfo h1{font:800 clamp(1.6rem,4vw,2.7rem)/1.08 var(--font-display);letter-spacing:-.03em;text-wrap:balance;overflow-wrap:anywhere}
.bookinfo .syn{font:400 1.08rem/1.7 var(--font-read);max-width:62ch;white-space:pre-line}
.btnrow{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:12px 20px;border-radius:2px;cursor:pointer;text-decoration:none;font:700 .82rem var(--font-display);letter-spacing:-.01em}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.sm{padding:7px 12px;font-size:.72rem}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn[data-armed]{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.chlist{list-style:none;margin:8px 0 0;padding:0;border-top:2px solid var(--fg)}
.chlist a{display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.chlist a:hover{background:var(--surface)}
.chlist .n{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.chlist .t{font:600 1.02rem/1.3 var(--font-read);overflow-wrap:anywhere}
.chlist .m{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.back{display:inline-block;margin-bottom:22px}
.back a{text-decoration:none;border-bottom:2px solid currentColor}

/* tabs + comments */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--fg);margin-top:8px}
.tabs button{border:0;background:transparent;padding:10px 18px;cursor:pointer;font-family:var(--font-mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.comments{display:flex;flex-direction:column;gap:22px;padding-top:20px}
.cform{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--surface);border:1px solid var(--line)}
.cform .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.cm{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.cm b{font:600 1rem var(--font-read);overflow-wrap:anywhere}
.cm p{font:400 1rem/1.6 var(--font-read);white-space:pre-line;overflow-wrap:anywhere}

/* reader */
.rbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.rbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.rbar .l{display:flex;gap:16px;align-items:center;min-width:0}
.rbar .l a{text-decoration:none;border-bottom:2px solid currentColor}
.rbar .l span{white-space:nowrap}
.aa{border:1.5px solid var(--fg);background:transparent;border-radius:2px;padding:5px 11px;cursor:pointer;font:700 .95rem var(--font-read)}
.rpanel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));background:var(--surface);border:2px solid var(--fg);padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:6px 6px 0 var(--fg)}
.rpanel .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rpanel .lbl{width:100%}
.rprog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:41;pointer-events:none}
.rprog i{display:block;height:100%;background:var(--link);transform-origin:left;transform:scaleX(0)}
.reading{width:100%;max-width:41rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 40px;font-family:var(--font-read);font-size:20px}
.reading.sans{font-family:var(--font-ui)}
.reading .eyebrow{display:block;font-family:var(--font-mono);font-size:.62em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.reading h2{font:800 1.55em/1.15 var(--font-display);letter-spacing:-.03em;margin:14px 0 40px;text-wrap:balance;overflow-wrap:anywhere}
.prose{display:flex;flex-direction:column;gap:1.05em;line-height:1.75}
.prose p{overflow-wrap:anywhere}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:56px;padding-top:24px;border-top:2px solid var(--fg);font-size:16px;font-family:var(--font-ui)}
.pager .share{flex-basis:100%;display:flex;justify-content:center}
.foot{padding-block:28px 40px;border-top:1px solid var(--line);color:var(--muted)}

/* admin */
.admin{padding-block:8px 80px;display:flex;flex-direction:column;gap:36px}
.admin h1{font:800 clamp(1.5rem,4vw,2.3rem)/1.1 var(--font-display);letter-spacing:-.03em}
.panel{display:flex;flex-direction:column;gap:16px;padding:22px;background:var(--surface);border:1px solid var(--line)}
.panel h2{font:800 1.05rem var(--font-display);letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);padding:11px 12px;border-radius:2px;min-width:0}
.field textarea{min-height:120px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.row2{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hint{font-size:.9rem;color:var(--muted);max-width:64ch}
.note{border-left:4px solid var(--accent);padding:10px 14px;background:var(--bg);font-size:.95rem;max-width:70ch}
.booklist{display:flex;flex-direction:column;border-top:2px solid var(--fg)}
.booklist .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.booklist .r b{font:600 1.02rem var(--font-read);overflow-wrap:anywhere}
.chap{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--bg);border:1px solid var(--line)}
.chap .hd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.chap .hd input{border:1.5px solid var(--line);background:var(--surface);padding:9px 10px;border-radius:2px;min-width:0;width:100%;font-weight:600}
.chap .prev{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.chap textarea{width:100%;min-height:260px;border:1.5px solid var(--line);background:var(--surface);padding:12px;border-radius:2px;font:400 1rem/1.6 var(--font-read);resize:vertical}
.chap .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.thumb{width:130px}
.btn{position:relative}
.btn input[type="file"]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.btn:focus-within{outline:3px solid var(--link);outline-offset:3px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:2px;max-width:min(92vw,480px);font-size:.95rem}

@media (max-width:720px){
  .bookpage{grid-template-columns:1fr;gap:28px}
  .bookpage .cover{max-width:240px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:32px 18px}
  .chlist a{grid-template-columns:2.4rem minmax(0,1fr)}
  .chlist .m{display:none}
  .reading{padding-top:36px}
}
@media (prefers-reduced-motion:reduce){.card .cover{transition:none}}
</style></head><body><div id="root"></div><script id="state" type="application/json">{"site":{"name":"Estante","author":"","tagline":"Histórias, capítulo a capítulo."},"books":[{"id":"b3b4s1k","title":"Nzambi wa Kufa","genre":"Mistério","status":"Completo","synopsis":"# NZAMBI WA KUFA\n### O Despertar do Ceifador\n**Jack Ndlovu**\n\nE se a própria Morte começasse a questionar o sentido de morrer?\n\nAos dezoito anos, Kalunga Mwena vive em Sambizanga, levando uma existência aparentemente comum. Mas há algo nele que nunca pertenceu inteiramente ao mundo dos vivos. Desde a infância, sombras comportam-se de maneira inexplicável, o tempo parece hesitar na sua presença e um nome desconhecido insiste em acompanhá-lo: Kalunga Mbanza.\n\nQuando acontecimentos impossíveis começam a revelar a verdadeira natureza da sua existência, Kalunga descobre que carrega uma herança muito mais antiga do que a própria humanidade. Ele é o despertar de uma força ancestral ligada à Morte, enquanto Nzambi representa o poder primordial da Criação.\n\nEntre os dois existe uma história esquecida, uma porta selada e uma escolha que, em tempos remotos, dividiu aquilo que deveria permanecer unido.\n\nÀ medida que os mistérios se revelam, Kalunga vê-se confrontado com uma contradição devastadora: como poderá aceitar o papel de Ceifador se toda a sua consciência lhe ensina que tirar uma vida é um pecado? E como poderá julgar o destino dos outros quando mal consegue compreender o próprio?\n\nMas os maiores conflitos não acontecem entre deuses.\n\nA doença de alguém que ama e os erros irreversíveis de alguém da sua própria família aproximam-no de uma decisão para a qual nenhuma profecia o pode preparar. Entre a justiça e a compaixão, a criação e o fim, Kalunga terá de descobrir se a Morte existe para destruir ou se, por vezes, é apenas a última fronteira que permite à existência continuar.\n\nPorque nem todos os fins são cruéis. Nem todas as criações são eternas. E nem todos aqueles que carregam o destino de um deus estão preparados para suportar o peso de uma escolha humana.\n\n**Quando a Criação já não consegue salvar e a Morte começa a duvidar de si própria, quem terá coragem de decidir o destino do mundo?**","cover":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCALQAeADASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAAAwQCBQABBgcI/8QASBAAAgEDAwIFAgQEBAMFBwMFAQIDAAQREiExBUEGEyJRYXGBBxQykSNCobFSwdHwCBXhFiQzYvEXJTRDcoKSRKKy0kVTc5P/xAAbAQACAwEBAQAAAAAAAAAAAAACAwEEBQAGB//EADkRAAICAQQABAMGBgEFAAMBAAABAhEDBBIhMQUTQVEiYXGBobHB0fAUIzJSkeEGFSQzQvE0U2Ki/9oADAMBAAIRAxEAPwD5jcBlwDigtEc7fvWA4FThfLgHcUIXYUQFIxvnuajGo1eqiBySR3rTK52obDoi4GcAVrTRFAIyTvWaMnaus6gYGO1YVyM0ZkCDetKmd8bVFhbQABB2ogXA3orxhQDQXO+3FRdk1RjoMbc0BhRdR4qLUSAlyCxWsUQrUSNqKwKIVILtWBSeKkzECuOSIaCa2BU13G/es0aRnFdYSRHBNYKkONsVECoJoPCuATWsFnwNqdW+j/5aLT8tH5gfV5382McUroIORSlJ82i3PHFbdsr4/wAfIjImnA5oXlnmm9Oo7gZrbIAp2FTvoh4b5E9NSCUTRvUwntUuQCxgQCpp1YdQBx2qEUBdhtTccLqdPNJnMvYMLrlcCjoAcCo6DirJLJ5WCrEzMeyjNWFt4V6vcn+D0i/l/wD9du7f2FKeeMe2PWjnJ8Io0TSuecVCRdW+aum6HeIfVbTJ9UNYejz6f/hpQ3/0Gg/iIXdlp+G5mq2v/Bz5Qmtqm+4q0k6ZIhIZdJ9jQGtWGQRTlmT6KU9FOD5QEQlhknNAl32Ap5YHTtj61qSAKNYAIPf5rlPkmWBuPCorgpBydhU20ldqIybkgVEJvTd1lTY1wBCb0R roswe50wxscIGJ052G2xNKPAIiQw3qwEoYaHOw3G9TW1FzoZRqztSVNr+ouywxmqh2V0eAcjIFW1ms80RijJIxnHvS5tBHIVUhsHFWNuHs7dnWQI5PfsKDLNNcDdNjcZfF0V/5GZJdZTUoO4qKxaZcuoVce39auBFHPbs63sHoyWAfJ/pVDe3ilniiIdcY1cZ+lDjk58DMsI4Umyx6f1u2srzVplkXGBoApjx71+061fQfkbU2kCRIGjLZLPjBY/XmudS3MaCVgfcDNC89JA7yepuw9vmiWlh5iyLtBS8UyvTvTy4TBu2cAYAz96Gy5cgnmiyS/mJVWNCOwA3NTMbWxJeLDL2cf5VdToxJrc/l7g5AqxKqDHz70FsA4O5ooYyYGckcVnk6nFEhL56IxoVbJ29hVijK0ITIDE5NLMrRKX7AY3pNpPVqB3qGtxKe0LeyB5P0jbbPvSrMPvWySed6iV4o0qFt3yS1HAI2raSe5zQ/itgHgd6kixpbg5z707GpeANnbmqyKNi5QbmriNNECxkjjf5pc+BsOQULaTq2ppbswbDfPvSjYRcCoB9cm5oWrDTo/9k=","pal":null,"sample":false,"updated":"2026-11-02","chapters":[{"title":"CONTRA CAPA — Nzambi wa Kufa — O Despertar do Ceifador","text":"A morte não escolhe.\n\nA morte chama.\n\nE Kalunga atendeu.\n\nSambizanga sempre foi apenas mais um bairro, com seus becos estreitos, suas noites quentes e seus segredos escondidos nas sombras. Até que, numa madrugada silenciosa, o véu entre os vivos e os mortos se partiu — e um nome antigo voltou a ecoar pela terra: Kalunga.\n\nAos 18 anos, ele nunca buscou poder, glória ou destino.\n\nQueria apenas sobreviver ao dia seguinte.\n\nMas quando a marca do Outro Lado queimou na sua pele, Kalunga tornou-se algo impossível:\n\na porta entre mundos, o selo que não devia ter despertado. Agora, entidades ancestrais observam cada passo seu.\n\nO Primeiro, cuja voz move a lua, quer respostas.\n\nO Mensageiro de Nzambi wa Kufa desceu do rasgo no céu para julgá-lo. E as sombras — as que vivem, as que servem, e as que lembram — começam a se mexer.\n\nEnquanto o mundo treme com presságios, Kalunga enfrenta a verdade que mais teme:\n\nEle não foi escolhido.\n\nEle foi herdado.\n\nE heranças da morte nunca vêm sem cobrança.\n\nEm uma história sombria, visceral e profundamente angolana, Nzambi wa Kufa — O Despertar do Ceifador apresenta um mundo onde cada respiração pode ser um presságio e onde o protagonista precisa decidir se será a salvação ou o fim de todos os vivos.\n\nA Ceifa começou.\n\nE Kalunga é o primeiro nome na lista."},{"title":"Capítulo 1 — O Chamado Sob a Lua","text":"Vermelha A lua estava pesada naquela noite.\n\nNão pesava no céu, onde continuava suspensa entre as nuvens, mas sobre Sambizanga, sobre os telhados de zinco e as paredes cansadas, sobre os becos que guardavam segredos sem nome. O seu vermelho derramava-se pelas ruas como uma ferida aberta no rosto da cidade. Havia qualquer coisa de errado naquela luz; não iluminava verdadeiramente os lugares. Parecia antes revelar aquilo que a escuridão costumava esconder.\n\nMas não era a lua que inquietava o bairro.\n\nEra o silêncio.\n\nUm silêncio tão espesso que parecia ter aprendido a observar. O vento recolherase, os cães tinham abandonado os seus protestos nocturnos e até os bêbados que costumavam discutir com o mundo à porta do mercado haviam regressado a casa. Sambizanga não dormia. Prendia a respiração.\n\nE, naquela noite, até o medo parecia ter medo de fazer barulho. Kalunga Mwena atravessava uma das ruelas com um saco de verduras pendurado ao ombro. Tinha dezoito anos, a idade em que muitos começam a imaginar o tamanho dos próprios sonhos; ele aprendera, porém, a medir os seus pelas necessidades do dia seguinte. Havia contas que não esperavam, estômagos que não compreendiam promessas e uma vida que raramente concedia descanso a quem ainda estava a aprender a vivê-la.\n\nA pobreza ensinara-lhe a reconhecer o preço das coisas. Ainda não conseguira ensinar-lhe a desistir daquilo que não tinha preço.\n\nPor detrás do cansaço, conservava uma doçura teimosa, quase inconveniente para um mundo que tantas vezes parecia premiar a dureza. Não era ingenuidade. Era uma pequena resistência: a recusa silenciosa de se tornar inteiramente aquilo que a vida tentava fazer dele.\n\nKalunga costumava caminhar depressa. Naquela noite, abrandou. Não ouviu passos atrás de si. Não viu movimento nas janelas. Não houve grito, assobio ou sombra a atravessar-lhe o caminho.\n\nHouve apenas um arrepio.\n\nComeçou na nuca, fino como a ponta de uma agulha, e desceu-lhe pelas costas com a intimidade desagradável de uma mão que não tinha o direito de lhe tocar. Kalunga virou-se.\n\nNinguém.\n\nA rua estendia-se vazia, os postes lançavam luzes vacilantes sobre o asfalto e a lua continuava lá em cima, demasiado vermelha para parecer distante. Apertou o saco contra o ombro.\n\n— Deve ser cansaço — murmurou.\n\nDisse-o como quem oferece uma explicação ao próprio medo, esperando que este, satisfeito, se retire.\n\nMas o medo não se retirou.\n\nO ar vibrou.\n\nFoi uma mudança subtil, quase impossível de descrever: a sensação de que o espaço entre as casas se tornara mais estreito, de que a rua deixara de ser apenas rua. Kalunga sentiu a pele arrepiar-se-lhe nos braços. As sombras projectadas no chão pareciam alongar-se para além daquilo que a luz permitia. Deu dois passos.\n\nEntão olhou para baixo.\n\nA sombra aos seus pés não lhe pertencia.\n\nEra alta demais, magra demais, e segurava um objecto que não existia nas mãos dele: um cajado comprido, retorcido, semelhante a um ramo arrancado de uma árvore tão antiga que talvez tivesse crescido antes de os homens aprenderem a dar nome às coisas.\n\nKalunga ficou imóvel.\n\nA sombra ergueu a cabeça.\n\nNão havia rosto que ele pudesse distinguir, mas sentiu, com uma certeza absurda, que alguma coisa acabara de reparar nele.\n\nE o silêncio partiu-se.\n\nNão houve estrondo. Nenhum vidro estilhaçou, nenhum trovão sacudiu os telhados. A ruptura aconteceu dentro do peito de Kalunga, onde um frio sem origem lhe apertou o coração e lhe roubou o ar. As pernas cederam. O saco de verduras escorregou-lhe do ombro, e os legumes espalharam-se pelo chão sem que ele encontrasse forças para os recolher.\n\nA sombra abriu a boca.\n\nO som não veio da rua.\n\nVeio de dentro dele.\n\n— Kalunga…\n\nO seu nome, pronunciado por uma voz que não devia conhecê-lo, tornou-se subitamente uma coisa estranha. Por um instante, teve a impressão de que alguém lhe havia chamado não para o reconhecer, mas para o reclamar. Caiu de joelhos.\n\n— Quem… quem está aí?\n\nA sombra avançou.\n\nDesfez-se numa nuvem de fumo negro, mas não desapareceu: precipitou-se sobre ele, ocupando-lhe a visão, os pensamentos, o último espaço onde ainda conseguia distinguir o mundo de si mesmo.\n\nKalunga tentou gritar.\n\nA escuridão entrou-lhe pelos olhos.\n\nE a rua deixou de existir."},{"title":"Capítulo 2 — o Sopro Que Não","text":"DEVIA EXISTIR Durante alguns instantes, Kalunga não viu absolutamente nada. A escuridão envolvera-lhe os olhos, o corpo e os pensamentos, como se o mundo tivesse sido apagado por uma mão invisível. Não sabia se continuava de pé, se caíra no chão ou se a própria realidade o abandonara. Só sentia o coração, descompassado, a bater-lhe no peito com a urgência de quem procura uma saída numa casa em chamas.\n\nDepois, lentamente, a visão regressou.\n\nPrimeiro, uma mancha avermelhada. Em seguida, o contorno dos telhados, as paredes cansadas das casas e a luz trémula de um poste. Sambizanga reapareceu diante dele, mas já não parecia o mesmo lugar. Tudo permanecia onde sempre estivera, embora alguma coisa invisível tivesse mudado a natureza das coisas. Kalunga tentou respirar fundo.\n\nO ar entrou-lhe nos pulmões, mas não trouxe alívio. Tinha a garganta seca, as pernas fracas e a sensação de que uma parte de si continuava perdida naquele vazio sem chão nem tempo.\n\nBaixou os olhos para a mão.\n\nA marca permanecia na palma, escura e irregular, com o desenho de um olho fechado e um fio de fumo que parecia mover-se sob a pele. Pulsava devagar. Cada batimento fazia-lhe subir pelo braço uma onda de calor que não pertencia ao seu corpo.\n\n— Isto não pode estar a acontecer… — murmurou.\n\nQuis convencer-se de que tudo não passara de um desmaio, de uma alucinação provocada pelo cansaço, de um pesadelo nascido de uma noite demasiado estranha. Mas a marca não lhe permitia mentir a si mesmo. A sua presença era concreta; a dor, real; e o medo, demasiado profundo para ser confundido com um sonho.\n\nFoi então que ouviu os passos.\n\nLentos.\n\nArrastados.\n\nToc… toc… toc…\n\nKalunga ergueu a cabeça.\n\nO som vinha da esquina onde a luz do poste morria antes de alcançar o chão. A escuridão parecia mais espessa naquele ponto, como um tecido encharcado que escondesse alguma coisa por detrás de si.\n\n— Quem está aí? — perguntou.\n\nA própria voz lhe pareceu estranha. Saiu-lhe fraca, sem autoridade, como se o medo lhe tivesse roubado até o direito de exigir uma resposta. Os passos continuaram.\n\nKalunga recuou. A mão marcada latejou, e o frio subiu-lhe pela coluna, instalando-se entre os ombros. Olhou para o chão e sentiu o estômago contrairse.\n\nA sua sombra estava novamente errada.\n\nEstendia-se para além dos seus pés, alta e magra, com um cajado comprido na mão. Os olhos vermelhos, duas fendas de brasa na escuridão, observavam-no com uma atenção que nenhum reflexo poderia imitar.\n\nA sombra não acompanhava os seus movimentos.\n\nMovia-se por vontade própria.\n\n— O primeiro espírito está perto — disse a criatura. — Ele vê-te, mas tu ainda não sabes olhar para ele.\n\nKalunga abanou a cabeça.\n\n— Eu não quero ver coisa nenhuma! Quero que isto acabe!\n\n— O mundo não costuma terminar aquilo que começamos a descobrir.\n\n— Eu não comecei nada!\n\nA sombra inclinou a cabeça, como se ponderasse a resposta. Depois, voltou os olhos para a esquina.\n\n— Então prepara-te para sobreviver ao que veio ter contigo. A escuridão moveu-se.\n\nNão foi o vento a agitá-la, nem a luz do poste a distorcer-lhe os contornos. A própria treva pareceu empurrada por alguma coisa que procurava atravessá-la. Uma silhueta começou a formar-se, primeiro indistinta, depois cada vez mais nítida.\n\nTinha altura humana.\n\nO corpo era curvado.\n\nOs movimentos, lentos demais para pertencerem a alguém vivo. Kalunga tentou correr, mas a perna cedeu-lhe. Caiu de joelhos, apoiando a mão livre no asfalto. A marca incendiou-se-lhe na palma, e um grito escapou-lhe antes que pudesse contê-lo.\n\nA figura avançou.\n\nToc… toc… toc…\n\nA cada passo, o ar arrefecia. A cada passo, a marca pulsava com mais força. A cada passo, Kalunga sentia o coração aproximar-se de um limite que não sabia suportar.\n\nPor fim, a criatura saiu da sombra.\n\nEra um homem.\n\nOu tinha sido.\n\nA pele tinha a cor cinzenta da cera envelhecida. Os olhos, fundos e vazios, pareciam duas cavidades escavadas no rosto. A boca permanecia entreaberta, caída, como se o corpo ainda tentasse respirar, embora tivesse esquecido a maneira de o fazer.\n\nO peito não se movia.\n\nNão havia sopro.\n\nNão havia vida.\n\nKalunga sentiu o estômago revolver-se.\n\n— Meu Deus…\n\nO homem ergueu o braço com um esforço terrível. Os dedos trémulos apontaram directamente para o jovem, e os lábios, quase imóveis, começaram a formar uma palavra.\n\n— C… e… i… f… a… d… o… r…\n\nKalunga arrastou-se para trás, tentando afastar-se sem conseguir levantar-se. A criatura deu mais um passo.\n\n— N… ã… o… t… e… m… v… i… d… a…\n\nA voz parecia vir de muito longe, como se atravessasse camadas de terra antes de alcançar os ouvidos de Kalunga.\n\nFoi então que a sombra falou:\n\n— Tira o sopro dele. Ou ele o tirará de ti.\n\nKalunga olhou para a marca.\n\nDepois, para o morto.\n\nPor fim, para a rua vazia, onde nenhuma porta se abria e nenhuma voz humana surgia para o socorrer.\n\nA morte estava diante dele.\n\nE, de algum modo impossível, estava viva.\n\nO morto deu mais um passo. O ar tornou-se pesado, quase irrespirável, como se a presença daquela criatura roubasse à rua tudo o que ainda a ligava ao mundo dos vivos.\n\n— N… ã… o… t… e… m… v… i… d… a… — repetiu o homem.\n\nKalunga tentou erguer-se, mas as pernas não lhe obedeceram. A mão bateu no chão áspero, e o coração continuou a saltar-lhe no peito como um animal encurralado.\n\n— Alguém… alguém me ajude…\n\nA súplica perdeu-se na noite.\n\nA sombra inclinou-se sobre ele, observando o morto com uma curiosidade inquietante.\n\n— Ceifador… Ele sente o teu sopro e quer roubá-lo.\n\n— Eu não quero lutar! — respondeu Kalunga, com a voz embargada. — Não quero magoar ninguém!\n\n— Se não o tirares, ele tira-to.\n\nO morto abriu a boca. Um gemido gorgolejante escapou-lhe da garganta, trazendo consigo um cheiro a carne esquecida, humidade antiga e terra revolvida. Então avançou de repente.\n\nKalunga mal teve tempo de reagir. Num instante, a criatura estava diante dele; no seguinte, uma mão gelada procurava agarrar-lhe o pescoço. O jovem ergueu a mão marcada.\n\nNão por coragem. Não por compreender o que fazia. Ergueu-a porque o medo lhe deixara apenas aquele gesto.\n\nA marca brilhou.\n\nNão era uma luz comum. A claridade que dela nasceu parecia negar a própria natureza da luz: escura, fria, incapaz de iluminar o que tocava. Um fumo negro desprendeu-se da palma, serpenteando no ar como dedos à procura de uma porta.\n\nO morto estremeceu.\n\nParecia simultaneamente atraído e repelido por aquela força. O corpo vacilou, os braços agitaram-se, e os olhos vazios fixaram-se na mão de Kalunga. A sombra aproximou-se.\n\n— Deixa sair…\n\n— Eu não sei como!\n\n— Não precisas de saber o nome do fogo para perceber que estás a arder. A marca pulsou uma vez.\n\nDepois outra.\n\nKalunga sentiu qualquer coisa abrir-se dentro de si. Não na pele, nem na carne, mas num lugar mais profundo, onde as palavras perdem o sentido e os pensamentos se tornam sensações. Era como se o olho gravado na sua mão despertasse de um sono antigo e começasse, finalmente, a ver. Um sopro gelado atravessou-lhe o braço.\n\nA névoa negra expandiu-se.\n\nEnvolveu o peito do morto, deslizou-lhe pelos braços e cobriu-lhe lentamente o rosto. A criatura tentou recuar, mas os pés já não lhe obedeciam. O seu corpo começou a desfazer-se, não como carne em decomposição nem como poeira levada pelo vento, mas como uma sombra dissolvida na água. A boca abriu-se num grito silencioso.\n\nE Kalunga ouviu-o.\n\nNão com os ouvidos, mas por dentro.\n\nAquele grito trazia dor, desespero e uma exaustão tão profunda que parecia ter atravessado séculos. Durante um breve instante, o jovem teve a impressão de ver outro rosto por detrás da pele cinzenta: o rosto de alguém que um dia fora vivo, que talvez tivesse amado, rido e regressado a casa sem imaginar que a morte não lhe concederia descanso.\n\nKalunga quis desviar os olhos.\n\nNão conseguiu.\n\nA névoa apertou-se em torno do corpo. Os contornos do morto perderam nitidez, as extremidades dissolveram-se e a figura inteira começou a desaparecer, como se uma corrente invisível a puxasse para fora daquele mundo. Então, tudo parou.\n\nO fumo recolheu-se na marca.\n\nO corpo caiu no chão.\n\nJá não se movia. Não havia nele qualquer vestígio daquela força que o fizera caminhar, falar ou perseguir os vivos. Restava apenas um cadáver, entregue finalmente à imobilidade que lhe deveria ter pertencido desde o princípio. Kalunga cambaleou para trás.\n\nAs mãos tremiam-lhe. Um formigueiro percorria-lhe os dedos, e a respiração vinha-lhe em soluços curtos, como se o corpo tentasse expulsar o que acabara de acontecer.\n\n— O que… o que eu fiz?\n\nA sombra agachou-se diante dele.\n\n— Devolveste o que não devia permanecer.\n\n— Eu matei-o… — Kalunga levou as mãos ao rosto. — Eu toquei-lhe. Aquela coisa saiu da minha mão. Eu vi o corpo a desaparecer!\n\n— Ele já estava morto. Tu apenas libertaste aquilo que permanecia preso.\n\n— Não! Não podes dizer isso como se fosse uma coisa normal! A voz de Kalunga quebrou-se. O medo começava a transformar-se em revolta, mas nem a revolta lhe devolvia o controlo. Queria gritar, correr, destruir a marca ou arrancá-la da própria pele. Qualquer coisa que o afastasse daquilo que acabara de descobrir sobre si mesmo.\n\nOlhou novamente para a mão.\n\nO símbolo estava quieto, mas parecia esconder um movimento subterrâneo, como um coração enterrado sob a terra.\n\n— Eu sou um monstro?\n\nA sombra aproximou o rosto do dele. Os olhos vermelhos ardiam com a paciência de brasas que já tinham visto muitas coisas consumirem-se.\n\n— Tu és o Ceifador.\n\n— Eu não quero ser!\n\n— Mas és.\n\nKalunga fechou os olhos. As palavras pareciam pedras colocadas sobre os seus ombros, uma a uma, até o obrigarem a curvar-se.\n\n— E agora? — perguntou num fio de voz. — O que vai acontecer comigo? A sombra virou o rosto para o cadáver.\n\n— Agora, os outros vão sentir que despertaste.\n\nKalunga ergueu a cabeça.\n\n— Outros? Quem?\n\nA criatura sorriu, mas aquele gesto não tinha alegria nem consolo. Era o sorriso de quem conhece uma porta e sabe que, uma vez aberta, já não pode fingir que nunca existiu.\n\n— Aqueles que nunca deveriam ter regressado.\n\nUm estalido atravessou o céu.\n\nSeco.\n\nDistante.\n\nComo uma rachadura a abrir-se numa parede invisível.\n\nKalunga levantou os olhos. A lua, que antes perdera o vermelho, começava a tingir-se novamente daquela cor profunda, semelhante a sangue visto através de água escura.\n\nA sombra ficou de pé.\n\n— Eles vêm.\n\nKalunga engoliu em seco.\n\nA rua parecia mais estreita, mais fria. Nenhum cão ladrava. Nenhuma voz atravessava as paredes. Sambizanga inteira parecia suspensa numa pausa que não pertencia à noite, mas a alguma coisa que se preparava para acontecer.\n\n— Fica atento — murmurou a sombra. — O ar está a mudar.\n\nKalunga olhou para o corpo no chão.\n\nAquele homem tinha existido. Tivera um nome, uma história, talvez uma família que ainda esperasse por ele. Talvez alguém, naquele mesmo bairro, tivesse deixado uma luz acesa, aguardando o regresso de uma pessoa que nunca mais voltaria.\n\nE agora o seu corpo jazia diante de Kalunga.\n\n— Eu não aguento isto… — sussurrou. — Não consigo…\n\nA sombra aproximou-se. Dessa vez, o contacto da sua mão no ombro do jovem trouxe um calor inesperado, quase humano. Era uma ironia cruel: a criatura feita de escuridão oferecia-lhe, naquele instante, a única sensação que o fazia recordar que ainda pertencia ao mundo dos vivos.\n\n— A morte não escolhe os fortes — disse a sombra. — Escolhe os necessários. Kalunga cerrou os dentes.\n\n— Eu não pedi nada disto.\n\n— Nem todos pedem. Mas todos pagam.\n\nA frase ficou suspensa entre ambos, fria como uma sentença pronunciada sobre uma sepultura.\n\nAo longe, ouviu-se outro estampido.\n\nDepois mais um.\n\nE mais dois.\n\nKalunga estremeceu.\n\n— Isso são tiros?\n\nA sombra virou lentamente o rosto na direcção do som.\n\n— Não. É uma abertura.\n\n— Abertura de quê?\n\nA criatura não respondeu.\n\nA resposta chegou com o vento.\n\nUm cheiro estranho percorreu a rua, atravessando os becos e as paredes como uma visita que não precisava de bater à porta. Não era exactamente podridão, embora lembrasse a terra revolvida. Não era fumo, embora trouxesse a secura das coisas queimadas. Era um odor mineral, frio e antigo, como se o ar tivesse vindo de uma mina esquecida, onde o tempo apodrecera sem testemunhas. Depois veio o ruído.\n\nUm arrastar baixo e irregular.\n\nAlgo raspava o asfalto, puxando o próprio peso com uma persistência quase paciente.\n\nKalunga recuou até sentir a parede de zinco ondulado contra as costas.\n\n— Vem mais algum morto?\n\nA sombra respondeu num tom grave:\n\n— O que se aproxima já não pertence inteiramente aos mortos. O som tornou-se mais próximo.\n\nPrimeiro surgiu uma mão pálida, de dedos compridos, que se abriu e fechou contra o chão. Depois apareceu a outra. Por fim, um corpo emergiu da escuridão, arrastando-se com movimentos desarticulados, como se os ossos tivessem esquecido a ordem em que deviam sustentar a carne.\n\nEra uma mulher.\n\nA pele, seca e esticada, parecia papel deixado demasiado tempo ao sol. Os lábios estavam gretados, os cabelos colavam-se-lhe à testa e os olhos, vazios de qualquer expressão humana, fixaram-se em Kalunga.\n\nEla continuou a rastejar.\n\n— Não… — murmurou ele. — Não outra vez…\n\nA mulher arranhava o asfalto com as unhas. Cada movimento parecia custar-lhe um esforço imenso, mas havia naquela aproximação uma determinação que não combinava com o estado do seu corpo.\n\nKalunga sentiu as lágrimas antes de perceber que estava a chorar.\n\n— Eu não consigo fazer aquilo outra vez!\n\nA sombra inclinou-se na sua direcção.\n\n— Terás de aprender.\n\n— Eu não quero matar ninguém!\n\n— Tu não matas. Libertarás aquilo que está preso.\n\nA mulher ergueu a cabeça.\n\nOs lábios moveram-se com dificuldade, e uma palavra saiu-lhe da garganta como se tivesse sido arrancada de um lugar cheio de terra.\n\n— K… u… f… a…\n\nKalunga ficou imóvel.\n\n— O que disse?\n\n— Kufa — repetiu a sombra.\n\n— Eu ouvi. Mas porquê?\n\n— Ela reconhece a tua presença.\n\nKalunga olhou para a mulher. A palavra continuava a ecoar-lhe na mente. Kufa.\n\nMorte.\n\nNão era apenas o nome de alguma coisa terrível. Era como se aquela criatura, incapaz de reconhecer o próprio rosto, soubesse reconhecer aquilo que despertara na mão do jovem.\n\nA mulher arrastou-se mais depressa.\n\n— Fica longe de mim! — gritou Kalunga. — Eu não quero isto! A sombra pousou-lhe a mão no ombro.\n\nE então ele sentiu.\n\nNão foi uma visão, nem um sonho. Foi uma percepção nova, semelhante a um sentido que sempre existira dentro dele, mas que só agora aprendera a usar. Kalunga sentiu a presença da mulher para lá da carne, para lá dos olhos vazios e dos movimentos desarticulados.\n\nA alma dela estava presa.\n\nPequena, exausta, comprimida contra as paredes invisíveis de um corpo que já não lhe pertencia. Havia dor, mas havia também uma súplica tão profunda que parecia ter perdido a capacidade de se transformar em palavras. Kalunga caiu de joelhos.\n\n— Ela está presa?\n\n— Entre o mundo dos vivos e o dos mortos — respondeu a sombra. — O corpo continua a mover-se, mas aquilo que o habitava já não encontra caminho para partir.\n\n— E eu posso ajudá-la?\n\n— Tu és a passagem.\n\nKalunga abanou a cabeça.\n\n— Eu não quero ser passagem nenhuma!\n\n— Mas já és.\n\nA mulher aproximou-se. Os seus olhos encontraram os dele, e, por um instante, Kalunga deixou de ver apenas a podridão e o horror. Sentiu o sofrimento de alguém que não conseguia terminar, alguém que permanecia aprisionado entre duas margens sem saber como alcançar nenhuma delas.\n\nO medo não desapareceu. Continuava a apertar-lhe o peito e a pedir-lhe que fugisse.\n\nMas, por baixo do medo, nasceu outra coisa.\n\nCompaixão.\n\n— Eu não sei como fazer isto — murmurou.\n\n— Não precisas de compreender tudo. Precisas de deixar de resistir ao que consegues sentir.\n\nKalunga respirou fundo.\n\nA marca brilhou sem que ele levantasse a mão. A névoa negra começou a formarse à sua volta, lenta e sinuosa, pulsando como um coração vivo. O vento arrefeceu, e as sombras dos muros alongaram-se pela rua. Desta vez, Kalunga não tentou fugir daquela força.\n\nEstendeu a mão.\n\nA névoa tocou a testa da mulher.\n\nEla parou.\n\nPor um breve instante, a tensão abandonou-lhe o rosto. Os lábios entreabriram-se, como se procurassem formar uma palavra esquecida. Depois, o corpo relaxou e caiu sobre o asfalto.\n\nNão houve gritos.\n\nNão houve luta.\n\nA presença que a prendia àquele corpo dissipou-se como uma brisa que leva consigo o pó de uma casa abandonada.\n\nKalunga caiu para trás, exausto, com a camisa colada ao peito e as mãos a tremer. Olhou para a mulher e esperou que o horror regressasse, que o corpo voltasse a mover-se, que a noite lhe provasse que aquela paz era apenas mais uma armadilha.\n\nNada aconteceu.\n\nA sombra observava-o em silêncio.\n\n— Começas a aceitar o que és.\n\nKalunga baixou os olhos para a mão.\n\n— Não. Eu só fiz o que precisava de fazer.\n\nA sombra recuou, dando-lhe espaço.\n\nEntão, o ar mudou.\n\nNão foi uma rajada de vento nem uma queda brusca da temperatura. Foi uma presença que se fez sentir à distância, uma atenção imensa que parecia atravessar paredes, ruas e horizontes para pousar sobre ele. Kalunga sentiu-a antes de a compreender.\n\nA marca pulsou.\n\nA sombra ergueu lentamente o rosto.\n\nPela primeira vez desde que aparecera, pareceu reconhecer algo maior do que si própria.\n\n— O Primeiro viu-te.\n\nKalunga sentiu a garganta secar.\n\n— Primeiro… quem?\n\nA sombra voltou os olhos vermelhos para ele.\n\n— Nzambi wa Kufa.\n\nO nome caiu entre ambos como uma pedra lançada num poço sem fundo.\n\n— O deus da morte?\n\n— Ele quer saber por que razão o seu sucessor despertou antes da hora. Kalunga ficou imóvel.\n\nSucessor.\n\nA palavra abriu-lhe uma ferida que nenhuma dor física poderia alcançar. Não bastava ter uma marca que respirava, nem ter libertado espíritos que não compreendia. Agora, alguém afirmava que ele ocupava um lugar numa história que começara antes do seu nascimento.\n\n— Eu não sou sucessor de ninguém — murmurou.\n\nA sombra não respondeu.\n\nA rua escureceu.\n\nO vento parou, e a lua pareceu perder o brilho por detrás de uma cortina invisível. No fundo da mente de Kalunga, uma voz começou a formar-se. Não era a voz da sombra, nem a dos mortos que acabara de libertar.\n\nEra mais grave.\n\nMais antiga.\n\nTão profunda que parecia nascer debaixo da terra e de trás do próprio tempo. A voz pronunciou o seu nome.\n\n— Kalunga…\n\nO chão tremeu.\n\nKalunga levou a mão marcada ao peito, mas o gesto não conseguiu conter a força que despertara dentro dele. A marca queimou com a violência de um sol negro, e o ar pareceu abrir-se à sua volta.\n\nA sombra recuou um passo.\n\nKalunga tentou falar, mas a voz morreu-lhe na garganta.\n\nJá não era apenas ele quem procurava respostas.\n\nAlguma coisa, do outro lado do mundo, também o procurava. E tinha acabado de o encontrar."},{"title":"CAPÍTULO 3 — A Voz Que Rasga o Véu","text":"A terra tremeu.\n\nNão foi um abalo vulgar, desses que fazem estremecer as janelas e tilintar os pratos esquecidos nas prateleiras. Foi algo mais profundo, mais antigo: um estremecimento que parecia nascer debaixo dos alicerces do mundo, como se alguma coisa, enterrada antes de a humanidade aprender a dar nome às coisas, tivesse acabado de se mexer.\n\nKalunga agarrou-se à parede do beco.\n\nA pedra estava fria. Demasiado fria para uma noite de Sambizanga. O tremor percorreu-lhe os braços, subiu-lhe pelos ombros e instalou-se-lhe nos dentes. Por um instante, sentiu que até os ossos tinham perdido a certeza de pertencerem ao seu corpo.\n\nA marca na palma pulsou.\n\nUma vez.\n\nDuas.\n\nDepois, o calor tornou-se tão intenso que Kalunga teve de cerrar os dentes para não gritar.\n\n— O que está a acontecer comigo?\n\nA sombra permanecia junto dele, alta e magra, com o cajado inclinado sobre o asfalto. Os olhos vermelhos, que antes ardiam com a tranquilidade de brasas escondidas, pareciam agora duas feridas abertas na noite. A criatura ergueu o rosto.\n\nE, pela primeira vez, Kalunga viu nela algo que não esperava encontrar. Receio.\n\nNão era muito. Apenas uma hesitação quase imperceptível, um instante em que a sombra pareceu medir a distância entre si e alguma coisa que se aproximava. Mas bastou para fazer o medo de Kalunga crescer.\n\nSe aquela criatura, que falava com os mortos e se movia contra as leis da natureza, tinha razões para temer, que esperança restava a um rapaz que ainda mal compreendia a própria mão?\n\n— Ele está a caminho — murmurou a sombra.\n\nKalunga sentiu a garganta apertar-se.\n\n— Quem?\n\nA pergunta saiu-lhe antes de conseguir travá-la. No fundo, uma parte dele já conhecia a resposta. A marca reconhecia aquela presença; o sangue parecia escutar um chamamento que a razão não conseguia compreender. A sombra voltou os olhos para ele.\n\n— O Primeiro. Aquele cujo nome não se pronuncia em vão. Aquele perante quem até os mortos aprendem o silêncio.\n\nKalunga abanou a cabeça.\n\n— Não. Não, eu não quero saber quem é. Não quero saber de deuses, de mortos, de marcas! Quero voltar para casa!\n\nA última palavra perdeu-se-lhe na garganta.\n\nCasa.\n\nAté há pouco, essa palavra significava um lugar, uma porta, um tecto sob o qual poderia fechar os olhos e esperar que o dia seguinte trouxesse problemas mais comuns. Agora, porém, a ideia de regressar parecia-lhe distante, quase absurda. Como se alguém tivesse apagado a estrada que o ligava à vida que conhecia. A sombra observou-o sem responder.\n\nE o silêncio que se seguiu foi pior do que qualquer explicação. Sambizanga deixou de respirar.\n\nAs vozes que habitualmente atravessavam a noite desapareceram. Não se ouviam televisores atrás das portas, conversas nos quintais ou motores perdidos nas avenidas. Nem sequer os cães, que costumavam anunciar a passagem de qualquer desconhecido, ousavam quebrar aquela quietude.\n\nA cidade não estava adormecida.\n\nEstava suspensa.\n\nEntão, o céu gemeu.\n\nO som começou como um rumor distante e cresceu até fazer vibrar as paredes. Não era trovão, embora viesse das alturas. Não era explosão, embora trouxesse a violência de algo a romper-se. Parecia o ranger de uma porta colossal, arrastada por mãos invisíveis através de uma dimensão que os olhos humanos nunca deveriam contemplar.\n\nKalunga caiu contra a parede.\n\n— O que é isso?!\n\nA sombra segurou-o pelos ombros e obrigou-o a manter-se de pé.\n\n— Não olhes apenas para o que ouves. Aprende a sentir aquilo que o som anuncia.\n\n— Eu não sou capaz!\n\n— Ainda não.\n\n— Deixa de dizer isso!\n\nA sombra apertou-lhe os ombros. O seu toque era estranho: não inteiramente frio, nem verdadeiramente quente. Parecia a mão de alguém que se lembrava vagamente de ter sido humano.\n\n— Não interessa o que desejas, Kalunga. Interessa aquilo que despertou em ti.\n\n— Mas eu não despertei nada! Foi aquela coisa que entrou em mim!\n\n— E, mesmo assim, continuas aqui.\n\nKalunga abriu a boca para responder, mas o céu voltou a rugir. Desta vez, ergueu os olhos.\n\nA lua estava a tremer.\n\nNão era uma ilusão provocada pelas lágrimas, nem uma distorção causada pelo ar. O próprio disco lunar parecia vacilar no firmamento, como se uma mão invisível o empurrasse de um lado para o outro. A superfície avermelhada ondulava, e a luz derramada sobre os telhados de zinco adquiriu uma tonalidade escura, quase negra nas extremidades.\n\nKalunga esqueceu-se de respirar.\n\n— Isso é impossível.\n\n— Para ti — respondeu a sombra. — Não para aquilo que se aproxima.\n\n— Quem consegue fazer uma coisa dessas?\n\nA criatura não respondeu imediatamente.\n\nOs dedos compridos apertaram o cajado. Um ruído baixo, semelhante ao roçar de unhas sobre madeira antiga, percorreu a sua superfície.\n\n— Ele está a empurrar o mundo.\n\nA frase foi tão simples que Kalunga demorou alguns segundos a compreender a sua dimensão.\n\nEmpurrar o mundo.\n\nNão uma porta, uma parede ou um corpo. O mundo.\n\nO bairro inteiro, com as suas casas humildes, as suas ruas estreitas, os seus habitantes e os seus segredos, parecia agora uma coisa frágil, suspensa diante de uma força capaz de alterar a ordem do céu.\n\nA marca ardeu novamente.\n\nMas desta vez a dor não vinha sozinha.\n\nHavia nela um chamamento.\n\nAlgo que parecia reconhecer o que se aproximava, como uma fechadura que escuta o ranger da chave certa.\n\nEntão, a voz surgiu dentro da cabeça de Kalunga.\n\nKALUNGA.\n\nO jovem levou as mãos aos ouvidos.\n\n— Sai da minha cabeça!\n\nA voz não precisava de volume. Cada sílaba pesava como pedra, e a sua presença parecia atravessar-lhe o pensamento, o sangue e a memória. Kalunga sentiu-a vibrar nos dentes, na coluna e no centro do peito.\n\nKALUNGA.\n\n— Eu não te conheço! — gritou. — Deixa-me em paz!\n\nA sombra recuou um passo.\n\nNão fugiu. Não tentou esconder-se.\n\nRecuou como alguém que abre espaço diante de uma autoridade antiga. Kalunga reparou no gesto e sentiu o estômago contrair-se.\n\n— Tu conheces essa voz.\n\nA sombra manteve-se calada.\n\n— Conheces, não conheces?\n\n— Há vozes que não precisam de apresentação.\n\nA marca abriu-se em calor.\n\nKalunga sentiu o mundo dobrar-se diante dos olhos. As paredes do beco perderam nitidez, os contornos da rua dissolveram-se e a escuridão pareceu afastar-se, revelando uma realidade escondida por detrás da realidade. Não estava a ver com os olhos.\n\nEra como se uma parte desconhecida de si tivesse aprendido, de repente, a olhar para lá das coisas.\n\nÀ sua frente abriu-se um espaço branco, vasto e sem horizonte. Não havia chão visível, mas alguma coisa sustentava aquele vazio. Sombras deslizavam à distância, sem corpos definidos, como memórias que tivessem perdido os rostos. No centro daquele lugar, uma presença movia-se.\n\nKalunga tentou distingui-la.\n\nNão conseguiu.\n\nEra grande demais para caber numa forma compreensível. Tentar observá-la era como tentar contemplar o próprio conceito de noite: quanto mais procurava encontrar os seus limites, mais os limites se afastavam. Mas sentia-a.\n\nSentia a sua antiguidade, o seu peso, a autoridade que não precisava de ser demonstrada.\n\nA voz voltou a falar.\n\nPOR QUE ESTÁS DESPERTO ANTES DA HORA?\n\nKalunga tentou responder. A língua parecia-lhe presa ao céu da boca.\n\n— Eu… eu não sei.\n\nQUEM TE ERGUEU?\n\n— Ninguém! Eu não fiz nada! Só estava a voltar para casa! A presença pareceu inclinar-se.\n\nO vazio inteiro contraiu-se.\n\nPELO MEDO.\n\nUma pausa.\n\nPELA RACHADURA.\n\nOutra pausa, tão profunda que Kalunga teve a impressão de que o próprio tempo deixara de avançar.\n\nPELA QUEBRA DO VÉU.\n\nO jovem cambaleou.\n\n— Que véu? Que rachadura? Do que estás a falar?!\n\nA visão vacilou. O espaço branco pareceu afastar-se, mas a presença continuou a pressioná-lo por dentro.\n\nA sombra tocou-lhe no ombro.\n\nO contacto trouxe-o parcialmente de volta ao beco. Kalunga viu novamente os telhados, a parede de zinco e a lua vermelha, mas a voz permanecia dentro dele, tão próxima que parecia falar-lhe directamente do coração.\n\n— O véu separa os vivos dos mortos — explicou a sombra. — Enquanto permanece intacto, cada lado guarda aquilo que lhe pertence. Os vivos respiram. Os mortos descansam. E aquilo que está entre ambos não atravessa sem pagar o preço.\n\nKalunga olhou para a marca.\n\n— E eu?\n\n— Tu consegues sentir o véu.\n\n— Só sentir?\n\nA sombra hesitou.\n\nFoi uma hesitação breve, mas Kalunga percebeu-a.\n\n— O que estás a esconder de mim?\n\n— Ainda não tens forças para compreender tudo.\n\n— Então explica-me o suficiente para eu deixar de pensar que estou a enlouquecer!\n\nA sombra baixou o cajado.\n\n— O teu nome não foi escolhido, Kalunga. Foi herdado.\n\nAquelas palavras atingiram-no de uma maneira que a voz do Primeiro não conseguira.\n\nHerdado.\n\nKalunga conhecia o peso das heranças, mesmo quando não vinham acompanhadas de ouro, terras ou nomes importantes. Havia coisas que passavam de uma geração para outra sem serem escritas em papel: a pobreza, as dívidas, os silêncios, as dores que os mais velhos escondiam para que os mais novos não precisassem de as carregar.\n\nMas aquilo era diferente.\n\nNão lhe tinham deixado uma casa, uma obrigação ou uma história de família. Tinham-lhe deixado a morte.\n\n— Quem me deixou isto?\n\nA sombra não respondeu.\n\n— Quem?! — insistiu Kalunga.\n\nA voz do Primeiro atravessou novamente o espaço entre os mundos. NÃO DEVERIAS EXISTIR AINDA.\n\nKalunga caiu de joelhos.\n\nA pressão tornou-se insuportável. O ar parecia ter adquirido o peso de uma montanha, esmagando-lhe os ombros e comprimindo-lhe o peito. Tentou inspirar, mas cada respiração chegava curta, incompleta, como se os pulmões tivessem esquecido a sua função.\n\n— Eu não pedi nada disto! — conseguiu dizer. — Eu só quero viver! Quero voltar a ser quem era!\n\nA sombra inclinou-se junto dele.\n\nDesta vez, o rosto não revelava crueldade nem satisfação. Havia nele uma gravidade que Kalunga ainda não sabia interpretar.\n\n— O rapaz que conhecias continua dentro de ti. Mas já não está sozinho. Kalunga fechou os olhos.\n\nUma lágrima escorreu-lhe pelo rosto.\n\n— Eu não quero ser o deus da morte.\n\nA resposta veio da sombra, baixa e cansada:\n\n— Ninguém quer.\n\nO Primeiro falou uma última vez.\n\nNÃO ÉS DEUS.\n\nA voz fez vibrar a marca.\n\nÉS PORTA.\n\nO chão gemeu.\n\nSELO.\n\nA lua perdeu o brilho.\n\nCHAVE.\n\nAs luzes das casas piscaram ao longe.\n\nO ÚLTIMO RESPIRO ENTRE DOIS MUNDOS.\n\nEntão, tudo escureceu.\n\nDurante um instante, Kalunga deixou de ver a rua, o céu e a própria mão. Sentiu apenas o pulsar da marca e uma presença a aproximar-se de algum lugar que não conseguia localizar.\n\nNão vinha da rua.\n\nNem do céu.\n\nVinha de uma fenda aberta naquilo que separava uma realidade da outra. Quando a visão regressou, o firmamento estava rasgado.\n\nUma abertura enorme atravessava a noite, como se unhas invisíveis tivessem arranhado o tecido do céu até o romper. Por detrás da fenda não havia estrelas, nuvens ou escuridão comum. Havia um negro diferente, profundo, que parecia absorver até a ideia de distância.\n\nA sombra recuou.\n\nO cajado inclinou-se na sua mão.\n\n— Ele está a chegar.\n\nKalunga ergueu os olhos, incapaz de se levantar.\n\n— O deus da morte?\n\nA sombra abanou lentamente a cabeça.\n\n— Não. O mensageiro dele.\n\nA fenda abriu-se mais.\n\nUma claridade negra escorreu do rasgão, uma luz ao contrário, que não iluminava a rua: roubava-lhe as cores. Os telhados perderam o brilho, as paredes tornaramse manchas indistintas e a lua pareceu afundar-se por detrás de um véu de cinzas. Então, alguém atravessou a abertura.\n\nNão caiu.\n\nDesceu.\n\nHavia uma diferença entre as duas coisas, e Kalunga percebeu-a sem saber explicar porquê. Aquela figura não parecia sujeita à gravidade, ao medo ou à pressa. Pousou no centro da rua com a serenidade de quem regressa a um lugar que sempre lhe pertenceu.\n\nEstava descalça.\n\nEra alta e magra, mas o corpo tinha uma firmeza inquietante. A pele escura lembrava carvão molhado, e os olhos não possuíam pupilas: apenas uma luz cinzenta, fria, semelhante à claridade que antecede uma tempestade. O mundo pareceu prender a respiração.\n\nA figura permaneceu imóvel durante alguns segundos, observando a rua, o cadáver abandonado e a marca na mão de Kalunga.\n\nDepois, virou-se para ele.\n\nA sombra murmurou:\n\n— Veio buscar respostas.\n\nKalunga tentou levantar-se. As pernas recusaram-se a obedecer-lhe.\n\n— O que quer de mim?\n\n— Saber se és uma ameaça — respondeu a sombra — ou uma solução. Kalunga soltou uma breve gargalhada, amarga e incrédula.\n\n— E se eu não for nenhuma dessas coisas?\n\nA sombra fitou-o.\n\n— Ele não veio perguntar. Veio decidir.\n\nO mensageiro começou a caminhar.\n\nOs passos não produziam som. Ainda assim, cada movimento fazia o ar ondular à sua volta, como se a realidade fosse água e o corpo da criatura, uma pedra atravessando-a.\n\nA lua voltou a acender-se em vermelho.\n\nUm passo.\n\nO coração de Kalunga acelerou.\n\nOutro.\n\nA marca começou a pulsar.\n\nQuando o mensageiro parou, estava a poucos metros dele.\n\nErgueu a cabeça.\n\nA voz que saiu da sua boca era baixa, quase tranquila. No entanto, cada palavra parecia deslocar alguma coisa invisível no ar.\n\n— Kalunga Mbanza.\n\nO jovem sentiu o sangue gelar.\n\nMbanza.\n\nAquele não era o nome pelo qual se conhecia. Era Kalunga Mwena. Sempre fora. A palavra estranha, pronunciada por uma criatura que acabara de descer de uma fenda no céu, atingiu-o com a força de uma acusação.\n\n— Eu… o quê?\n\nO mensageiro não desviou o olhar.\n\n— Acordaste cedo demais.\n\n— Eu não queria acordar!\n\n— A morte não desperta quem quer. Desperta quem precisa. Kalunga tentou recuar, mas o corpo continuava pesado.\n\n— Eu sou só um rapaz! Quero ir para casa!\n\nA luz cinzenta dos olhos intensificou-se.\n\n— Casa já não significa o mesmo para ti.\n\nO jovem sentiu um arrepio subir-lhe pela espinha.\n\n— O que queres de mim?\n\nO mensageiro ergueu uma das mãos.\n\nA marca respondeu imediatamente.\n\nUma dor violenta atravessou a palma de Kalunga e subiu-lhe pelo braço, como se uma lâmina invisível lhe rasgasse os ossos. Ele gritou e caiu no chão, agarrando o pulso com a mão livre.\n\n— Mostra o que és — ordenou o mensageiro. — Ou morrerás como um espírito preso: fraco, incompleto, incapaz de atravessar.\n\nKalunga tentou conter a dor.\n\n— Eu não sei o que queres!\n\nA sombra gritou:\n\n— Não resistas! Se não libertares o teu sopro, ele vai tomá-lo à força! O mensageiro avançou mais um passo.\n\nO mundo pareceu afundar.\n\nAs paredes inclinaram-se, a rua perdeu profundidade e a abertura no céu expandiu-se como uma ferida que se recusava a fechar. Kalunga sentiu a marca abrir-se dentro da própria carne, não como uma lesão, mas como uma passagem que procurava alargar-se.\n\nO mensageiro inclinou a cabeça.\n\n— Kalunga… último respiro…\n\nA voz tornou-se mais profunda.\n\n— Mostra o teu sopro.\n\nKalunga gritou.\n\nA marca explodiu numa luz negra.\n\nE a rua inteira mergulhou no vazio."},{"title":"Capítulo 4 — Onde a Morte Não","text":"FAZ SOMBRA O vazio não tinha fundo.\n\nKalunga caiu sem sentir o vento, sem ouvir o próprio grito e sem conseguir distinguir se mantinha os olhos abertos. À sua volta, a escuridão estendia-se numa imensidão sem estrelas, desprovida de chão, de céu e de qualquer sinal que permitisse separar uma coisa da outra. Não havia cima nem baixo. Apenas uma queda interminável, como se o mundo tivesse perdido a capacidade de o receber.\n\nTentou agarrar-se a alguma coisa.\n\nOs dedos fecharam-se sobre o nada.\n\nA marca na palma pulsou.\n\nUma vez.\n\nDuas.\n\nÀ terceira, uma dor aguda atravessou-lhe o braço e espalhou-se pelo peito. Kalunga sentiu que alguma coisa o puxava por dentro, como se um fio invisível estivesse preso ao centro da sua existência e alguém, muito longe, o estivesse a enrolar lentamente à volta de um dedo.\n\n— Parem! — gritou.\n\nA palavra não produziu eco.\n\nNaquele lugar, até a voz parecia morrer antes de alcançar o mundo. Então, o vazio abriu os olhos.\n\nNão eram olhos propriamente ditos. Eram dois círculos de luz pálida, suspensos na distância, que se acenderam sem aviso e se fixaram nele. Kalunga tentou desviar o rosto, mas descobriu que já não controlava o próprio corpo. Continuava a cair, embora agora tivesse a certeza de que alguma coisa o observava. Os círculos aproximaram-se.\n\nE a escuridão começou a falar.\n\n— Mostra-me o que escondes.\n\nA voz era a do mensageiro, mas parecia ter perdido a boca que a pronunciara na rua. Surgia de todos os lados, grave e serena, com a autoridade de uma sentença que já fora escrita antes de o acusado nascer.\n\nKalunga cerrou os dentes.\n\n— Não escondo nada!\n\n— Todos escondem alguma coisa.\n\n— Eu não te conheço!\n\n— Mas a tua marca conhece-me.\n\nA mão de Kalunga incendiou-se. Uma luz negra escapou-lhe entre os dedos, formando pequenos fios que se agitavam no vazio. Eram semelhantes a raízes, embora crescessem na direcção errada: em vez de procurarem a terra, procuravam alguma coisa invisível acima dele.\n\nO jovem tentou fechar a mão.\n\nOs fios resistiram.\n\n— Faz isso parar!\n\n— Não fui eu que despertei o que carregas.\n\n— Então quem foi?!\n\nA pergunta atravessou a escuridão e perdeu-se.\n\nPor um instante, Kalunga voltou a ver Sambizanga. Os telhados de zinco, as paredes gastas, as ruas que conhecia desde criança. Viu a esquina onde encontrara o primeiro morto. Viu o corpo da mulher estendido no asfalto. Viu a lua vermelha, imóvel sobre o bairro, e a sombra de cajado na mão. A visão durou pouco.\n\nUma rajada de escuridão atravessou-lhe a memória e desfez tudo. Kalunga soltou um gemido.\n\n— Quero voltar!\n\n— Para onde?\n\nA pergunta feriu-o mais do que a dor.\n\n— Para casa!\n\n— A casa é um lugar. O regresso é outra coisa.\n\n— Deixa-te de enigmas!\n\nA voz calou-se.\n\nE, pela primeira vez desde que caíra, Kalunga ouviu um som diferente: o bater de um coração.\n\nNão era o seu.\n\nTum.\n\nTum.\n\nTum.\n\nO ritmo vinha da distância, lento e irregular, como o de uma criatura gigantesca que dormisse sob montanhas. Cada batimento fazia o vazio contrair-se. A escuridão ondulava, e os círculos de luz afastavam-se como se temessem aproximar-se daquele som.\n\nKalunga sentiu a marca responder.\n\nO seu coração começou a acompanhar o ritmo desconhecido.\n\n— Não — murmurou, levando a mão ao peito. — Não, não, não… Quanto mais tentava resistir, mais os dois batimentos se aproximavam. O coração que vivia dentro dele e aquele que parecia dormir para lá do vazio começaram a bater como um só.\n\nEntão, uma imagem atravessou-lhe a mente.\n\nUma porta de pedra.\n\nAlta, negra, coberta de inscrições que pareciam mover-se quando ele tentava lêlas. No centro havia um símbolo semelhante ao da sua mão, mas incompleto, como se alguém tivesse apagado uma parte essencial do desenho. Diante da porta, uma figura permanecia ajoelhada.\n\nTinha o rosto coberto por um véu escuro e os pulsos presos por correntes. O seu corpo tremia, mas não era de frio. Parecia lutar contra uma força que a puxava para dentro da pedra.\n\nA figura ergueu a cabeça.\n\nPor detrás do véu, dois olhos reconheceram Kalunga.\n\nE a imagem desapareceu.\n\nO jovem arquejou.\n\n— Quem era aquela pessoa?\n\nNenhuma resposta.\n\n— Eu vi alguém! Quem era?!\n\nO vazio estremeceu.\n\nDesta vez, não foi o coração distante que provocou o movimento. A marca abrirase numa luz escura e os fios que lhe saíam da palma começaram a enrolar-se no braço, subindo-lhe até ao ombro. Kalunga sentiu-os apertar-lhe a pele, não como cordas, mas como dedos que procuravam segurá-lo.\n\nO mensageiro voltou a falar.\n\n— O teu sopro está a romper o limite.\n\n— Que limite?!\n\n— Aquele que te mantém inteiro.\n\nKalunga tentou respirar, mas o ar desaparecera. A garganta contraiu-se. O peito doía-lhe, e uma pressão crescente parecia querer separar-lhe o corpo daquilo que o fazia sentir-se vivo.\n\nA memória do primeiro morto regressou-lhe com uma nitidez cruel. O rosto cinzento.\n\nA boca entreaberta.\n\nA palavra que lhe saíra dos lábios: ceifador.\n\nKalunga compreendeu, então, que não estava apenas a perder o controlo da marca. Estava a perder o controlo de si próprio.\n\n— Eu não quero morrer!\n\n— Então aprende a distinguir a morte do medo.\n\n— Para ti é fácil dizer!\n\n— Não. Para mim, é tarde demais para ter medo.\n\nA frase deixou Kalunga imóvel.\n\nHavia qualquer coisa naquela resposta que não combinava com a frieza do mensageiro. Por detrás da autoridade, por detrás da voz que parecia atravessar mundos, escondia-se uma tristeza antiga, cuidadosamente enterrada. Kalunga não teve tempo de perguntar.\n\nOs fios negros apertaram-se-lhe à volta do braço. A luz da marca expandiu-se, e o coração distante bateu com uma violência que fez o vazio inteiro estremecer. Tum.\n\nO corpo de Kalunga arqueou-se.\n\nTum.\n\nOs fios partiram-se.\n\nTum.\n\nA escuridão abriu-se.\n\nPor detrás dela surgiu uma superfície semelhante a água, imóvel e negra, suspensa num espaço onde não devia existir superfície alguma. Kalunga caiu sobre ela e afundou-se até à cintura. Tentou nadar, mas a substância não era líquida. Era fria, densa e silenciosa, como uma noite transformada em matéria. A marca brilhou.\n\nDesta vez, o jovem não tentou apagá-la.\n\nNão porque tivesse deixado de ter medo, mas porque finalmente compreendeu que lutar às cegas apenas o tornava mais vulnerável.\n\nOlhou para a mão.\n\n— Eu não sei quem sou — confessou. — Mas não vou deixar que decidas por mim. A escuridão ondulou.\n\nOs fios negros recolheram-se lentamente para a palma, e o peso que lhe esmagava o peito diminuiu. Kalunga conseguiu inspirar. Uma vez. Depois outra. O coração distante voltou a bater.\n\nMas agora o som parecia vir de muito longe.\n\nO mensageiro surgiu diante dele, de pé sobre a superfície negra.\n\n— Ainda não compreendes o que acabaste de fazer.\n\nKalunga ergueu o rosto, exausto.\n\n— Então explica-me.\n\n— Resististe ao chamamento sem o rejeitares. É diferente de lutar contra a marca.\n\n— E isso significa o quê?\n\nO mensageiro observou-o durante alguns segundos.\n\n— Significa que ainda és capaz de escolher.\n\nAquelas palavras trouxeram-lhe um alívio tão inesperado que Kalunga quase se deixou acreditar nelas. Mas o mensageiro continuou:\n\n— Não confundas escolha com liberdade. Uma porta pode decidir quando se abre, mas não escolhe quem a atravessa.\n\nA superfície negra começou a rachar.\n\nFendas finas espalharam-se debaixo dos pés de Kalunga. Por entre elas, uma claridade avermelhada insinuou-se, iluminando a escuridão com a cor da lua que deixara para trás.\n\n— O que está a acontecer agora? — perguntou.\n\nO mensageiro virou-se para as fendas.\n\n— O lugar está a rejeitar-te.\n\n— Porquê?\n\n— Porque ainda pertences ao mundo dos vivos.\n\nKalunga soltou uma gargalhada sem alegria.\n\n— Finalmente, alguém diz alguma coisa que faz sentido!\n\nO mensageiro não sorriu.\n\nA superfície partiu-se.\n\nKalunga caiu outra vez, mas desta vez a queda foi curta. O vazio desapareceu, o ar regressou-lhe aos pulmões e o mundo voltou a ter peso.\n\nO impacto contra o asfalto arrancou-lhe um gemido.\n\nDurante alguns segundos, permaneceu deitado, sem forças para abrir os olhos. Sentia o cheiro da rua, a aspereza do chão e o frio da noite contra o rosto. Eram sensações comuns, quase banais, mas nunca lhe parecera tão precioso sentir-se preso a elas.\n\nQuando finalmente abriu os olhos, viu os telhados de Sambizanga. A lua continuava vermelha.\n\nA sombra permanecia junto dele, apoiada no cajado.\n\nE o mensageiro estava de pé, a poucos passos, como se nunca tivesse desaparecido.\n\nKalunga tentou sentar-se.\n\n— Onde é que me levaste?\n\n— A um lugar onde a tua marca pudesse ser observada sem destruir tudo à tua volta.\n\n— E quase me destruía a mim!\n\n— Quase não é o mesmo que aconteceu.\n\nKalunga encarou-o com raiva.\n\n— Um dia vou encontrar alguém que te ensine a falar como uma pessoa normal. O mensageiro inclinou ligeiramente a cabeça.\n\n— Espero que esse dia chegue.\n\nA resposta apanhou Kalunga desprevenido.\n\nAntes que pudesse perguntar o que significava, a figura voltou os olhos para o céu. A fenda desaparecera, mas a lua permanecia envolta numa auréola escura.\n\n— O Primeiro ouviu-te — disse o mensageiro. — E agora sabe que a tua vontade não está completamente quebrada.\n\nKalunga olhou para a mão.\n\nA marca estava quieta.\n\nPela primeira vez desde o início daquela noite, não sentiu dor. Sentiu apenas um calor discreto, quase humano.\n\n— Então acabou?\n\nO mensageiro olhou para ele.\n\n— Não, Kalunga. Agora é que começou."},{"title":"Capítulo 5 — o Preço de um Nome","text":"A primeira coisa que Kalunga fez foi tentar levantar-se. A segunda foi cair novamente.\n\nAs pernas tremiam-lhe tanto que mal conseguiam suportar o peso do corpo. O asfalto parecia inclinar-se sob os seus pés, e a rua inteira oscilava diante dos olhos, como se o mundo ainda não tivesse decidido se o aceitava de volta. A sombra segurou-o pelo braço.\n\n— Devagar.\n\nKalunga afastou-lhe a mão.\n\n— Não me toques.\n\nA criatura obedeceu.\n\nO gesto, simples e inesperado, deixou Kalunga sem saber o que dizer. Até então, a sombra parecia agir como se o jovem fosse uma propriedade sua, uma peça que devia ser conduzida até ao lugar certo. Agora, pela primeira vez, respeitara uma ordem.\n\nTalvez também tivesse aprendido alguma coisa.\n\nOu talvez estivesse apenas à espera de que ele recuperasse forças suficientes para continuar a ser usado.\n\nKalunga apoiou-se na parede e respirou fundo. A garganta ardia-lhe. Tinha a sensação de que passara horas a gritar, embora não soubesse quanto tempo estivera ausente daquele mundo.\n\nOlhou em redor.\n\nO cadáver do primeiro homem continuava no chão. A mulher permanecia mais adiante, imóvel, libertada da agonia que a prendera ao corpo. A rua não apresentava sinais de destruição, mas alguma coisa nela parecia diferente. As sombras dos muros estavam mais escuras. As luzes dos postes tremiam sem motivo aparente. Até o silêncio parecia ter adquirido uma espécie de vigilância.\n\n— Quanto tempo estive fora? — perguntou.\n\nA sombra fitou o céu.\n\n— O tempo suficiente.\n\n— Isso não é uma resposta.\n\n— É a única que posso dar-te.\n\nKalunga soltou o ar pelo nariz.\n\n— Vocês têm todos o mesmo problema? É uma regra dos mortos responder sempre como se estivessem a esconder um segredo?\n\nA sombra inclinou a cabeça.\n\n— Não conheço todos os mortos.\n\n— Mas conheces respostas irritantes.\n\nDesta vez, a criatura pareceu quase sorrir.\n\nQuase.\n\nKalunga não gostou de perceber que aquela expressão o tranquilizava. A sombra continuava a ser uma presença impossível, uma criatura que falava com os mortos e aparecia onde a luz deixava de chegar. Não havia motivo para confiar nela.\n\nMesmo assim, naquele instante, era a única coisa que não lhe parecia completamente desconhecida.\n\nO mensageiro aproximou-se.\n\nKalunga endireitou-se de imediato, embora as pernas quase voltassem a ceder.\n\n— Mantém-te aí.\n\nA figura parou.\n\n— Não vim ferir-te.\n\n— Já ouvi essa história vezes suficientes para uma noite.\n\n— Não te pedi que confiasses em mim.\n\n— Óptimo. Porque não confio.\n\nO mensageiro baixou os olhos para a mão marcada.\n\n— Mostra-ma.\n\nKalunga fechou o punho.\n\n— Não.\n\n— Preciso de observar a marca.\n\n— E eu preciso de saber por que razão me chamaste Mbanza. A rua pareceu arrefecer.\n\nA sombra virou-se lentamente para o mensageiro. Pela primeira vez, os dois trocaram um olhar que Kalunga não conseguiu interpretar. Não havia surpresa nele. Havia reconhecimento, cautela e algo semelhante ao receio de que uma porta, fechada durante muito tempo, tivesse acabado de se abrir. O mensageiro respondeu:\n\n— Porque foi esse o nome que encontrei.\n\n— Encontraste onde?\n\n— No registo do despertar.\n\nKalunga franziu o sobrolho.\n\n— Que registo?\n\n— A memória daqueles que guardam a passagem.\n\n— E por que razão aparece lá um nome que não é o meu?\n\nO mensageiro permaneceu em silêncio.\n\nKalunga sentiu a irritação crescer.\n\n— Eu chamo-me Kalunga Mwena. É o nome que conheço desde que aprendi a falar. Não me interessa o que encontraste num registo qualquer. Se queres que te responda, começa por dizer-me a verdade.\n\nA sombra apertou o cajado.\n\nO mensageiro não se moveu.\n\nPor fim, disse:\n\n— Talvez o nome que conheces não seja o primeiro que recebeste. Kalunga ficou imóvel.\n\nA frase abriu um espaço dentro dele onde, até então, só existira a certeza de quem era. O seu nome não era apenas uma palavra. Era a maneira como a mãe o chamava, a voz que o procurava quando chegava tarde, o som que o identificava entre os amigos e os desconhecidos. Era a palavra escrita nos documentos, pronunciada nas escolas e repetida sempre que alguém precisava de o distinguir dos outros.\n\nRetirar-lhe o nome era tentar retirar-lhe a vida.\n\n— Estás a dizer que alguém me mentiu?\n\n— Estou a dizer que não conheces toda a tua história.\n\n— Isso é a mesma coisa!\n\n— Não. Uma mentira é aquilo que alguém te conta para esconder a verdade. O silêncio também pode esconder a verdade, mas nem sempre nasce da vontade de enganar.\n\nKalunga desviou o rosto.\n\nPensou nas conversas que os adultos interrompiam quando ele entrava numa sala. Nos assuntos que pareciam mudar de direcção sempre que perguntava sobre o passado da família. Nas histórias incompletas que ouvira durante a infância, contadas com palavras cuidadosas, como se até a memória pudesse ferir.\n\nNunca lhes dera grande importância.\n\nNa altura, julgara que eram segredos banais, assuntos de adultos, pequenas vergonhas ou tristezas que não lhe diziam respeito.\n\nAgora, cada lembrança parecia conter uma porta.\n\nE, por detrás de cada porta, alguém podia estar à sua espera.\n\n— Quero saber tudo — disse.\n\nO mensageiro abanou a cabeça.\n\n— Não estás preparado.\n\n— Já estou farto de ouvir isso!\n\nKalunga aproximou-se, esquecendo por instantes o cansaço.\n\n— Primeiro, dizes-me que sou uma porta. Depois, levas-me para um lugar onde quase deixo de existir. Agora, apareces com um nome que não é meu e esperas que eu aceite tudo sem fazer perguntas. Não sou um objecto que podes transportar de um lado para o outro!\n\nA marca aqueceu-lhe a palma.\n\nO mensageiro olhou para a mão, mas Kalunga não recuou.\n\n— Sou uma pessoa — continuou o jovem. — Tenho uma vida. Tenho pessoas que me conhecem. E, se alguém decidiu esconder-me alguma coisa, quero saber porquê.\n\nO silêncio que se seguiu não foi vazio.\n\nFoi pesado.\n\nO mensageiro observou-o com uma atenção diferente, como se estivesse a comparar o rapaz que tinha diante de si com alguma lembrança guardada havia muito tempo.\n\n— Há muitos anos — começou —, alguém tentou impedir que uma passagem fosse aberta.\n\nKalunga não interrompeu.\n\n— Para o conseguir, foi necessário esconder aquilo que a passagem procurava. O nome, a marca e o sangue foram separados. Cada parte seguiu um caminho diferente, e o mundo continuou a acreditar que o perigo tinha desaparecido.\n\n— E não desapareceu?\n\n— Não.\n\nO mensageiro levantou os olhos para a lua.\n\n— Apenas aprendeu a esperar.\n\nKalunga sentiu um frio subtil atravessar-lhe a nuca.\n\n— E eu tenho alguma coisa a ver com isso?\n\nA figura não respondeu imediatamente.\n\nDepois, apontou para a marca.\n\n— O teu corpo carrega uma parte daquilo que foi escondido. A tua mão não é apenas o sinal de um poder. É a prova de que a separação está a falhar. Kalunga olhou para a palma.\n\nO símbolo parecia mais nítido do que antes. As linhas escuras desenhavam um círculo incompleto, atravessado por um traço que terminava numa ponta fina. No centro, o pequeno olho permanecia fechado.\n\n— Então tira-me isto.\n\n— Não posso.\n\n— Não queres?\n\n— Não posso.\n\nKalunga sentiu a raiva regressar.\n\n— Há diferença?\n\n— Uma vontade pode ser contrariada. Uma impossibilidade não desaparece porque alguém grita.\n\nA resposta fê-lo cerrar os punhos.\n\nO mensageiro continuou:\n\n— Se a marca fosse apenas uma maldição, bastaria quebrá-la. Mas ela está ligada à tua existência. Arrancá-la seria como tentar separar o coração do sangue e esperar que ambos continuassem a funcionar.\n\nKalunga ficou calado.\n\nNão queria acreditar.\n\nMas começava a perceber que a sua vida não voltaria a ser a mesma só porque desejava muito que assim fosse.\n\n— E o que esperam que eu faça?\n\n— Aprender.\n\n— Aprender o quê?\n\n— A distinguir os que precisam de ser libertados dos que querem atravessar para destruir.\n\nKalunga olhou para os dois corpos no chão.\n\n— E como vou saber a diferença?\n\nO mensageiro aproximou-se apenas o suficiente para que a luz cinzenta dos seus olhos se reflectisse na marca.\n\n— A morte deixa sinais. O sofrimento também. Mas nem tudo o que sofre é inocente, e nem tudo o que parece monstruoso perdeu aquilo que o torna humano.\n\nKalunga recordou a mulher a rastejar sobre o asfalto. Recordou a maneira como sentira a alma dela presa, sufocada por um corpo que já não lhe pertencia.\n\n— Então tenho de sentir as almas?\n\n— Primeiro, tens de aprender a escutar-te a ti próprio.\n\nA sombra interveio:\n\n— A marca reage ao que encontras. Se deixares que o medo decida por ti, acabarás por confundir a tua vontade com a vontade daquilo que está preso. Kalunga voltou-se para ela.\n\n— E tu? Vais ensinar-me?\n\nA sombra ficou imóvel.\n\n— Posso mostrar-te o caminho.\n\n— Não foi isso que perguntei.\n\nA criatura baixou os olhos.\n\n— Não posso prometer que chegarei contigo ao fim.\n\nA resposta trouxe consigo uma tristeza que Kalunga não conseguiu ignorar.\n\n— Porquê?\n\nO mensageiro interrompeu-os.\n\n— Porque a sombra também tem um nome.\n\nA criatura ergueu o cajado de imediato.\n\n— Não.\n\nA palavra saiu-lhe com uma violência inesperada.\n\nKalunga olhou de um para o outro.\n\n— O que se passa?\n\n— Há nomes que devem permanecer fechados — respondeu a sombra. O mensageiro manteve a voz serena.\n\n— E há portas que se tornam mais perigosas quando ninguém se lembra de quem as fechou.\n\nKalunga sentiu a marca pulsar.\n\nDesta vez, não doeu.\n\nFoi uma batida discreta, como a resposta de alguém que escutava uma conversa atr
