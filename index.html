rdo. Não podemos restaurar algo que desconhecemos.\n\n— Então escolham não o fazer.\n\n— E deixá-lo aqui?\n\n— Essa também é uma escolha.\n\nA figura sem rosto começou a tremer.\n\n— Por favor.\n\nA palavra atravessou a sala.\n\nKalunga olhou para Nzambi. O jovem estava pálido, mas os olhos permaneciam fixos na figura. A Criação dentro dele parecia exigir uma resposta imediata, uma tentativa, qualquer coisa que impedisse aquela voz de desaparecer. Kalunga compreendia o impulso.\n\nTambém o sentia.\n\nMas havia uma diferença entre desejar salvar alguém e saber o que significava salvá-lo.\n\n— Se tentarmos devolver-lhe o nome, o que pode acontecer? — perguntou. O mensageiro respondeu sem hesitar:\n\n— Pode recuperar aquilo que perdeu. Pode receber um nome que não lhe pertence. Ou pode abrir uma passagem para algo que espera por uma identidade. Nzambi virou-se para ele.\n\n— Estás a dizer que pode ser perigoso.\n\n— Estou a dizer que não sabes.\n\nKalunga aproximou-se da balança.\n\nA pedra branca parecia pequena e insignificante. No entanto, ao olhar para ela, sentiu uma pressão semelhante à que experimentara diante da porta de pedra. Estendeu a mão.\n\nA marca aqueceu.\n\nNo instante em que os dedos tocaram a superfície, uma imagem atravessou-lhe a mente.\n\nViu a figura sem rosto quando ainda era humana. Viu-a numa rua antiga, a correr sob a chuva, com uma criança ao colo. Viu uma casa a arder. Viu mãos a tentar salvar quem estava preso. Viu o homem regressar ao fogo para buscar alguém que não conseguira alcançar.\n\nDepois, viu-o morrer.\n\nNão havia maldade naquela morte. Havia apenas uma escolha desesperada, feita num instante em que qualquer decisão teria um preço.\n\nKalunga retirou a mão.\n\n— Ele tentou salvar alguém.\n\nO mensageiro não confirmou nem negou.\n\n— E isso justifica o que aconteceu? — perguntou Nzambi.\n\nKalunga abanou a cabeça.\n\n— Não sei.\n\nA figura sem rosto ergueu os braços.\n\n— Eu só queria que alguém se lembrasse.\n\nA frase desfez alguma coisa dentro de Kalunga.\n\nEle pensou na sua família, nas pessoas que o conheciam antes da marca, no pai de quem só lhe restavam fragmentos. Pensou no medo de se transformar numa coisa que os outros temessem e no terror de, um dia, já ninguém se lembrar de quem fora.\n\nAproximou-se da figura.\n\n— Não te posso devolver o nome — disse. — Não sei qual é. A criatura baixou a cabeça.\n\n— Mas posso ouvir a tua história.\n\nO mensageiro ergueu o rosto.\n\nNzambi olhou para Kalunga.\n\nO jovem continuou:\n\n— Não sei se isso chega. Não sei se te permite avançar. Mas não vou fingir que te conheço para te dar uma resposta que não tenho.\n\nA figura permaneceu imóvel.\n\nDepois, lentamente, uma pequena linha surgiu onde deveria estar a boca. Não era um sorriso. Era o começo de uma expressão humana. O chão iluminou-se.\n\nOs nomes nas paredes pararam de se mover. A pedra branca elevou-se da balança e dividiu-se em duas partes, uma negra e outra dourada. As duas metades flutuaram diante de Kalunga e Nzambi.\n\nO mensageiro recuou.\n\nPela primeira vez, pareceu surpreendido.\n\n— O julgamento não vos pediu isso.\n\nKalunga olhou para a figura.\n\n— Talvez o julgamento esteja errado.\n\nA sala tremeu.\n\nUm som profundo percorreu o edifício, semelhante ao de uma porta gigantesca a abrir-se sob a terra. Os nomes começaram a desaparecer das paredes, não como se estivessem a ser apagados, mas como se tivessem encontrado um caminho para outro lugar.\n\nA figura sem rosto levantou-se.\n\n— Eu lembro-me — murmurou.\n\nUma luz branca envolveu-a.\n\nPor um breve instante, Kalunga ouviu um nome. Não conseguiu compreendê-lo, mas sentiu que a figura o reconhecera. Depois, a luz desapareceu. A balança ficou vazia.\n\nO mensageiro olhou para os dois jovens.\n\n— O Primeiro não esperava esta resposta.\n\n— Então talvez devesse fazer perguntas melhores — respondeu Kalunga. Nzambi soltou uma pequena gargalhada nervosa.\n\nO mensageiro não reagiu.\n\n— O julgamento terminou.\n\n— E o que provámos? — perguntou Nzambi.\n\n— Que nenhum dos dois é aquilo que pensa ser.\n\nO mensageiro abriu uma passagem no ar.\n\nAntes de atravessá-la, virou-se para Kalunga.\n\n— Não confundas misericórdia com inocência. Um dia, a tua decisão não será sobre alguém que desconheces. Será sobre alguém cujo nome saberás pronunciar mesmo de olhos fechados.\n\nKalunga sentiu um frio profundo.\n\n— O que queres dizer?\n\nMas o mensageiro já tinha desaparecido.\n\nA passagem fechou-se.\n\nNzambi ficou ao lado de Kalunga, olhando para o lugar onde a figura sem rosto estivera.\n\n— Achas que fizemos bem?\n\nKalunga demorou a responder.\n\n— Acho que tentámos fazer o que nos pareceu certo.\n\n— Não é a mesma coisa.\n\n— Eu sei.\n\nOs dois permaneceram em silêncio.\n\nE, pela primeira vez, nenhum deles tentou transformar a incerteza numa resposta.\n\nQuando regressou a Sambizanga, Kalunga encontrou uma pequena folha verde sobre a mesa da cozinha.\n\nNão estava ligada a qualquer planta.\n\nEra uma folha isolada, com as extremidades queimadas e uma linha negra a atravessar o centro.\n\nNo verso, alguém escrevera uma frase.\n\nNem todos os que são esquecidos morreram. Alguns foram escondidos. Kalunga dobrou a folha e guardou-a.\n\nNaquela noite, sonhou com a figura sem rosto.\n\nDesta vez, ela tinha olhos.\n\nE, quando falou, usou a voz do pai de Kalunga.\n\n— Não confies no nome que te deram."},{"title":"CAPÍTULO 14 — O Pai das Duas Marcas","text":"A manhã trouxe consigo uma chuva fina, dessas que não parecem cair do céu, mas permanecer suspensas no ar até que alguém se lembre de que a terra também tem sede.\n\nKalunga passou boa parte do dia a tentar esquecer o sonho. Não conseguiu.\n\nA voz do pai regressava sempre que fechava os olhos. Não a voz que guardava nas poucas lembranças da infância, mas uma voz que parecia ter sido retirada de um lugar mais profundo, onde as memórias não envelheciam da mesma forma. Não confies no nome que te deram.\n\nO aviso podia significar muitas coisas. Talvez o pai se referisse a Mbanza. Talvez falasse de Mwena. Talvez nem sequer se referisse ao nome, mas à identidade que outras pessoas tinham construído para ele.\n\nO problema era que, quanto mais possibilidades considerava, menos sabia em que acreditar.\n\nAo fim da tarde, decidiu voltar à casa onde encontrara o visitante. Precisava de respostas que não viessem de sombras, mensageiros ou vozes dentro dos sonhos. Encontrou a pessoa que o criara sentada junto à janela, a remendar uma peça de roupa. Quando Kalunga entrou, ela pousou a agulha e observou-lhe o rosto.\n\n— Não dormiste.\n\n— Não.\n\n— Voltaste a sonhar com ele?\n\nKalunga parou.\n\n— Como sabes?\n\nA pessoa voltou a pegar na roupa, mas não retomou o trabalho.\n\n— Porque também sonho.\n\nA resposta apanhou-o desprevenido.\n\n— Com o meu pai?\n\n— Às vezes.\n\nKalunga sentou-se diante dela.\n\n— Porque nunca me contaste?\n\n— Porque as minhas lembranças não são provas. E porque, durante muito tempo, tive medo de que as palavras tornassem tudo real outra vez.\n\n— O que aconteceu com ele?\n\nA pessoa olhou para a chuva.\n\n— O teu pai não desapareceu de um dia para o outro. Primeiro, começou a esquecer coisas pequenas. O caminho para casa. O lugar onde guardava as ferramentas. A data do próprio aniversário. Depois, começou a reconhecer pessoas que nunca tinha visto e a chamar pelos nomes de pessoas que já tinham morrido.\n\nKalunga ouviu sem interromper.\n\n— No início, pensei que fosse cansaço. Depois, percebi que ele estava a perder memórias que não eram dele. Acordava a chorar por crianças que nunca tivera. Sentia saudades de lugares onde nunca estivera. Às vezes, falava de uma porta de pedra. Outras vezes, dizia que alguém o chamava do outro lado.\n\n— O Primeiro?\n\nA pessoa abanou a cabeça.\n\n— Nunca usou esse nome. Falava de uma presença que estava antes das coisas e de outra que ficaria depois delas. Dizia que ambas tinham o direito de existir, mas que nenhuma devia decidir sozinha o destino do mundo.\n\nKalunga sentiu o peito apertar-se.\n\n— E a marca?\n\nA pessoa pousou a roupa.\n\n— A marca apareceu-lhe na mão durante uma noite de febre. Era igual à tua, mas tinha uma linha dourada no centro. No dia seguinte, estava quase desaparecida. Ele pensou que tivesse sido um sonho, até perceber que certas portas se abriam quando ele passava e que os animais se afastavam dele sem razão aparente.\n\n— Ele contou-te tudo isso?\n\n— Não de uma vez. O teu pai tinha medo de me envolver. Acreditava que, se guardasse o segredo sozinho, conseguiria impedir que chegasse até nós. Kalunga baixou a cabeça.\n\n— Não conseguiu.\n\n— Não.\n\nA resposta foi simples, sem consolo nem tentativa de suavizar a realidade. Kalunga sentiu uma tristeza antiga, como se estivesse a lamentar não apenas a ausência do pai, mas também todas as conversas que nunca tivera com ele.\n\n— O que aconteceu na noite em que desapareceu?\n\nA pessoa ficou muito quieta.\n\nA chuva continuava a bater no telhado, e o som parecia preencher os espaços entre as palavras que ainda não tinham sido ditas.\n\n— Ele saiu para encontrar alguém.\n\n— Quem?\n\n— Não sei. Disse apenas que precisava de falar com um homem que conhecia o nome Mbanza antes de ele se tornar uma maldição.\n\nKalunga ergueu a cabeça.\n\n— E voltou?\n\n— Voltou ao amanhecer.\n\nA esperança surgiu-lhe no peito, inesperada e dolorosa.\n\n— Então está vivo?\n\nA pessoa fechou os olhos.\n\n— Não sei.\n\nKalunga sentiu a esperança desfazer-se lentamente.\n\n— Como assim?\n\n— O homem que regressou tinha o rosto do teu pai. A voz do teu pai. As mãos do teu pai. Mas havia coisas que não reconhecia. Não sabia onde guardávamos os pratos. Não se lembrava de uma canção que costumava cantar para ti. E, quando olhou para a tua mãe, perguntou-lhe quem era.\n\nKalunga ficou sem ar.\n\n— Isso não significa que não fosse ele.\n\n— Eu sei.\n\n— Podia estar doente.\n\n— Eu sei.\n\n— Podia ter perdido a memória.\n\nA pessoa olhou para ele, e havia lágrimas nos seus olhos.\n\n— Eu sei, Kalunga.\n\nA voz quebrou-se.\n\n— Foi isso que repeti a mim mesma durante meses. Durante anos. Até perceber que a verdade não precisava de ser cruel para continuar a ser verdade. O homem que regressou amava-te, mas não conseguia lembrar-se de ti. E o homem que eu conhecia parecia ter ficado preso em algum lugar de onde ninguém conseguia trazê-lo de volta.\n\nKalunga levantou-se e começou a andar pela divisão.\n\n— O que aconteceu a esse homem?\n\n— Uma noite, desapareceu novamente.\n\n— E ninguém o procurou?\n\n— Procurámos. Durante muito tempo.\n\n— Então desistiram?\n\nA pessoa levantou-se também.\n\n— Nunca desistimos. Mas houve uma altura em que percebi que procurar o teu pai em todos os rostos que passavam na rua estava a impedir-me de cuidar do filho que ainda tinha em casa.\n\nKalunga parou.\n\nA frase não era uma acusação. Era uma confissão, carregada de uma dor que não lhe pertencia inteiramente, mas que fazia parte da história da sua família. Sentou-se novamente.\n\n— Achas que ele está preso atrás da porta?\n\nA pessoa olhou para a marca na mão dele.\n\n— Acho que, quando o teu pai desapareceu, deixou alguma coisa dentro desta família. Talvez tenha sido a marca. Talvez tenha sido o medo. Talvez tenha sido apenas uma pergunta que ninguém teve coragem de fazer.\n\nKalunga respirou fundo.\n\n— Preciso de encontrar o homem que apareceu em minha casa.\n\n— O visitante?\n\n— Sim. Ele sabe mais do que diz.\n\nA pessoa aproximou-se de um pequeno armário de madeira e retirou uma caixa antiga. A superfície estava coberta de pó, e uma das dobradiças tinha sido reparada com um pedaço de arame.\n\nAbriu-a.\n\nLá dentro havia fotografias, documentos dobrados e um caderno de capa escura. Kalunga reconheceu imediatamente a letra da primeira página. Era a letra do pai.\n\nPegou no caderno com cuidado.\n\nA primeira entrada tinha uma data de muitos anos antes do seu nascimento. Hoje vi a porta pela primeira vez. Não estava aberta, mas ouvi alguém do outro lado. Chamou-me pelo nome que eu ainda não conhecia.\n\nKalunga virou a página.\n\nDisseram-me que a Morte não é o fim, mas o limite que impede a Criação de se transformar numa prisão. Não compreendi. Se a vida é um dom, porque precisa de um limite? Se o fim é necessário, porque nos dói tanto aceitá-lo? Outra página.\n\nO homem que se chama Nzambi diz que tudo aquilo que nasce deseja continuar. O homem que não revela o seu nome diz que tudo aquilo que continua precisa de saber quando partir. Ambos falam como se tivessem razão. Ambos têm medo de admitir que podem estar errados.\n\nKalunga sentiu a marca pulsar.\n\nVirou mais uma página.\n\nHoje descobri que a minha marca não é uma chave. É uma pergunta. A porta não se abre porque eu tenho poder. Abre-se quando deixo de saber quem sou. A última entrada estava escrita com uma letra apressada. Se o meu filho herdar isto, que não lhe ensinem a obedecer. Que lhe ensinem a pensar. O poder encontrará sempre uma maneira de lhe dar ordens. A consciência terá de aprender a dizer não.\n\nA página seguinte estava rasgada.\n\nKalunga passou o dedo pela borda irregular.\n\n— Falta alguma coisa.\n\nA pessoa aproximou-se.\n\n— Foi assim que encontrei o caderno.\n\nKalunga fechou-o devagar.\n\nDurante muito tempo, permaneceu sentado, segurando as palavras do pai como se fossem a única parte dele que ainda podia tocar.\n\nDepois, reparou numa coisa.\n\nNo canto inferior da última página, quase escondido pela dobra, havia um pequeno símbolo: um círculo incompleto atravessado por três linhas. Por baixo, uma palavra.\n\nORIGEM.\n\nKalunga levantou os olhos.\n\n— Já vi isto.\n\n— Onde?\n\n— Num lugar onde os nomes são julgados. Numa semente. Numa porta que não devia existir.\n\nA pessoa empalideceu.\n\n— Então começou.\n\nKalunga fechou o caderno.\n\n— O quê?\n\nA resposta veio num sussurro:\n\n— A segunda busca.\n\nNessa mesma noite, o visitante apareceu novamente.\n\nDesta vez, não entrou. Esperou do lado de fora, sob a chuva, até Kalunga sair para o encontrar.\n\nO jovem trazia o caderno do pai debaixo do braço.\n\n— Quero respostas.\n\nO homem olhou para o objecto.\n\n— Encontraste os registos.\n\n— Encontrei um caderno. E encontrei mais perguntas.\n\n— Isso era inevitável.\n\nKalunga aproximou-se.\n\n— O meu pai regressou depois de desaparecer. Mas não era o mesmo homem. O que lhe aconteceu?\n\nO visitante ficou em silêncio.\n\n— Conheces o que existe atrás da porta — continuou Kalunga. — Sabes o que significa Mbanza. E tens a mesma marca que ele tinha. Não me digas que não sabes.\n\nO homem baixou a cabeça.\n\n— O teu pai tentou fazer algo que nenhum portador da marca devia tentar.\n\n— O quê?\n\n— Quis recuperar uma memória sem aceitar aquilo que a memória lhe custava. Kalunga apertou o caderno.\n\n— Que memória?\n\nO visitante olhou para ele.\n\n— A primeira.\n\n— A primeira o quê?\n\n— A primeira escolha que separou a Criação da Morte.\n\nO vento soprou entre os dois.\n\nKalunga sentiu que estava prestes a receber uma resposta importante. Pela primeira vez, o homem parecia disposto a falar sem se esconder atrás de frases incompletas.\n\nMas, antes que pudesse continuar, o caderno abriu-se sozinho. As páginas começaram a virar-se, uma após outra, até pararem numa folha que não estava lá antes.\n\nNela, havia uma frase escrita com a letra do pai.\n\nNão procures a origem da Morte. Procura aquilo que a Morte foi criada para proteger.\n\nKalunga levantou o rosto.\n\nO visitante empalideceu.\n\n— Isso não devia estar escrito.\n\n— Porquê?\n\nO homem recuou um passo.\n\n— Porque essa frase foi escrita depois de o teu pai desaparecer. Kalunga olhou novamente para a página.\n\nA tinta ainda estava húmida.\n\nE, por baixo das palavras, uma segunda frase começou a surgir. O teu pai ainda se lembra de ti."},{"title":"CAPÍTULO 15 — Aquilo Que a Criação","text":"Não Pode Salvar Nzambi começou a ter medo de dormir.\n\nNão porque sonhasse com monstros, nem porque temesse acordar num lugar desconhecido. O que o assustava era a possibilidade de abrir os olhos e descobrir que, durante a noite, alguma coisa tinha crescido sem a sua vontade. Uma árvore no meio do quarto.\n\nRaízes debaixo da cama.\n\nFlores a nascer nas paredes.\n\nOu, pior, uma vida que regressasse sem ter sido chamada. Desde o encontro com a semente, a Criação dentro dele tornara-se mais difícil de ignorar. Não era uma voz, nem uma presença com rosto. Era uma pressão constante, uma vontade de preencher todos os espaços vazios, de reparar tudo aquilo que estivesse quebrado, de impedir que qualquer coisa chegasse ao fim. No início, julgara que essa vontade era bondade.\n\nAgora começava a compreender que até a bondade podia tornar-se perigosa quando deixava de reconhecer limites.\n\nNaquela manhã, encontrou uma pequena planta a crescer dentro de uma chávena partida.\n\nNão se lembrava de a ter colocado ali.\n\nArrancou-a com cuidado, mas, assim que a raiz se soltou da porcelana, a planta murchou entre os seus dedos.\n\nNzambi ficou a olhar para o caule seco.\n\n— Desculpa — murmurou.\n\nNão sabia a quem se dirigia.\n\nTalvez à planta.\n\nTalvez à força que o habitava.\n\nTalvez a todas as coisas que começava a perceber que não podia salvar.\n\nFoi chamado a uma casa modesta, numa rua onde as paredes guardavam o calor do dia mesmo depois de o sol desaparecer. Uma mulher procurara-o porque o filho estava doente. A notícia espalhara-se rapidamente, e, quando Nzambi chegou, encontrou várias pessoas reunidas à porta.\n\nO rapaz deitado na cama não devia ter mais de dez anos.\n\nTinha o rosto pálido, o corpo demasiado magro e uma respiração irregular. Ao lado dele, uma mulher segurava-lhe a mão. Os olhos estavam inchados de tanto chorar, mas a voz permanecia firme, como se a mãe se recusasse a permitir que o desespero lhe roubasse a última coisa que ainda podia oferecer ao filho: a presença.\n\n— Disseram-me que podes ajudar — falou.\n\nNzambi sentiu o peso daquela esperança.\n\nNão era a esperança abstracta das pessoas que desejavam um milagre. Era a esperança de alguém que já tentara tudo o que conhecia e que agora se agarrava à possibilidade de que o mundo ainda guardasse uma saída.\n\n— Vou tentar — respondeu.\n\nA mulher apertou-lhe a mão.\n\n— Ele é tudo o que tenho.\n\nNzambi entrou.\n\nA divisão era pequena. Havia uma janela aberta, um copo de água sobre a mesa e um pano húmido junto à cama. O rapaz respirava com dificuldade, e cada inspiração parecia exigir-lhe um esforço que o corpo já não conseguia sustentar. Nzambi sentou-se ao lado dele.\n\n— Como te chamas?\n\nO rapaz abriu os olhos.\n\n— Dito.\n\n— Eu sou Nzambi.\n\n— Eu sei.\n\nA resposta quase lhe arrancou um sorriso.\n\n— Claro que sabes.\n\nDito tentou rir, mas a tosse interrompeu-o.\n\nNzambi segurou-lhe a mão.\n\nA Criação despertou imediatamente.\n\nSentiu o corpo do rapaz como um terreno ferido. Havia caminhos que não conduziam a lado nenhum, forças que se esgotavam, pequenas estruturas que já não conseguiam sustentar o movimento da vida. O jovem podia tocar naquilo que estava quebrado. Podia tentar restaurar o equilíbrio, devolver vigor, fortalecer o que ainda resistia.\n\nMas havia algo mais.\n\nUma fronteira.\n\nNão era uma barreira física. Era uma linha invisível, profunda, que atravessava o corpo de Dito e se estendia para além dele. Nzambi sentiu-a como uma porta que já começara a fechar-se.\n\nA Criação dentro dele pressionou-o.\n\nAbre.\n\nNzambi fechou os olhos.\n\nNão queria obedecer sem compreender.\n\nTentou tocar apenas no que ainda podia ser reparado. A luz dourada surgiu nas palmas das mãos, fraca no início, depois mais intensa. O rapaz respirou fundo. A tensão no rosto diminuiu. A mãe levou a mão à boca, contendo um soluço de esperança.\n\nNzambi sentiu a vida responder.\n\nO corpo de Dito tornou-se mais quente. A respiração ganhou alguma regularidade. Por um instante, pareceu que o mundo estava disposto a conceder-lhes mais tempo.\n\nEntão a marca negra surgiu no pulso de Nzambi.\n\nA dor foi imediata.\n\nEle retirou a mão, assustado.\n\nA luz dourada desapareceu.\n\nDito voltou a respirar com dificuldade.\n\n— Não — murmurou Nzambi.\n\nA mãe aproximou-se.\n\n— O que aconteceu?\n\nNzambi não respondeu.\n\nTentou novamente.\n\nA luz regressou, mas a marca negra avançou pela pele. O rapaz abriu os olhos, e Nzambi sentiu uma força puxá-lo para dentro de uma memória que não lhe pertencia.\n\nViu Dito a correr num quintal, com os pés sujos de terra e uma bola improvisada debaixo do braço. Viu a mãe a chamá-lo para dentro. Viu o rapaz a rir, a discutir com outras crianças, a adormecer sobre uma mesa enquanto fazia os trabalhos da escola.\n\nDepois, a imagem mudou.\n\nDito estava mais velho. O rosto tinha perdido a infância. Havia um homem ao seu lado, talvez um pai, talvez alguém que um dia chegaria à sua vida. Os dois caminhavam por uma estrada, conversando sobre coisas simples. A imagem desfez-se.\n\nNzambi sentiu a marca apertar-lhe o pulso.\n\nNão era uma visão do passado.\n\nEra uma possibilidade.\n\nUma vida que poderia ter existido, mas que talvez nunca chegasse a acontecer. A Criação dentro dele exigiu que a preservasse.\n\nNzambi tentou.\n\nA luz dourada encheu a divisão.\n\nA janela estremeceu. O copo de água partiu-se sobre a mesa. Uma pequena planta brotou numa fenda do chão, abriu duas folhas e cresceu até à altura do joelho.\n\nDito respirou fundo.\n\nPor alguns segundos, tudo pareceu melhorar.\n\nDepois, a marca negra subiu até ao antebraço de Nzambi.\n\nO jovem gritou.\n\nA luz apagou-se.\n\nCaiu de joelhos junto à cama, com a mão apertada contra o peito. A mãe de Dito começou a chorar.\n\n— Salva-o! — implorou. — Por favor, salva o meu filho!\n\nNzambi ergueu o rosto.\n\nQueria dizer-lhe que estava a tentar. Queria prometer que não desistiria. Queria fazer qualquer coisa que transformasse aquela dor numa certeza suportável. Mas a verdade era mais cruel do que qualquer resposta.\n\nEle não sabia se podia salvar Dito.\n\nE começava a suspeitar de que, mesmo que pudesse, talvez não tivesse o direito de o fazer daquela maneira.\n\n— Vou procurar ajuda — disse.\n\nSaiu da casa antes que a mulher pudesse responder.\n\nEncontrou Kalunga junto a uma pequena praça, sentado num muro baixo, com o caderno do pai sobre os joelhos.\n\nNzambi aproximou-se sem cumprimentos.\n\n— Preciso de ti.\n\nKalunga levantou os olhos.\n\n— Isso não parece bom.\n\n— Há um rapaz doente. Tentei ajudá-lo, mas alguma coisa impede-me de continuar.\n\nKalunga fechou o caderno.\n\n— O que aconteceu?\n\nNzambi mostrou-lhe o pulso.\n\nA linha negra tornara-se mais espessa e estendia-se agora até ao antebraço. No centro da palma havia um pequeno círculo incompleto, semelhante à marca de Kalunga.\n\nO jovem da Morte sentiu um frio percorrer-lhe o corpo.\n\n— Como fizeste isso?\n\n— Tentei salvar uma vida.\n\n— E o que aconteceu?\n\n— Não sei. Senti que estava a tentar atravessar uma fronteira. Uma parte de mim queria continuar, mas outra coisa impedia-me. Como se alguém estivesse a dizer que aquela vida já não me pertencia.\n\nKalunga ficou em silêncio.\n\nPensou na figura sem nome. Na balança vazia. Na pergunta do mensageiro. Quando a Morte e a Criação se encontrarem diante da mesma vida, qual delas terá o direito de decidir?\n\n— Leva-me até ele — disse.\n\nNzambi não hesitou.\n\nQuando chegaram à casa, Dito estava consciente, mas a respiração continuava fraca. A mãe segurava-lhe a mão e murmurava palavras que Kalunga não conseguiu distinguir.\n\nO jovem aproximou-se da cama.\n\nA marca reagiu imediatamente.\n\nSentiu a vida do rapaz como uma chama pequena, protegida do vento pelas duas mãos de alguém. A chama ainda existia. Ainda havia calor, movimento, possibilidade.\n\nMas, para além dela, havia uma presença silenciosa.\n\nNão era uma criatura.\n\nNão era uma figura encapuzada.\n\nEra um limite.\n\nKalunga compreendeu que podia tentar tocar nele. Podia puxar a presença para longe, afastá-la durante algum tempo, talvez até impedir que se aproximasse do rapaz naquela noite.\n\nMas não sabia o que aconteceria depois.\n\nE, sobretudo, não sabia quem pagaria pelo tempo que tentasse roubar.\n\n— Consegues fazer alguma coisa? — perguntou Nzambi.\n\nKalunga olhou para Dito.\n\nO rapaz abriu os olhos e tentou sorrir.\n\n— És o amigo dele?\n\nKalunga sentiu a garganta apertar-se.\n\n— Sou.\n\n— Ele disse que me ia ajudar.\n\nNzambi baixou a cabeça.\n\nDito voltou-se para Kalunga.\n\n— Tu também consegues?\n\nO jovem demorou a responder.\n\nNunca uma pergunta tão simples lhe parecera tão difícil.\n\n— Não sei.\n\nO rapaz pareceu aceitar a resposta.\n\n— Está bem.\n\nKalunga sentiu algo partir-se dentro dele.\n\nDito não exigira um milagre. Não acusara ninguém. Não perguntara por que razão os deuses permitiam que as pessoas sofressem. Apenas aceitara que aquele desconhecido não soubesse o que fazer.\n\nEra uma confiança que Kalunga não merecia.\n\nOu talvez fosse uma confiança que ninguém merecesse, mas que os vivos ofereciam uns aos outros porque não tinham outra maneira de continuar. Nzambi aproximou-se da cama.\n\n— Posso tentar mais uma vez.\n\nKalunga agarrou-lhe o braço.\n\n— Espera.\n\n— Não posso ficar parado!\n\n— Eu sei. Mas não podemos continuar a agir sem compreender o preço. Nzambi libertou o braço.\n\n— E se o preço for deixá-lo morrer?\n\nKalunga não conseguiu responder.\n\nA pergunta não era uma provocação. Era o centro do problema, exposto sem protecção.\n\nSe tentassem prolongar a vida de Dito, podiam estar a contrariar um limite que não compreendiam. Se não tentassem, podiam estar a abandonar alguém que ainda tinha possibilidade de viver.\n\nA fé de Kalunga dizia-lhe que tirar uma vida era errado. Mas não lhe oferecia uma fórmula simples para decidir quando uma tentativa de salvar se transformava numa imposição.\n\nA Morte dentro dele parecia exigir uma coisa.\n\nA Criação dentro de Nzambi exigia outra.\n\nE Dito permanecia entre ambos, sem compreender por que razão a sua existência se tornara um julgamento.\n\nKalunga ajoelhou-se junto à cama.\n\n— Dito, posso fazer-te uma pergunta?\n\nO rapaz assentiu.\n\n— Estás com medo?\n\nA mãe apertou-lhe a mão.\n\nDito pensou por um instante.\n\n— Estou.\n\nKalunga sentiu a marca arder.\n\n— Eu também.\n\nO rapaz olhou para ele, surpreendido.\n\n— Mas tu és grande.\n\nKalunga soltou uma pequena gargalhada triste.\n\n— Isso não impede ninguém de ter medo.\n\nDito ficou a olhar para o tecto.\n\n— A minha mãe diz que, quando temos medo, devemos falar com Deus. Kalunga baixou a cabeça.\n\nA frase atingiu-o de uma maneira que nenhum mensageiro conseguiria imitar.\n\n— A tua mãe tem razão.\n\nDito fechou os olhos.\n\n— Então fala com Ele por mim.\n\nKalunga permaneceu imóvel.\n\nDurante alguns segundos, não conseguiu encontrar palavras. A sua fé não era uma ferramenta que pudesse usar para obter resultados. Não era uma ordem que pudesse dirigir ao céu. Era uma relação, uma confiança, uma tentativa de permanecer fiel ao que acreditava mesmo quando as respostas não chegavam. Juntou as mãos.\n\nNão pediu que Dito vivesse a qualquer preço.\n\nNão pediu que a Morte se afastasse para sempre.\n\nPediu apenas que não lhe fosse permitido confundir o seu medo com a vontade de Deus. Pediu sabedoria para reconhecer aquilo que podia fazer e humildade para aceitar aquilo que não compreendia.\n\nQuando terminou, a marca arrefeceu.\n\nNão desapareceu.\n\nApenas deixou de doer.\n\nNzambi observava-o em silêncio.\n\n— Sentiste alguma coisa? — perguntou.\n\nKalunga abanou a cabeça.\n\n— Não.\n\nA resposta surpreendeu o outro jovem.\n\n— Então porque paraste?\n\nKalunga olhou para Dito.\n\n— Porque não quero transformar a minha fé numa desculpa para fazer tudo aquilo que desejo. E não quero transformar o meu medo numa desculpa para não fazer nada.\n\nNzambi baixou os olhos.\n\nA linha negra no seu pulso deixou de avançar.\n\nA luz dourada não regressou, mas a respiração de Dito tornou-se um pouco mais regular. Não era uma cura. Não era um milagre que resolvesse tudo. Era apenas um alívio, frágil e temporário.\n\nA mãe do rapaz começou a chorar em silêncio.\n\nKalunga levantou-se.\n\n— Vamos precisar de ajuda de pessoas que compreendam a doença dele. Não podemos tratar isto apenas como uma questão de poderes.\n\nNzambi assentiu.\n\nPela primeira vez desde que despertara, a Criação dentro dele pareceu recuar sem protestar.\n\nNão porque tivesse sido derrotada.\n\nMas porque, por um instante, ele aceitara que cuidar de alguém também podia significar reconhecer os próprios limites.\n\nAo saírem da casa, encontraram a sombra no fim da rua.\n\nO cajado estava pousado sobre o ombro, e os olhos vermelhos observavam os dois jovens.\n\n— Fizeste bem — disse a sombra.\n\nKalunga parou.\n\n— Não fiz nada.\n\n— Precisamente.\n\nNzambi franziu o sobrolho.\n\n— Estás a dizer que devíamos ter deixado o rapaz sofrer? A sombra voltou-se para ele.\n\n— Estou a dizer que não confundas o poder de alterar o mundo com o direito de decidir como o mundo deve ser.\n\n— E tu? — perguntou Nzambi. — Não fazes o mesmo? Não tentas decidir quando as coisas devem terminar?\n\nA sombra ficou imóvel.\n\n— Eu não sou a Morte.\n\nKalunga sentiu um arrepio.\n\n— Então o que és?\n\nA sombra olhou para ele.\n\nDurante um instante, os olhos vermelhos pareceram apagar-se, deixando apenas duas cavidades profundas.\n\n— Sou aquilo que fica quando a Morte se esquece do seu próprio nome. O cajado bateu no chão.\n\nA rua escureceu.\n\nQuando a luz regressou, a sombra tinha desaparecido.\n\nNo lugar onde estivera, havia uma pequena marca gravada na parede. Um círculo incompleto.\n\nDuas linhas douradas.\n\nE uma terceira linha, negra, que atravessava ambas sem as tocar. Nzambi aproximou-se.\n\n— O que significa?\n\nKalunga passou os dedos pela parede.\n\nA marca desfez-se em pó.\n\n— Não sei.\n\nMas, desta vez, a resposta não lhe pareceu uma derrota.\n\nPareceu-lhe o começo de uma responsabilidade.\n\nNessa noite, Dito adormeceu junto à mãe.\n\nA febre não desaparecera por completo, e ninguém podia prometer o que aconteceria nos dias seguintes. Mas o rapaz estava vivo, e isso bastava para que a família se agarrasse à manhã seguinte.\n\nKalunga regressou a casa com Nzambi.\n\nSentaram-se à mesa, separados por uma distância que já não parecia tão grande como antes.\n\n— Achas que a Morte é má? — perguntou Nzambi.\n\nKalunga ficou a olhar para as próprias mãos.\n\n— Não sei.\n\n— Pensava que soubesses.\n\n— Também pensava.\n\nNzambi passou os dedos pela linha negra no pulso.\n\n— E a Criação? Achas que é boa?\n\nKalunga olhou para ele.\n\n— Criar alguma coisa não torna automaticamente bom aquilo que criaste. Nzambi assentiu lentamente.\n\n— Então talvez sejamos mais parecidos do que pensávamos. Kalunga não respondeu.\n\nDo lado de fora, uma chuva fina começou a cair sobre Sambizanga. E, muito longe dali, a figura velada atrás da porta de pedra ouviu as palavras dos dois jovens. As correntes que lhe prendiam os braços estremeceram, e uma pequena fissura surgiu na pedra.\n\nPor trás do véu, os olhos dourados abriram-se.\n\n— Ainda se lembram de perguntar — murmurou.\n\nA voz que respondeu veio de um lugar mais profundo do que a própria escuridão.\n\n— Por enquanto.\n\nA fissura alargou-se.\n\nE, pela primeira vez desde a criação do mundo, uma das correntes partiu-se."},{"title":"Capítulo 16 — o Peso dos Nomes","text":"A primeira coisa que Kalunga percebeu ao acordar foi que o silêncio tinha mudado.\n\nNão era a ausência de ruído que conhecia desde criança, aquela quietude que por vezes se instalava em casa quando a preocupação dos adultos se tornava demasiado pesada para ser dita em voz alta. Era um silêncio diferente, profundo, quase consciente. Parecia observar.\n\nAbriu os olhos.\n\nA luz que entrava pela janela tinha uma tonalidade pálida. O quarto continuava no mesmo lugar, os móveis permaneciam onde sempre estiveram e o pequeno relógio sobre a mesa marcava as seis e quarenta e dois. Ainda assim, havia qualquer coisa de errado naquela manhã.\n\nO ponteiro dos segundos não avançava.\n\nKalunga levantou-se devagar. Ao aproximar-se do espelho, encontrou o próprio reflexo, mas a imagem demorou uma fracção de segundo a acompanhá-lo. Ergueu a mão direita.\n\nO reflexo fez o mesmo.\n\nDepois, sem que ele se mexesse, a imagem sorriu.\n\nKalunga recuou.\n\nO sorriso desapareceu.\n\n— Estás a começar a ver aquilo que sempre esteve diante de ti. A voz veio da porta.\n\nO mensageiro encontrava-se encostado à parede, com a serenidade de quem nunca precisou de pedir licença para entrar em lugar algum.\n\n— Não te cansaste de aparecer sem seres convidado? — perguntou Kalunga.\n\n— Há portas que se abrem antes de serem tocadas.\n\n— E há pessoas que precisam de aprender a bater.\n\nO mensageiro não respondeu ao sarcasmo.\n\nOlhou para o espelho.\n\n— A corrente partiu-se.\n\nKalunga lembrou-se da figura velada, da porta de pedra e do som metálico que atravessara aquele lugar impossível. Uma das correntes tinha caído. Desde então, os sonhos tornaram-se mais frequentes.\n\n— Quem está atrás daquela porta?\n\n— Alguém que já foi chamado por muitos nomes.\n\n— E qual é o verdadeiro?\n\n— O nome verdadeiro é aquele que permanece quando todos os outros deixam de servir.\n\nKalunga soltou uma respiração impaciente.\n\n— Vocês adoram responder sem dizer nada.\n\n— Porque procuras respostas como quem procura uma saída de emergência. Queres uma porta, não queres compreender o edifício.\n\nO mensageiro aproximou-se da janela.\n\n— Hoje vais compreender uma coisa sobre os nomes. Eles não servem apenas para distinguir pessoas. Às vezes, são a última coisa que impede alguém de desaparecer.\n\nKalunga sentiu a marca no peito aquecer.\n\n— O que queres de mim?\n\n— Nada. Mas há alguém que precisa de ti.\n\nO mensageiro desapareceu.\n\nNo mesmo instante, o relógio voltou a funcionar.\n\nO hospital tinha o cheiro habitual de desinfectante, cansaço e esperança mal disfarçada.\n\nKalunga caminhou pelo corredor até encontrar o irmão doente. Dito estava deitado, com os olhos semicerrados, enquanto a luz do televisor desenhava sombras azuis na parede.\n\nAo lado da cama, a irmã de Kalunga segurava uma pequena garrafa de água.\n\n— Estás atrasado — disse ela.\n\n— O trânsito.\n\nEla olhou para a rua através da janela.\n\n— Não há trânsito nenhum.\n\nKalunga sorriu ligeiramente.\n\n— Então foi o trânsito da minha cabeça.\n\nEla não riu.\n\nDurante alguns minutos, permaneceram juntos sem falar. Dito dormia, respirando com dificuldade. O irmão do meio ainda não tinha aparecido. Nos últimos tempos, as suas ausências tinham-se tornado mais longas, e as explicações, mais curtas.\n\n— Ele voltou a sair ontem — disse a irmã.\n\nKalunga sabia de quem ela falava.\n\n— Disse para onde ia?\n\n— Disse que tinha assuntos para resolver.\n\n— Que tipo de assuntos?\n\n— Os mesmos de sempre.\n\nA resposta deixou um peso no ar.\n\nKalunga sentou-se.\n\n— Vou falar com ele.\n\n— Já falaste muitas vezes.\n\n— Desta vez vai ouvir.\n\nA irmã olhou para ele. Havia uma tristeza nos seus olhos que não combinava com a idade.\n\n— Tu também prometeste que o Dito ia ficar bem.\n\nKalunga ficou imóvel.\n\nNão havia acusação na voz dela. Isso tornou tudo pior.\n\n— Eu sei.\n\n— Então não prometas mais nada.\n\nEla voltou a olhar para o irmão.\n\n— Só fica connosco enquanto ainda podemos estar juntos.\n\nKalunga baixou a cabeça.\n\nNaquele momento, compreendeu que os nomes tinham realmente um peso. Não porque fossem pronunciados, mas porque estavam ligados a pessoas que não podiam ser substituídas.\n\nDito.\n\nA irmã.\n\nO irmão.\n\nO pai.\n\nE ele próprio.\n\nKalunga Mwena.\n\nOu Kalunga Mbanza.\n\nTalvez a diferença entre os dois nomes fosse maior do que imaginara.\n\nNessa noite, encontrou o irmão do meio junto a uma oficina abandonada. O rapaz estava acompanhado por dois homens. Um deles tinha uma cicatriz que atravessava a sobrancelha; o outro mantinha as mãos nos bolsos e observava tudo como se estivesse à espera de uma ordem.\n\n— Precisamos de conversar — disse Kalunga.\n\nO irmão fez um gesto aos companheiros para se afastarem.\n\n— Não tenho tempo.\n\n— Então vou ser rápido. O que aconteceu?\n\n— Nada.\n\n— Não me mintas.\n\nO irmão soltou uma gargalhada sem alegria.\n\n— Agora és polícia?\n\n— Sou teu irmão.\n\n— Isso nunca te impediu de te meteres onde não és chamado. Kalunga aproximou-se.\n\n— Ouvi dizer que alguém morreu.\n\nO rosto do rapaz mudou.\n\nFoi apenas um instante, mas suficiente.\n\n— Não sabes do que estás a falar.\n\n— Então explica-me.\n\n— Ele não devia estar ali.\n\nKalunga sentiu o estômago apertar.\n\n— Quem?\n\n— Um homem. Estava no sítio errado, na hora errada.\n\n— E tu?\n\nO irmão desviou o olhar.\n\n— Eu estava a tentar resolver um problema.\n\n— Mataste-o?\n\nO silêncio respondeu antes da boca.\n\nKalunga sentiu a marca no peito arder.\n\nPor um momento, o mundo perdeu as cores. A oficina tornou-se um espaço sem paredes, e uma linha escura atravessou o chão, dividindo o lugar em duas metades.\n\nUma voz sussurrou:\n\nO sangue conhece o caminho.\n\nKalunga fechou os olhos.\n\nQuando voltou a abri-los, o irmão segurava-lhe o braço.\n\n— Estás bem?\n\n— O que fizeste?\n\n— Fiz o que tinha de fazer.\n\n— Não existe isso quando uma pessoa inocente morre.\n\n— Tu não sabes como é!\n\n— Então ensina-me!\n\nO irmão empurrou-o.\n\n— Não preciso que me ensines a viver!\n\nOs dois ficaram frente a frente.\n\nKalunga viu medo no rosto dele. Não o medo de ser castigado, mas o medo de ter descoberto demasiado tarde que já não era a pessoa que imaginava ser.\n\n— Vai para casa — disse Kalunga.\n\n— Não mandas em mim.\n\n— Não. Mas ainda posso pedir-te.\n\nO irmão afastou-se.\n\nAntes de desaparecer na rua, voltou-se uma última vez.\n\n— Não te esqueças de que também somos pessoas. Não somos os teus destinos. Kalunga permaneceu sozinho.\n\nA frase acompanhou-o durante todo o caminho de regresso. E, naquela noite, pela primeira vez, a sombra que o seguia não projectou a sua própria forma.\n\nProjectou a de um homem caído."},{"title":"Capítulo 17 — a Justiça dos","text":"MORTAIS O homem morto tinha um nome.\n\nChamava-se Mateus.\n\nTinha uma filha pequena, uma mulher que trabalhava num mercado e uma mãe que ainda esperava ouvir a chave dele na fechadura ao fim da tarde. Não era um herói.\n\nNão era um santo.\n\nEra apenas um homem que trabalhava, discutia ocasionalmente com os vizinhos, se esquecia de comprar pão e prometia à filha que, no domingo seguinte, a levaria ao parque.\n\nTinha uma vida.\n\nE alguém a interrompera.\n\nKalunga descobriu tudo isso através de uma mulher que o reconheceu quando ele se aproximou da casa.\n\n— És irmão daquele rapaz, não és?\n\nEle confirmou com a cabeça.\n\nA mulher olhou-o durante algum tempo.\n\n— Então diz-me uma coisa. Sabias?\n\nKalunga não conseguiu responder imediatamente.\n\n— Sabia que ele andava com más companhias.\n\n— Não perguntei isso.\n\nA mulher apertou o pano que segurava nas mãos.\n\n— Perguntei se sabias que ele era capaz de tirar a vida de alguém. Kalunga baixou os olhos.\n\n— Não.\n\n— Então também não sabias quem ele estava a tornar-se.\n\nA porta abriu-se.\n\nUma menina apareceu, segurando um brinquedo de plástico.\n\n— Mãe, quem é?\n\nA mulher acariciou-lhe o cabelo.\n\n— É alguém que veio falar connosco.\n\nA menina olhou para Kalunga.\n\n— Conheces o meu pai?\n\nA pergunta atravessou-o de uma forma que nenhuma entidade, símbolo ou profecia conseguira fazer.\n\n— Não — respondeu. — Mas gostava de o ter conhecido.\n\nA menina levantou o brinquedo.\n\n— Ele prometeu arranjar isto.\n\nKalunga olhou para o objecto partido.\n\nNão encontrou nenhuma palavra capaz de competir com aquela promessa interrompida.\n\nNaquela noite, o mensageiro esperava-o no lugar entre a criação e o fim. A pedra continuava suspensa sobre o abismo. A porta permanecia diante deles, agora com uma corrente a menos.\n\n— Viste a consequência — disse o mensageiro.\n\n— Vi uma criança que perdeu o pai.\n\n— E o que sentiste?\n\n— Raiva.\n\n— De quem?\n\n— Do meu irmão. De mim. De tudo isto.\n\n— E achas que a raiva pode corrigir alguma coisa?\n\nKalunga aproximou-se da porta.\n\n— Não. Mas pelo menos lembra-me de que aconteceu.\n\nO mensageiro assentiu.\n\n— A memória é uma forma de justiça, mas não é a justiça inteira.\n\n— Então o que é a justiça?\n\n— Uma pergunta que os vivos fazem aos mortos e que os mortos já não conseguem responder.\n\nKalunga virou-se.\n\n— O meu irmão matou um inocente. O que acontece agora?\n\nO mensageiro não respondeu de imediato.\n\n— Há coisas que não podem ser desfeitas.\n\n— Isso não é uma resposta.\n\n— É a primeira parte de todas as respostas honestas.\n\nA marca de Kalunga brilhou.\n\nA porta emitiu um som grave.\n\n— Ele tem de morrer? — perguntou Kalunga.\n\nO mensageiro olhou para ele.\n\n— Estás a perguntar como irmão ou como aquilo que carregas dentro de ti?\n\n— Estou a perguntar como alguém que não quer perder mais ninguém.\n\n— Então ainda não estás preparado para ouvir.\n\nKalunga cerrou os punhos.\n\n— Estou cansado de todos vocês decidirem quando posso saber a verdade.\n\n— A verdade não é uma recompensa pela paciência, Kalunga. É um peso que exige capacidade para ser carregado.\n\nA pedra sob os pés tremeu.\n\nDo outro lado da porta, ouviu-se uma respiração.\n\nKalunga aproximou-se.\n\n— Quem és tu? — perguntou.\n\nUma voz respondeu do interior:\n\n— Sou a primeira consequência.\n\nA corrente restante estremeceu.\n\n— Consequência de quê?\n\n— Da primeira escolha.\n\nKalunga olhou para o mensageiro.\n\n— A escolha que separou a Criação da Morte?\n\n— Sim.\n\n— O que aconteceu?\n\nO mensageiro permaneceu em silêncio.\n\nFoi a própria porta que respondeu:\n\n— Alguém quis salvar aquilo que não podia permanecer.\n\nKalunga sentiu um arrepio.\n\n— E o que fez?\n\nA voz tornou-se quase humana.\n\n— Escolheu.\n\nA corrente partiu-se parcialmente, mas não caiu.\n\nUma fenda abriu-se na superfície da porta.\n\nPor detrás dela, Kalunga viu um rosto.\n\nNão conseguiu distingui-lo.\n\nAinda assim, reconheceu uma coisa.\n\nO olhar era o mesmo que vira no espelho.\n\nQuando regressou a casa, encontrou o pai sentado na sala. Kalunga parou à entrada.\n\nDurante alguns segundos, nenhum dos dois falou.\n\nO homem parecia mais velho do que nas fotografias. Tinha os ombros curvados e as mãos repousadas sobre os joelhos. A luz fraca da televisão iluminava-lhe o rosto.\n\n— Pai?\n\nO homem levantou os olhos.\n\n— Filho.\n\nAquela palavra quase o fez esquecer todas as perguntas.\n\nKalunga aproximou-se devagar.\n\n— Onde estiveste?\n\n— Longe.\n\n— Durante quanto tempo?\n\nO pai olhou para as próprias mãos.\n\n— Mais tempo do que devia.\n\nKalunga sentou-se à sua frente.\n\n— O que sabes sobre a marca?\n\nO homem fechou os olhos.\n\n— Sei que ela não te pertence.\n\n— Então de quem é?\n\n— Não sei se essa pergunta ainda tem resposta.\n\n— Conheces o mensageiro?\n\nO pai ficou tenso.\n\n— Ele continua a aparecer?\n\nKalunga confirmou.\n\n— E a porta?\n\nO homem levantou-se de repente.\n\n— Não voltes a abrir aquela porta.\n\n— Já está a abrir-se sozinha.\n\nO pai segurou-lhe os ombros.\n\n— Escuta-me. Há coisas que não devem ser libertadas apenas porque alguém está cansado de esperar.\n\n— Quem está lá dentro?\n\nO homem olhou para ele com uma tristeza antiga.\n\n— Aquilo que eu tentei esquecer.\n\n— O que fizeste, pai?\n\nO homem abriu a boca.\n\nMas não respondeu.\n\nPor cima deles, o relógio parou.\n\nE, pela primeira vez desde que regressara, o pai de Kalunga começou a chorar."},{"title":"Capítulo 18 — o Deus Que Teme","text":"O pai não contou tudo naquela noite.\n\nContou fragmentos, pedaços de uma história que parecia ter sido partida de propósito.\n\nFalou de uma época em que a Criação e a Morte não eram forças separadas. Falou de um lugar onde tudo o que começava também sabia como terminar. Falou de uma primeira entidade que não era inteiramente uma coisa nem outra. Mas, quando Kalunga lhe perguntou quem tinha aberto a primeira fenda, o pai levantou-se e abandonou a sala.\n\nDeixou apenas uma frase:\n\n— Não confundas o poder de decidir com o direito de decidir. Kalunga passou o resto da noite acordado.\n\nDito estava pior.\n\nO médico não precisou de usar palavras difíceis. A expressão no rosto dele já dizia tudo. A doença avançava, e os tratamentos tinham deixado de oferecer qualquer promessa segura.\n\nA irmã de Kalunga permanecia ao lado da cama.\n\n— Ele perguntou por ti — disse ela.\n\nKalunga aproximou-se.\n\nDito abriu os olhos.\n\n— Demoraste.\n\n— Vim assim que pude.\n\n— Mentiroso.\n\nKalunga sorriu.\n\n— Um bocadinho.\n\nDito tentou rir, mas a tosse interrompeu-o.\n\n— A mana disse que vais resolver tudo.\n\nKalunga sentiu a garganta apertar.\n\n— A mana fala demais.\n\n— Então é verdade?\n\nEle olhou para o irmão.\n\nAquele rosto parecia cada vez mais pequeno dentro da cama.\n\n— Estou a tentar.\n\nDito ficou calado.\n\nDepois perguntou:\n\n— Quando eu melhorar, vamos sair?\n\nKalunga não respondeu imediatamente.\n\n— Vamos fazer o que quiseres.\n\n— Mesmo se eu quiser comer aquele gelado horrível que tu gostas?\n\n— Principalmente esse.\n\nDito sorriu.\n\n— Sabia que ias dizer isso.\n\nA irmã desviou o rosto.\n\nKalunga percebeu que ela também estava a chorar.\n\nNaquela tarde, Nzambi apareceu.\n\nNão entrou pela porta nem atravessou uma janela. Simplesmente estava ali, junto ao corredor, como se o mundo tivesse decidido dar-lhe forma. A sua presença não era assustadora.\n\nEra luminosa.\n\nMas havia cansaço no seu rosto.\n\n— Preciso de falar contigo — disse.\n\nKalunga conduziu-o até ao exterior.\n\n— O meu irmão está a morrer.\n\nNzambi olhou para o edifício.\n\n— Eu sei.\n\n— Podes salvá-lo?\n\nO silêncio foi longo.\n\n— Posso tentar.\n\n— Já tentaste.\n\n— E falhei.\n\nKalunga aproximou-se.\n\n— Tu és a Criação.\n\n— Sim.\n\n— Então cria outra possibilidade.\n\nNzambi baixou os olhos.\n\n— Não compreendes o que me estás a pedir.\n\n— Então explica-me!\n\nA luz em redor de Nzambi enfraqueceu.\n\n— Criar não significa apagar tudo o que nos desagrada. Se eu mudar cada consequência, se alterar cada limite, se impedir todos os fins, deixarei de criar um mundo. Estarei apenas a construir uma prisão onde nada pode mudar. Kalunga sentiu a raiva crescer.\n\n— E se for o meu irmão?\n\n— É por isso que a resposta dói.\n\n— Então o teu poder não serve para nada!\n\nNzambi não se defendeu.\n\n— Talvez seja isso que precisas de compreender. O poder não torna ninguém capaz de tudo.\n\nKalunga virou-se.\n\n— E o meu?\n\n— O teu também não.\n\n— Sou a Morte.\n\n— És alguém que carrega a Morte. Ainda não sei se isso significa a mesma coisa. Kalunga ficou imóvel.\n\n— Qual é a diferença?\n\nNzambi aproximou-se.\n\n— A Morte é uma lei. Tu és uma consciência. Uma lei não sente culpa. Uma consciência pode perguntar se a lei é justa.\n\nKalunga olhou para as próprias mãos.\n\n— E se eu não quiser ser nenhuma das duas coisas?\n\n— Então terás de descobrir o que és sem fugir daquilo que te trouxe até aqui.\n\nNessa noite, Kalunga voltou ao lugar da porta.\n\nDesta vez, não foi chamado.\n\nFoi por vontade própria.\n\nA figura velada estava de pé diante da pedra. A última corrente pendia do alto, enfraquecida, mas ainda presa.\n\n— Finalmente — disse ela.\n\nA voz parecia vir de muitos lugares ao mesmo tempo.\n\n— Quem és tu?\n\n— Já te disse que sou aquilo que fica quando a Morte se esquece do próprio nome.\n\n— Isso não me diz nada.\n\n— Porque procuras uma pessoa onde existe uma consequência. Kalunga aproximou-se.\n\n— Conheceste o meu pai?\n\nA figura inclinou a cabeça.\n\n— Conheci o homem que ele foi antes de aprender a ter medo.\n\n— Ele tentou abrir esta porta?\n\n— Tentou fechá-la.\n\n— Porquê?\n\n— Porque acreditava que o mundo podia continuar sem pagar o preço da primeira escolha.\n\nKalunga olhou para a corrente.\n\n— E o que existe atrás dela?\n\nA figura estendeu uma mão.\n\nPor um instante, a sombra pareceu transformar-se numa pessoa de carne e osso. Kalunga viu um rosto semelhante ao seu, mas mais antigo, marcado por uma tristeza que não cabia em nenhuma vida humana.\n\n— Existe a pergunta que deu origem ao teu nome.\n\nA marca no peito de Kalunga ardeu.\n\n— E qual é essa pergunta?\n\nA figura respondeu:\n\n— Se tudo o que nasce merece viver para sempre, quem terá coragem de permitir que o mundo continue?\n\nA porta tremeu.\n\nKalunga recuou.\n\nAo regressar a casa, encontrou uma nova página sobre a mesa do pai. A letra era antiga.\n\nA mensagem, curta:\n\nO Primeiro não criou a Morte. Criou a necessidade de escolher. E, por baixo, uma segunda frase:\n\nNão deixes que te convençam de que és apenas uma resposta."},{"title":"Capítulo 19 — Antes do Último","text":"SILÊNCIO O mundo começou a apresentar pequenas falhas.\n\nUma mulher viu a própria infância reflectida na montra de uma loja. Um homem ouviu a voz da mãe falecida a chamá-lo pelo nome. Na escola, os relógios atrasaram-se durante exactamente sete minutos. Num bairro distante, uma criança desenhou uma porta que nunca tinha visto.\n\nEm todos os lugares, uma linha escura surgia por breves instantes. A fronteira entre o que começava e o que terminava estava a enfraquecer. Kalunga sabia disso.\n\nTambém sabia que não podia continuar a fingir que os acontecimentos não tinham relação com a sua família.\n\nO irmão do meio apareceu em casa depois de vários dias.\n\nTinha o rosto marcado, a roupa suja e um corte junto ao lábio. A irmã levantou-se imediatamente.\n\n— Onde estiveste?\n\n— Não comeces.\n\n— Estávamos preocupados!\n\n— Eu não pedi que ficassem preocupados.\n\nKalunga saiu do quarto.\n\n— Precisamos de conversar.\n\nO irmão soltou uma gargalhada.\n\n— Outra vez?\n\n— Desta vez vais ouvir.\n\n— Já ouvi tudo o que tinhas para dizer.\n\n— Então explica-me porque continuas a fugir.\n\nO rapaz passou as mãos pelo rosto.\n\n— Porque há coisas que já não consigo resolver!\n\nA voz dele partiu-se.\n\nKalunga aproximou-se.\n\n— Entrega-te.\n\n— O quê?\n\n— Vai à polícia. Conta o que aconteceu.\n\n— Estás maluco?\n\n— Um homem morreu. A família dele merece saber a verdade.\n\n— E eu? Não mereço uma oportunidade?\n\nKalunga ficou em silêncio.\n\n— Eu não queria matá-lo — continuou o irmão. — Não era suposto acontecer.\n\n— Mas aconteceu.\n\n— Foi um acidente!\n\n— E agora?\n\nO irmão começou a chorar, embora tentasse esconder.\n\n— Agora acordo todos os dias a ouvir o som daquele disparo. Kalunga sentiu a marca aquecer.\n\nAtrás do irmão, uma sombra levantou-se lentamente.\n\nNão tinha rosto.\n\nNão tinha mãos.\n\nMas segurava alguma coisa semelhante a uma balança.\n\nUm dos pratos estava vazio.\n\nO outro continha uma pequena mancha escura.\n\nKalunga piscou os olhos.\n\nA visão desapareceu.\n\n— Não quero morrer — disse o irmão.\n\nA frase saiu tão baixa que quase se perdeu.\n\nKalunga olhou para ele.\n\n— Não digas isso.\n\n— Tu sabes alguma coisa, não sabes?\n\n— Não.\n\n— Estás a mentir.\n\nO irmão agarrou-lhe o braço.\n\n— Diz-me que não vai acontecer nada.\n\nKalunga tentou responder.\n\nMas não encontrou palavras.\n\nNaquela mesma noite, a irmã chamou-o.\n\nDito estava acordado.\n\nO rapaz parecia mais fraco do que na manhã anterior. A respiração era curta, e os olhos tinham perdido parte do brilho.\n\n— Ele quer falar contigo — disse a irmã.\n\nKalunga sentou-se junto à cama.\n\n— Estou aqui.\n\nDito demorou algum tempo a falar.\n\n— Tenho medo.\n\nKalunga segurou-lhe a mão.\n\n— Eu também.\n\n— Tu és mais velho. Não devias ter medo.\n\n— Os mais velhos também têm.\n\nDito observou-o.\n\n— Quando eu morrer, vais lembrar-te de mim?\n\nKalunga sentiu o coração apertar.\n\n— Todos os dias.\n\n— Mesmo quando ficares muito velho?\n\n— Mesmo quando já não conseguir lembrar-me de mais nada. Dito sorriu ligeiramente.\n\n— Então está bem.\n\nFechou os olhos.\n\nKalunga permaneceu ali, segurando a mão do irmão.\n\nA irmã estava junto à janela.\n\n— Ele sabe — murmurou.\n\nKalunga não respondeu.\n\n— Não sei se sabe o que está a acontecer com ele. Mas acho que sabe que está a chegar ao fim.\n\nKalunga levantou-se.\n\n— Não digas isso.\n\n— Não posso fingir para sempre.\n\nEla virou-se.\n\n— Não quero que ele sofra. Mas também não quero perdê-lo. Kalunga aproximou-se.\n\n— Eu sei.\n\n— Tu sabes o que está a acontecer, não sabes?\n\nEle olhou para ela.\n\nPor um momento, pensou em contar-lhe tudo. Sobre a marca, a porta, o mensageiro, Nzambi e a natureza que parecia reclamar uma decisão. Mas como poderia explicar que o destino de uma família estava a ser discutido num lugar que não pertencia ao mundo dos vivos?\n\n— Estou a tentar encontrar uma saída — disse.\n\nA irmã aproximou a testa do peito dele.\n\n— Então encontra depressa.\n\nO mensageiro esperava-o no limite da cidade.\n\nA noite estava limpa, mas as estrelas pareciam demasiado próximas.\n\n— Chegou a hora — disse.\n\n— Ainda não.\n\n— Não estás a falar comigo.\n\n— Então com quem estou a falar?\n\nO mensageiro apontou para o peito de Kalunga.\n\n— Com aquilo que sabes e ainda não aceitaste.\n\nKalunga olhou para o horizonte.\n\n— O meu irmão matou um inocente. A minha irmã está a perder o irmão mais novo. O meu pai desapareceu por causa de uma escolha que nunca compreendi. E vocês querem que eu decida como se a vida das pessoas fosse uma conta que posso resolver.\n\n— Não queremos que decidas.\n\n— Então por que me trouxeram até aqui?\n\nO mensageiro aproximou-se.\n\n— Porque alguém terá de escolher quando a porta se abrir completamente.\n\n— E se eu me recusar?\n\n— A recusa também é uma escolha.\n\nKalunga soltou uma gargalhada amarga.\n\n— Claro. Até a minha liberdade foi transformada numa armadilha.\n\n— Não confundas liberdade com ausência de consequências. O mensageiro estendeu a mão.\n\nNela estava a pequena semente que Kalunga recebera anteriormente. Agora, a superfície tinha uma fissura.\n\nDo interior saía uma luz que não era inteiramente branca nem escura.\n\n— A origem está a despertar — disse o mensageiro.\n\n— O que acontece quando a semente abrir?\n\n— A primeira pergunta voltará a ser feita.\n\nKalunga olhou para a semente.\n\n— E a resposta?\n\n— Não me pertence.\n\nA semente abriu-se.\n\nNão nasceu uma planta.\n\nNasceu uma voz.\n\nA mesma voz que Kalunga ouvira atrás da porta.\n\n— Kalunga Mbanza.\n\nEle ergueu a cabeça.\n\n— O meu nome é Kalunga Mwena.\n\nA voz respondeu:\n\n— Os nomes que recebeste não são os únicos que podes carregar. O céu abriu uma fenda.\n\nE, no outro lado, Kalunga viu o pai.\n\nO homem estava diante de uma porta idêntica àquela que existia no lugar entre a Criação e a Morte.\n\nDesta vez, não estava sozinho.\n\nAo seu lado encontrava-se uma figura cuja presença fez Kalunga esquecer como respirar.\n\nA figura tinha o seu rosto."},{"title":"Capítulo 20 — Nzambi Wa Kufa","text":"O amanhecer chegou sem sol.\n\nA cidade acordou coberta por uma luz cinzenta, como se a manhã tivesse perdido a vontade de nascer. As pessoas saíram de casa, abriram lojas, apanharam transportes e seguiram os caminhos habituais. Mas havia algo diferente nos seus movimentos.\n\nAlgumas paravam no meio da rua sem saber porquê.\n\nOutras olhavam para o céu durante longos minutos.\n\nE, em certos lugares, as sombras apontavam para direcções diferentes das pessoas que as projectavam.\n\nKalunga caminhou até ao hospital.\n\nNão sabia se encontraria o irmão acordado. Não sabia sequer se ainda teria oportunidade de lhe dizer alguma coisa.\n\nA irmã estava sentada junto à cama.\n\nTinha os olhos cansados.\n\n— Ele dormiu um pouco — disse.\n\nKalunga aproximou-se.\n\nDito abriu os olhos.\n\n— Estás aqui.\n\n— Estou.\n\n— Ainda vamos comer aquele gelado?\n\nKalunga sorriu.\n\n— Ainda.\n\nDito ficou a olhar para ele.\n\n— Não mintas.\n\nKalunga baixou a cabeça.\n\n— Não quero mentir-te.\n\n— Então não digas nada.\n\nO rapaz fechou os olhos.\n\nKalunga segurou-lhe a mão.\n\nDurante muito tempo, ficou ali.\n\nNão pediu a Nzambi que o salvasse.\n\nNão pediu à Morte que o levasse.\n\nPela primeira vez, não pediu absolutamente nada.\n\nApenas permaneceu.\n\nQuando saiu do hospital, encontrou o irmão do meio do outro lado da rua. O rapaz estava sentado num muro, com as mãos entrelaçadas.\n\n— Estás a seguir-me? — perguntou Kalunga.\n\n— Não.\n\nO irmão levantou-se.\n\n— Fui à polícia.\n\nKalunga ficou imóvel.\n\n— Contaste tudo?\n\n— Sim.\n\n— E agora?\n\n— Agora tenho de responder pelo que fiz.\n\nO rapaz olhou para o chão.\n\n— Não sei se algum dia vou conseguir viver com aquilo.\n\nKalunga aproximou-se.\n\n— Talvez não consigas esquecer.\n\n— Achas que mereço ser perdoado?\n\nKalunga demorou a responder.\n\n— Não sou eu quem pode decidir isso.\n\nO irmão assentiu.\n\n— Pelo menos desta vez não mentiste.\n\nOs dois permaneceram em silêncio.\n\nDepois, o rapaz abraçou-o.\n\nFoi um abraço desajeitado, pesado, cheio de palavras que nenhum dos dois sabia pronunciar.\n\nQuando se afastaram, o irmão perguntou:\n\n— Vais ficar bem?\n\nKalunga olhou para o céu.\n\n— Não sei.\n\n— Então somos dois.\n\nO irmão partiu.\n\nKalunga não o seguiu.\n\nO lugar entre a Criação e a Morte já não tinha a mesma aparência. O abismo estava coberto por uma luz profunda. A porta de pedra encontrava-se aberta, e as correntes tinham caído.\n\nNzambi esperava diante dela.\n\nO mensageiro estava à sua direita.\n\nA figura velada encontrava-se do outro lado.\n\nKalunga aproximou-se.\n\n— Chegaste — disse Nzambi.\n\n— Não me deixaram muitas alternativas.\n\n— Sempre tiveste uma.\n\nKalunga olhou para a porta.\n\n— O que existe aí dentro?\n\nNzambi respirou fundo.\n\n— A origem da separação.\n\n— Quero a verdade.\n\nA figura velada avançou.\n\n— A verdade é que, antes de ti, houve outro.\n\nKalunga sentiu o peito apertar.\n\n— O Primeiro?\n\n— Aquele que viu a Criação crescer e percebeu que tudo o que nasce também pode desaparecer.\n\nA figura levantou a mão.\n\nO espaço transformou-se.\n\nKalunga viu um mundo sem manhãs nem noites. Viu rios que nunca secavam, árvores que nunca perdiam folhas e pessoas que nunca envelheciam. Tudo permanecia.\n\nMas nada mudava.\n\nNão havia despedidas.\n\nNão havia nascimento.\n\nNão havia espaço para o futuro.\n\nAquele mundo não estava vivo.\n\nEstava apenas a continuar.\n\n— O Primeiro quis salvar tudo — disse a figura. — Não suportava a ideia de perder aquilo que amava. Pediu à Criação que não permitisse mais nenhum fim. Nzambi fechou os olhos.\n\n— E eu tentei.\n\nKalunga olhou para ele.\n\n— Foste tu?\n\n— Fui a primeira forma da Criação. Não compreendia que preservar tudo poderia destruir o próprio significado de existir.\n\nA figura velada continuou:\n\n— Então alguém teve de estabelecer um limite. Alguém teve de permitir que as coisas terminassem para que outras pudessem começar.\n\nKalunga olhou para a porta.\n\n— A Morte.\n\n— Não como a conheces — respondeu a figura. — A Morte não nasceu para destruir. Nasceu para impedir que a existência se transformasse numa prisão.\n\n— E o Primeiro?\n\nO mensageiro respondeu:\n\n— O Primeiro recusou aceitar a escolha. Tornou-se aquilo que permanece entre o que deve terminar e aquilo que não consegue começar.\n\nKalunga olhou novamente para a figura.\n\n— És tu.\n\nA figura não confirmou nem negou.\n\n— Sou a consequência que ficou por resolver.\n\nA marca no peito de Kalunga brilhou.\n\nA luz atravessou-lhe o corpo, revelando imagens de vidas que não eram suas. Viu o pai diante da porta. Viu o mensageiro em tempos antigos. Viu Nzambi a criar estrelas com mãos que ainda não conheciam o cansaço.\n\nE viu a si próprio.\n\nNão como um jovem de Sambizanga.\n\nMas como uma presença antiga, diante de um mundo que lhe pedia uma decisão.\n\n— Porque eu? — perguntou.\n\nNzambi respondeu:\n\n— Porque carregas aquilo que a Morte perdeu.\n\n— E o que é?\n\n— A capacidade de duvidar.\n\nKalunga olhou para a figura velada.\n\n— O que acontece agora?\n\nA figura apontou para a porta.\n\n— A primeira escolha tem de ser feita novamente. A separação está a desfazer-se. Se nada acontecer, a Criação e a Morte deixarão de ter fronteiras. Tudo ficará suspenso entre o princípio e o fim.\n\n— E eu tenho de escolher?\n\n— Não existe outro que possa fazê-lo.\n\nKalunga sentiu a raiva crescer.\n\n— Então todo este caminho serviu para me trazer até uma escolha que ninguém quer assumir?\n\nNzambi aproximou-se.\n\n— Não. Serviu para que chegasses até ela sabendo que as pessoas não são números, que a justiça não é vingança e que amar alguém não significa possuir o direito de controlar o seu destino.\n\nKalunga olhou para ele.\n\n— E se eu escolher errado?\n\nNzambi respondeu com uma tristeza serena:\n\n— Talvez seja por isso que a escolha é tua.\n\nO pai apareceu junto à porta.\n\nKalunga reconheceu-o imediatamente.\n\n— Pai!\n\nO homem parecia diferente. Não estava mais velho nem mais novo. Tinha o mesmo rosto, mas os olhos carregavam uma compreensão que não existia antes.\n\n— Perdoa-me — disse o pai.\n\nKalunga aproximou-se.\n\n— Porquê?\n\n— Porque tentei proteger-te escondendo a verdade. E porque, quando chegou a minha vez de escolher, tive medo.\n\n— O que escolheste?\n\nO pai olhou para a porta.\n\n— Tentei adiar.\n\n— E o que aconteceu?\n\n— O mundo continuou. Mas alguma coisa ficou presa.\n\nKalunga olhou para a figura velada.\n\n— És tu que está preso?\n\nO pai não respondeu.\n\n— Pai, diz-me a verdade.\n\nO homem colocou a mão no ombro do filho.\n\n— Não permitas que o medo escolha por ti.\n\nA imagem do pai começou a desaparecer.\n\nKalunga tentou segurá-lo.\n\n— Não vás!\n\n— Filho...\n\n— Ainda não acabámos de conversar!\n\nO pai sorriu.\n\n— Talvez nunca acabemos.\n\nE desapareceu.\n\nA porta começou a fechar-se.\n\nO mensageiro afastou-se.\n\nNzambi permaneceu imóvel.\n\nA figura velada estendeu a mão.\n\n— Chegou a hora, Kalunga.\n\nA marca no peito dele dividiu-se em duas linhas.\n\nUma era escura.\n\nA outra, luminosa.\n\nAs duas atravessaram o espaço e tocaram a porta.\n\nKalunga sentiu a presença de todos os que conhecia.\n\nA irmã.\n\nDito.\n\nO irmão.\n\nA mãe.\n\nO pai.\n\nMateus, o homem que nunca conhecera, mas cuja morte tinha alterado o destino de todos.\n\nE, por detrás de todos eles, uma multidão de nomes que nunca chegaria a ouvir. A Morte não lhe mostrou cadáveres.\n\nMostrou-lhe histórias.\n\nA Criação não lhe mostrou milagres.\n\nMostrou-lhe possibilidades.\n\nE Kalunga compreendeu que nenhuma das duas forças era suficientemente grande para carregar sozinha o peso de todas as vidas.\n\n— Se eu fizer a escolha — disse —, quem me garante que o mundo continuará? Nzambi respondeu:\n\n— Ninguém.\n\n— Quem me garante que não perderei tudo?\n\nO mensageiro baixou os olhos.\n\n— Ninguém.\n\n— Quem me garante que ainda serei eu depois disto?\n\nA figura velada aproximou-se.\n\n— Ninguém.\n\nKalunga fechou os olhos.\n\nPela primeira vez, não procurou uma resposta no poder, na profecia ou na voz dos deuses.\n\nProcurou-a dentro de si.\n\nPensou no irmão mais novo.\n\nPensou no irmão que havia cometido um crime.\n\nPensou na criança que esperava pelo pai.\n\nPensou no homem que um dia fora o seu pai.\n\nPensou em todas as vezes que desejara que o mundo fosse justo, sem compreender que a justiça não apagava a dor de quem ficava para trás. E, por fim, pensou no próprio nome.\n\nKalunga Mwena.\n\nKalunga Mbanza.\n\nTalvez nenhum deles fosse suficiente.\n\nTalvez ambos fossem verdadeiros.\n\nAbriu os olhos.\n\nA porta estava quase fechada.\n\nNzambi estendeu-lhe a mão.\n\nO mensageiro não se mexeu.\n\nA figura velada aguardava.\n\nKalunga deu um passo em frente.\n\nDepois outro.\n\nA sua mão aproximou-se da superfície da porta.\n\nA luz escura e a luz dourada começaram a fundir-se.\n\n— E se a Morte também tiver de aprender a criar? — perguntou. Ninguém respondeu.\n\nKalunga olhou para o outro lado da porta.\n\nPor um instante, ouviu uma voz familiar.\n\nEra Dito.\n\nOu talvez fosse apenas a memória dele.\n\nDepois ouviu a irmã.\n\nDepois o irmão.\n\nDepois uma voz que não reconheceu.\n\nA porta abriu-se completamente.\n\nE o mundo parou.\n\nEm Sambizanga, um relógio voltou a funcionar.\n\nNo hospital, uma enfermeira entrou num quarto e encontrou uma cama vazia. Na esquadra, um homem aguardava sentado, com as mãos algemadas. Numa casa antiga, uma mulher olhou para uma fotografia e sentiu que alguém lhe faltava, embora não conseguisse explicar quem.\n\nE, num lugar que não pertencia a nenhum mapa, duas forças permaneceram frente a frente.\n\nA Criação.\n\nA Morte.\n\nEntre ambas, um jovem segurava uma escolha que nenhum deus tinha conseguido resolver.\n\nO seu nome era Kalunga.\n\nMas, naquele instante, até ele parecia ter-se esquecido de como se chamava. A última coisa que se ouviu foi uma pergunta.\n\nNão veio de Nzambi.\n\nNão veio da Morte.\n\nVeio de alguém que ainda não sabia se estava a começar ou a terminar:\n\n— Se eu salvar o mundo, quem salvará aquilo que sou?\n\nE o silêncio, pela primeira vez, não respondeu.\n\nContinua...?!"}]}]}</script><script id="app">
(function(){
'use strict';

var FALLBACK_RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var PALETTES=[['#2B2BFF','#F1F1FF','#FFC83D'],['#14152E','#EDEEFF','#8E96FF'],['#E8452C','#FFF1EC','#17183A'],['#0F7A6B','#EAFBF6','#FFE066'],['#F2C4E2','#1B1335','#2B2BFF'],['#D9FF5B','#14152E','#2B2BFF']];
var GENRES=['Romance','Fantasia','Ficção científica','Terror','Mistério','Drama','Aventura','Poesia','Crónica','Conto','Comédia','Thriller'];

var state;
try{state=JSON.parse(document.getElementById('state').textContent)}catch(e){state={}}
state.site=Object.assign({name:'Estante',author:'',tagline:'Histórias, capítulo a capítulo.'},state.site||{});
state.books=Array.isArray(state.books)?state.books:[];
try{
  if(!(window.claude&&window.claude.use)&&localStorage.getItem('estante:author')==='1'){
    var saved=JSON.parse(localStorage.getItem('estante:state')||'null');
    if(saved&&Array.isArray(saved.books)){state.site=Object.assign(state.site,saved.site||{});state.books=saved.books}
  }
}catch(e){}

var $root=document.getElementById('root');
var isEditor=false,editorChecked=false,publishing=false,editing=null,filterGenre=null,progEl=null,toastTimer=null;
var prefs={size:20,font:'serif',theme:'auto'};

/* ---------- helpers ---------- */
function h(tag,props){
  var el=document.createElement(tag);
  if(props)for(var k in props){
    var v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='value')el.value=v;
    else if(v===true)el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){
      var c=kids[j];
      if(c==null||c===false)continue;
      el.append(c.nodeType?c:document.createTextNode(String(c)));
    }
  }
  return el;
}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function hashOf(s){var n=0;for(var i=0;i<s.length;i++)n=(n*31+s.charCodeAt(i))>>>0;return n}
function wordsOf(t){return (t||'').split(/\s+/).filter(Boolean).length}
function minsOf(w){return Math.max(1,Math.round(w/200))}
function bookWords(b){return b.chapters.reduce(function(a,c){return a+wordsOf(c.text)},0)}
function today(){return new Date().toISOString().slice(0,10)}
function newId(){return 'b'+Math.random().toString(36).slice(2,8)}
function toast(msg){
  var t=document.getElementById('toast');
  if(!t){t=h('div',{id:'toast',role:'status'});document.body.appendChild(t)}
  t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},4200);
}
function twoStep(btn,label,fn){
  var armed=false,t;
  btn.addEventListener('click',function(){
    if(!armed){armed=true;btn.setAttribute('data-armed','1');btn.textContent='Confirmar?';
      t=setTimeout(function(){armed=false;btn.removeAttribute('data-armed');btn.textContent=label},3500);return}
    clearTimeout(t);fn();
  });
}

/* ---------- comments (Supabase) ---------- */
var SUPABASE_URL='';   // ex.: https://xxxx.supabase.co
var SUPABASE_KEY='';   // chave "anon public"
var bookTab='cap',bookTabFor=null;
function cfgOk(){return !!(SUPABASE_URL&&SUPABASE_KEY)}
function sb(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},opts.headers||{});
  return fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,opts).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);
    return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function commentsPanel(b){
  if(!cfgOk())return h('p',{class:'hint',style:'padding-top:20px'},'Os comentários ainda não estão ativados.');
  var list=h('div'),status=h('p',{class:'hint'},'A carregar comentários…');
  var nameI=h('input',{id:'c-name',type:'text',maxlength:40,placeholder:'O teu nome',value:lsGet('estante:cname')||''});
  var bodyI=h('textarea',{id:'c-body',maxlength:1000,placeholder:'Escreve o teu comentário…'});
  var hp=h('input',{class:'hp',type:'text',tabindex:'-1',autocomplete:'off','aria-hidden':'true'});
  var btn=h('button',{class:'btn',type:'submit'},'Comentar');
  function fmt(d){try{return new Date(d).toLocaleDateString('pt-PT',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
  function load(){
    sb('comments?book_id=eq.'+encodeURIComponent(b.id)+'&select=name,body,created_at&order=created_at.desc&limit=200').then(function(rows){
      rows=rows||[];
      status.textContent=rows.length?rows.length+(rows.length===1?' comentário':' comentários'):'Ainda sem comentários. Sê o primeiro.';
      list.replaceChildren.apply(list,rows.map(function(c){
        return h('div',{class:'cm'},h('div',{class:'row2'},h('b',null,c.name),h('span',{class:'mono muted'},fmt(c.created_at))),h('p',null,c.body));
      }));
    }).catch(function(){status.textContent='Não foi possível carregar os comentários.'});
  }
  var form=h('form',{class:'cform',onsubmit:function(ev){
    ev.preventDefault();
    var name=nameI.value.trim(),body=bodyI.value.trim();
    if(!name||!body){toast('Preenche o nome e o comentário.');return}
    if(hp.value){bodyI.value='';return}
    var last=parseInt(lsGet('estante:lastc')||'0',10);
    if(Date.now()-last<30000){toast('Espera uns segundos antes de comentar outra vez.');return}
    btn.disabled=true;
    sb('comments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({book_id:b.id,name:name,body:body})}).then(function(){
      lsSet('estante:cname',name);lsSet('estante:lastc',String(Date.now()));
      bodyI.value='';toast('Comentário publicado.');load();
    }).catch(function(){toast('Não foi possível enviar. Tenta outra vez.')}).then(function(){btn.disabled=false});
  }},
    h('div',{class:'field'},h('label',{for:'c-name'},'Nome'),nameI),
    h('div',{class:'field'},h('label',{for:'c-body'},'Comentário'),bodyI),
    hp,btn);
  load();
  return h('div',{class:'comments'},form,status,list);
}
function bookTabs(b,chlist){
  if(bookTabFor!==b.id){bookTabFor=b.id;bookTab='cap'}
  var panel=h('div'),bCap=h('button',{type:'button'},'Capítulos'),bCom=h('button',{type:'button'},'Comentários');
  function show(){
    bCap.setAttribute('aria-pressed',String(bookTab==='cap'));bCom.setAttribute('aria-pressed',String(bookTab==='com'));
    panel.replaceChildren(bookTab==='cap'?chlist:commentsPanel(b));
  }
  bCap.addEventListener('click',function(){bookTab='cap';show()});
  bCom.addEventListener('click',function(){bookTab='com';show()});
  show();
  return h('div',null,h('div',{class:'tabs',role:'group','aria-label':'Secções do livro'},bCap,bCom),panel);
}

/* ---------- routing ---------- */
function route(){
  var hs=location.hash.replace(/^#/,''),p=hs.split('-');
  if(p[0]==='ler'&&p[1])return{v:'read',id:p[1],n:parseInt(p[2]||'1',10)||1};
  if(p[0]==='livro'&&p[1])return{v:'book',id:p[1]};
  if(hs==='painel')return{v:'admin'};
  return{v:'home'};
}
function findBook(id){return state.books.find(function(b){return b.id===id})}

/* ---------- shared pieces ---------- */
function header(){
  return h('header',{class:'top'},
    h('a',{class:'brand',href:'#'},state.site.name||'Estante'),
    h('nav',null,
      isEditor?h('a',{href:'#painel'},'Painel'):null));
}
function cover(b,extra){
  var pal=PALETTES[(b.pal!=null?b.pal:hashOf(b.id))%PALETTES.length];
  if(b.cover)return h('div',{class:'cover '+(extra||'')},h('img',{src:b.cover,alt:'Capa de '+b.title}));
  return h('div',{class:'cover gen '+(extra||''),style:'--c-bg:'+pal[0]+';--c-fg:'+pal[1]+';--c-ac:'+pal[2]},
    h('span',{class:'c-genre'},b.genre||'Livro'),
    h('span',{class:'c-shape s'+(hashOf(b.id)%3)}),
    h('span',{class:'c-title'},b.title));
}
function footer(){
  return h('footer',{class:'foot'},h('div',{class:'wrap mono'},'© '+new Date().getFullYear()+' '+(state.site.author||state.site.name||'')));
}

/* ---------- views ---------- */
function viewHome(){
  document.body.classList.add('on-hero');
  var books=state.books;
  var nCh=books.reduce(function(a,b){return a+b.chapters.length},0);
  var nW=books.reduce(function(a,b){return a+bookWords(b)},0);
  var last=books.map(function(b){return b.updated||''}).sort().pop();
  var genres=[];books.forEach(function(b){if(b.genre&&genres.indexOf(b.genre)<0)genres.push(b.genre)});
  if(filterGenre&&genres.indexOf(filterGenre)<0)filterGenre=null;
  var shown=books.filter(function(b){return !filterGenre||b.genre===filterGenre});

  var hero=h('section',{class:'hero'},
    h('div',{class:'wrap'},
      header(),
      h('h1',null,state.site.tagline||'Histórias, capítulo a capítulo.'),
      h('div',{class:'by mono'},
        h('span',null,state.site.author||'Autor'),
        books.length?h('span',null,books.length+(books.length===1?' livro':' livros')):null,
        nCh?h('span',null,nCh+' capítulos'):null,
        nW?h('span',null,nW.toLocaleString('pt-PT')+' palavras'):null,
        last?h('span',null,'Atualizado '+new Date(last).toLocaleDateString('pt-PT',{day:'numeric',month:'short',year:'numeric'})):null)));

  var shelf;
  if(!books.length){
    shelf=h('div',{class:'empty'},
      h('h3',null,'A estante está vazia.'),
      h('p',null,'Os livros publicados aparecem aqui, cada um com os seus capítulos prontos a ler no telemóvel.'),
      isEditor?h('a',{class:'btn',href:'#painel'},'Publicar o primeiro livro'):null);
  }else{
    shelf=h('div',{class:'grid'},shown.map(function(b){
      return h('a',{class:'card',href:'#livro-'+b.id},
        cover(b),
        h('div',{class:'card-meta'},
          b.sample?h('span',{class:'tag'},'Exemplo'):null,
          h('h3',null,b.title),
          h('p',{class:'mono muted'},[b.genre,b.status].filter(Boolean).join(' · ')),
          h('p',{class:'sub'},b.chapters.length+(b.chapters.length===1?' capítulo':' capítulos')+' · '+minsOf(bookWords(b))+' min')));
    }));
  }
  var head=h('div',{class:'shelf-head'},
    h('h2',null,'Livros'),
    genres.length>1?h('div',{class:'chips'},
      [h('button',{class:'chip','aria-pressed':String(!filterGenre),onclick:function(){filterGenre=null;render(true)}},'Todos')].concat(
        genres.map(function(g){return h('button',{class:'chip','aria-pressed':String(filterGenre===g),onclick:function(){filterGenre=g;render(true)}},g)}))):null);
  return h('div',null,hero,h('main',{class:'shelf'},h('div',{class:'wrap'},head,shelf)),footer());
}

function viewBook(r){
  var b=findBook(r.id);
  if(!b)return viewHome();
  var pos=parseInt(lsGet('estante:pos:'+b.id)||'0',10);
  var hasPos=pos>=1&&pos<=b.chapters.length;
  var words=bookWords(b);
  var list=h('ol',{class:'chlist'},b.chapters.map(function(c,i){
    return h('li',null,h('a',{href:'#ler-'+b.id+'-'+(i+1)},
      h('span',{class:'n'},String(i+1).padStart(2,'0')),
      h('span',{class:'t'},c.title),
      h('span',{class:'m'},minsOf(wordsOf(c.text))+' min')));
  }));
  return h('div',null,
    h('div',{class:'wrap'},header(),
      h('div',{class:'back mono'},h('a',{href:'#'},'← Todos os livros')),
      h('main',{class:'bookpage'},
        cover(b),
        h('div',{class:'bookinfo'},
          h('div',{class:'row2'},
            b.sample?h('span',{class:'tag'},'Exemplo'):null,
            h('span',{class:'mono muted'},[b.genre,b.status].filter(Boolean).join(' · '))),
          h('h1',null,b.title),
          b.synopsis?h('p',{class:'syn'},b.synopsis):null,
          h('p',{class:'mono muted'},b.chapters.length+' capítulos · '+words.toLocaleString('pt-PT')+' palavras · '+minsOf(words)+' min de leitura'),
          h('div',{class:'btnrow'},
            b.chapters.length?h('a',{class:'btn',href:'#ler-'+b.id+'-'+(hasPos?pos:1)},hasPos&&pos>1?'Continuar no capítulo '+pos:'Ler desde o início'):null,
            isEditor?h('button',{class:'btn ghost',onclick:function(){startEdit(b)}},'Editar livro'):null),
          bookTabs(b,list)))),
    footer());
}

function viewRead(r){
  var b=findBook(r.id);
  if(!b){location.replace('#');return h('div')}
  var i=Math.min(Math.max(r.n,1),b.chapters.length)-1;
  var ch=b.chapters[i];
  if(!ch){location.replace('#livro-'+b.id);return h('div')}
  lsSet('estante:pos:'+b.id,String(i+1));
  var prev=b.chapters[i-1],next=b.chapters[i+1];
  var panel=h('div',{class:'rpanel',hidden:true,id:'rpanel'},
    h('div',{class:'row'},h('span',{class:'mono muted lbl'},'Tamanho'),
      h('button',{class:'btn ghost sm',onclick:function(){setPref('size',Math.max(15,prefs.size-1))}},'A−'),
      h('button',{class:'btn ghost sm',onclick:function(){setPref('size',Math.min(32,prefs.size+1))}},'A+')),
    h('div',{class:'row'},h('span',{class:'mono muted lbl'},'Letra'),
      h('button',{class:'btn ghost sm','data-pref':'font:serif',onclick:function(){setPref('font','serif')}},'Serifa'),
      h('button',{class:'btn ghost sm','data-pref':'font:sans',onclick:function(){setPref('font','sans')}},'Sem serifa')),
    h('div',{class:'row'},h('span',{class:'mono muted lbl'},'Fundo'),
      [['auto','Auto'],['paper','Papel'],['sepia','Sépia'],['night','Noite']].map(function(t){
        return h('button',{class:'btn ghost sm','data-pref':'theme:'+t[0],onclick:function(){setPref('theme',t[0])}},t[1]);
      })));
  var prog=h('div',{class:'rprog'},h('i'));
  progEl=prog.firstChild;
  var view=h('div',null,
    prog,
    h('div',{class:'rbar'},
      h('div',{class:'wrap'},
        h('div',{class:'l mono'},h('a',{href:'#livro-'+b.id},'← Índice'),h('span',{class:'muted'},(i+1)+' / '+b.chapters.length)),
        h('button',{class:'aa','aria-label':'Opções de leitura','aria-expanded':'false',onclick:function(ev){
          var p=document.getElementById('rpanel');p.hidden=!p.hidden;ev.currentTarget.setAttribute('aria-expanded',String(!p.hidden));
        }},'Aa')),
      panel),
    h('article',{class:'reading'},
      h('span',{class:'eyebrow'},b.title),
      h('h2',null,ch.title),
      h('div',{class:'prose'},(ch.text||'').split(/\n{2,}/).map(function(p){return h('p',null,p)})),
      h('nav',{class:'pager'},
        prev?h('a',{class:'btn ghost',href:'#ler-'+b.id+'-'+i},'← Anterior'):h('span'),
        next?h('a',{class:'btn',href:'#ler-'+b.id+'-'+(i+2)},'Seguinte →'):h('a',{class:'btn ghost',href:'#livro-'+b.id},'Fim · Índice'),
        h('div',{class:'share'},h('button',{class:'btn ghost sm',onclick:copyLink},'Copiar link deste capítulo')))));
  return view;
}
function copyLink(){
  var url=location.href;
  try{
    navigator.clipboard.writeText(url).then(function(){toast('Link copiado.')},function(){toast('Copia o endereço na barra do navegador.')});
